<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Carnet Französisch Unité 1</title>
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/bricolage-grotesque-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Playwrite FR Moderne";font-style:normal;font-display:swap;font-weight:100 400;src:url(fonts/playwrite-fr-moderne-wght-normal.woff2) format("woff2")}
/* Layout idea: a French school notebook (Seyès ruling, red margin) lying on a desk;
   inks of the four-colour pen carry meaning: blue = work, green = right, red = correction, black = text. */
:root{
  --desk:#dde3f1;
  --paper:#fdfdf8;
  --ink:#1d2f86;        /* bleu */
  --text:#1f2130;       /* noir */
  --red:#d6382e;        /* rouge */
  --green:#15895a;      /* vert */
  --hi:#ffe45e;         /* surligneur */
  --seyes:#c5cdf3;
  --seyes-fine:#e8ebfa;
  --margin:#f0a29c;
  --soft:#eef1fb;
  --line:#d5daee;
  --muted:#5d6382;
  --font-ui:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-hand:"Playwrite FR Moderne","Segoe Script","Bradley Hand",cursive;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--desk);color:var(--text);font-family:var(--font-ui);font-size:17px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
#app{max-width:780px;margin:0 auto;padding:14px 16px 60px}
.hand{font-family:var(--font-hand);font-weight:400}
.fr{color:var(--ink);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.hidden{display:none!important}
a{color:var(--ink);font-weight:650}

/* ---------- top bar (inside a station / game) ---------- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar .back{border:0;background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:650;box-shadow:0 1px 0 var(--line)}
.bar .ttl{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .snd{border:0;background:var(--paper);border-radius:999px;width:40px;height:40px;font-size:18px;box-shadow:0 1px 0 var(--line)}
.steps{display:flex;gap:5px;margin:0 2px 12px}
.steps i{flex:1;height:6px;border-radius:3px;background:#c8cfe6}
.steps i.on{background:var(--ink)}
.steps i.now{background:var(--hi);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* ---------- paper sheets ---------- */
.sheet{background:var(--paper);border-radius:var(--r);box-shadow:0 1px 0 #c3cae0,0 10px 24px -18px #26306b;padding:18px 18px 20px;position:relative}
.sheet + .sheet{margin-top:14px}
.seyes{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 43px,var(--margin) 43px,var(--margin) 45px,transparent 45px),
    linear-gradient(var(--seyes) 1.5px,transparent 1.5px),
    linear-gradient(var(--seyes-fine) 1px,transparent 1px),
    linear-gradient(90deg,var(--seyes-fine) 1px,transparent 1px);
  background-size:100% 100%,100% 32px,100% 8px,32px 100%;
  background-position:0 0,0 14px,0 14px,13px 0;
}

/* ---------- home ---------- */
.cover{padding:22px 18px 20px 62px;overflow:hidden}
.cover h1{font-family:var(--font-hand);font-weight:400;font-size:38px;line-height:1.5;color:var(--ink)}
.cover .sub{font-weight:650;margin-top:2px}
.cover .hello{margin-top:10px;color:var(--muted)}
.cover .tally{position:absolute;right:16px;top:16px;text-align:center;transform:rotate(6deg);border:3px double var(--red);color:var(--red);border-radius:10px;padding:6px 10px;font-weight:800;line-height:1.1;background:rgba(253,253,248,.85)}
.cover .tally b{display:block;font-size:26px}
.cover .tally span{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.quick button{border:0;border-radius:var(--r);padding:14px 12px;text-align:left;background:var(--ink);color:#fff;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 20px -16px #101a55}
.quick button b{font-size:18px;line-height:1.15;white-space:nowrap}
.quick button span{font-size:13.5px;opacity:.86}
.quick button.alt{background:var(--paper);color:var(--text);box-shadow:0 1px 0 #c3cae0}
.quick button.alt b{color:var(--ink)}
.quick button.red{background:var(--red)}
.h2{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:750;margin:24px 4px 10px}
.stations{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{border:0;background:var(--paper);border-radius:var(--r);padding:14px 14px 14px 16px;text-align:left;display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center;box-shadow:0 1px 0 #c3cae0;position:relative;min-height:96px}
.st:hover{box-shadow:0 1px 0 #c3cae0,0 0 0 2px var(--ink)}
.st .no{font-size:12.5px;font-weight:750;color:var(--muted);letter-spacing:.06em}
.st .t{font-weight:750;font-size:18px;color:var(--ink);line-height:1.2;margin:2px 0}
.st .d{font-size:14px;color:var(--muted);line-height:1.3}
.stamp{width:62px;height:62px;border-radius:50%;border:2px dashed #b9c0dd;display:grid;place-items:center;color:#aab1d0;font-weight:800;font-size:20px}
.stamp.done{border:3px double var(--red);color:var(--red);transform:rotate(-9deg);font-size:10px;line-height:1.15;text-align:center;letter-spacing:.04em;text-transform:uppercase;background:radial-gradient(circle at 30% 30%,rgba(214,56,46,.07),transparent 60%)}
.stamp.done b{display:block;font-size:14px;letter-spacing:.02em}
.stamp.done.s3{border-color:var(--ink);color:var(--ink)}
.parents{margin-top:22px}
.parents summary{cursor:pointer;font-weight:700;color:var(--muted)}
.parents p{margin-top:8px;font-size:15px}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:750;background:var(--ink);color:#fff;font-size:17px;box-shadow:0 3px 0 #101a55}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #101a55}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.go{background:var(--green);box-shadow:0 3px 0 #0b5c3b}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.mid{justify-content:center}
.mt{margin-top:14px}.mt2{margin-top:22px}

/* ---------- chat ---------- */
.chat{background:#e9edf9;border-radius:var(--r);padding:12px 12px 14px;min-height:340px;display:flex;flex-direction:column;gap:9px}
.chat .grp{align-self:center;font-size:13px;color:var(--muted);background:var(--paper);border-radius:999px;padding:3px 12px}
.msg{display:grid;grid-template-columns:34px 1fr;gap:8px;max-width:92%;align-items:end;animation:pop .22s ease-out}
.msg .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.msg .bub{background:var(--paper);border-radius:16px 16px 16px 4px;padding:8px 12px 9px;cursor:pointer;box-shadow:0 1px 0 #cfd5ea}
.msg .who{font-size:12.5px;font-weight:750;margin-bottom:1px}
.msg .txt{font-size:17px}
.msg .de{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);margin-top:6px;padding-top:5px}
.msg.me{align-self:flex-end;grid-template-columns:1fr}
.msg.me .bub{background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;box-shadow:none}
.msg.me .de{color:#cfd6ff;border-color:#5262b4}
.typing{align-self:flex-start;background:var(--paper);border-radius:14px;padding:8px 14px;color:var(--muted);font-size:20px;letter-spacing:3px;line-height:1}
.choice{background:var(--paper);border-radius:var(--r);padding:12px;border:2px solid var(--ink);animation:pop .22s ease-out}
.choice .ask{font-weight:700;margin-bottom:8px}
.choice button{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-top:7px;font-size:17px}
.choice button:hover{border-color:var(--ink)}
.choice button.no{border-color:var(--red);color:#8e8fa3;text-decoration:line-through;animation:shake .3s}
.choice .fb{color:var(--red);font-size:15px;margin-top:8px;font-weight:600}
.tap-tip{font-size:13.5px;color:var(--muted);text-align:center;margin-top:8px}
@keyframes pop{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- rule cards ---------- */
.rule h3{font-size:22px;color:var(--ink);margin-bottom:8px}
.rule p{margin:8px 0}
.rule .kicker{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:4px}
.rule table{border-collapse:collapse;width:100%;margin:10px 0;font-size:16.5px}
.rule td,.rule th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rule th{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.rule .tip{background:linear-gradient(transparent 12%,var(--hi) 12%,var(--hi) 88%,transparent 88%);padding:0 3px;font-weight:650}
.rule .trap{border-left:4px solid var(--red);padding:6px 10px;margin:10px 0;background:#fdf1ef;border-radius:0 10px 10px 0}
.rule .trap b{color:var(--red)}
.rule .ok{border-left:4px solid var(--green);padding:6px 10px;margin:10px 0;background:#eef8f2;border-radius:0 10px 10px 0}
.rule mark{background:var(--hi);padding:0;border-radius:2px;color:inherit}
.rule s{color:#a2a7c0}
.rule .u{color:var(--red);font-weight:750}
.rule .g{color:var(--green);font-weight:750}
.rule .boot tr.ou td{background:var(--soft)}
.rule .count{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.rule .count div{flex:1;min-width:70px;background:var(--soft);border-radius:12px;padding:8px 6px;text-align:center}
.rule .count b{display:block;font-size:26px;color:var(--ink)}
.rule .count span{font-size:13px;color:var(--muted);display:block;line-height:1.25}
.rule .meter{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:10px 0}
.rule .meter .m{font-size:20px;letter-spacing:1px;white-space:nowrap}
.rule .emo{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 0;align-items:baseline}
.rule .emo .e{font-size:24px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

/* ---------- items ---------- */
.prog{height:8px;background:#c8cfe6;border-radius:4px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.item .hint{font-size:14.5px;color:var(--muted);margin-bottom:6px}
.item .q{font-size:22px;line-height:1.4;font-weight:600;margin:4px 0 14px}
.item .q .cue{font-size:15px;color:var(--muted);font-weight:500}
.gap{display:inline-block;min-width:64px;border-bottom:3px solid var(--ink);text-align:center;color:var(--ink);padding:0 4px;line-height:1.1}
.gap.ok{color:var(--green);border-color:var(--green)}
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:18px;text-align:left;font-weight:600;min-height:52px}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--green);background:#e9f7ef;color:#0c5a3a}
.opt.wrong{border-color:var(--red);background:#fdecea;color:#932219}
.opt[disabled]{cursor:default}
.fbk{margin-top:14px;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fbk.good{background:#e3f5ea}
.fbk.bad{background:#fde9e6}
.fbk.near{background:#fff6c9}
.fbk .msg2{flex:1;min-width:200px}
.fbk .msg2 b{display:block}
.fbk.good b{color:var(--green)}.fbk.bad b{color:var(--red)}.fbk.near b{color:#8a6a00}
.fbk .sol{font-weight:700;color:var(--ink)}
.tyrow{display:flex;gap:8px;flex-wrap:wrap}
.tyin{flex:1;min-width:150px;font:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:650}
.acc{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.acc button{border:1.5px solid var(--line);background:#fff;border-radius:8px;min-width:36px;height:36px;font-size:17px;font-weight:650;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:18px;font-weight:600}
.chip.used{opacity:.25}
.chip.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.build{min-height:56px;border-bottom:3px solid var(--ink);margin-bottom:14px;padding-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spot .w{display:inline-block;border:2px solid transparent;border-radius:10px;padding:2px 6px;margin:2px 1px;font-size:22px;font-weight:600;background:transparent;cursor:pointer}
.spot .w:hover{border-color:var(--line)}
.spot .w.bad{border-color:var(--red);color:var(--red);text-decoration:line-through}
.spot .w.fix{border-color:var(--green);color:var(--green)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 16px}
.letters button{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:40px;height:52px;font-size:26px;font-weight:650;color:var(--ink)}
.letters button.mute{background:#e9ebf5;color:#a2a7c0;border-style:dashed;text-decoration:line-through}
.letters button.ok{border-color:var(--green)}
.letters button.miss{border-color:var(--red)}
.letters .sp{width:14px}

/* ---------- sprint / dice ---------- */
.timer{height:10px;border-radius:5px;background:#c8cfe6;overflow:hidden}
.timer i{display:block;height:100%;background:var(--red);width:100%}
.hud{display:flex;justify-content:space-between;font-weight:750;margin:8px 0 14px}
.bigq{text-align:center;margin:10px 0 18px}
.bigq .p{font-size:34px;font-weight:800;color:var(--ink)}
.bigq .v{font-size:17px;color:var(--muted)}
.dice{display:flex;gap:12px;justify-content:center;margin:8px 0 18px}
.die{background:#fff;border:2.5px solid var(--ink);border-radius:16px;min-width:120px;padding:14px 16px;text-align:center;font-size:24px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.die small{display:block;font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.die.roll{animation:roll .45s}
@keyframes roll{0%{transform:rotate(0)}50%{transform:rotate(-8deg) translateY(-8px)}100%{transform:none}}

/* ---------- studio / avatars ---------- */
.studio{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.studio .stage{position:sticky;top:8px;background:var(--soft);border-radius:var(--r);padding:8px;text-align:center}
.studio .stage svg{width:100%;max-width:190px;height:auto}
.ctl{display:grid;gap:10px}
.ctl .grp{background:var(--soft);border-radius:12px;padding:8px 10px}
.ctl .lab{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:5px}
.ctl .pick{display:flex;flex-wrap:wrap;gap:6px}
.ctl .pick + .pick{margin-top:6px}
.pk{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:15.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pk i{width:13px;height:13px;border-radius:50%;border:1.5px solid #1f2130;display:inline-block}
.pk.on{border-color:var(--ink);background:var(--ink);color:#fff}
.descr{margin-top:10px;font-size:17px}
.descr li{margin:4px 0}
.descr li.bad{color:var(--red);font-weight:700}
.descr li.good{color:var(--green)}
.brief{border-left:5px solid var(--ink);background:var(--soft);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:12px}
.brief ul{margin:6px 0 0;padding-left:20px}
.gw-top{position:sticky;top:0;z-index:3;background:var(--paper);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.clues{margin:6px 0 0;padding-left:22px;font-size:17px}
.clues li{margin:3px 0;cursor:pointer}
.clues li.new{background:linear-gradient(transparent 12%,var(--hi) 12%,var(--hi) 88%,transparent 88%)}
.clues .de{display:block;font-size:14px;color:var(--muted)}
.hearts{font-size:20px;letter-spacing:2px}
.gw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.gw button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 2px 2px;position:relative}
.gw button svg{width:100%;height:auto;display:block}
.gw button.out{opacity:.28;background:#eceef6}
.gw button.out::after{content:"";position:absolute;inset:8px;background:linear-gradient(to top right,transparent 47%,var(--red) 47%,var(--red) 53%,transparent 53%)}
.gw button.win{border-color:var(--green);box-shadow:0 0 0 4px #bfe8d2}
.gw button.nope{animation:shake .3s;border-color:var(--red)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:12px;max-width:min(92vw,520px);font-size:15.5px;z-index:20;box-shadow:0 10px 30px -10px #000}

/* ---------- finish ---------- */
.finish{text-align:center;padding:26px 18px;overflow:hidden}
.bigstamp{width:150px;height:150px;border-radius:50%;border:5px double var(--red);color:var(--red);display:grid;place-items:center;margin:6px auto 12px;transform:rotate(-10deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;text-transform:uppercase;font-weight:800;letter-spacing:.08em;font-size:13px;line-height:1.3}
.bigstamp b{display:block;font-size:26px;letter-spacing:.04em}
@keyframes stamp{from{transform:scale(2.4) rotate(8deg);opacity:0}to{transform:rotate(-10deg);opacity:1}}
.stars{font-size:34px;letter-spacing:6px;color:#e2a700}
.stars .off{color:#cfd3e4}
.memo{text-align:left;margin-top:16px}
.memo h3{font-family:var(--font-hand);font-weight:400;color:var(--ink);font-size:22px;line-height:1.6}
.memo ul{margin:6px 0 0;padding-left:22px}
.memo li{margin:5px 0}
.todo{margin-top:14px;text-align:left;border:2px dashed var(--ink);border-radius:12px;padding:10px 12px}
.todo b{color:var(--ink)}

/* ---------- test arena ---------- */
.cloze{font-size:19px;line-height:2.25}
.cloze .cue{color:var(--muted);font-size:14.5px}
.cloze input{font:inherit;font-weight:650;color:var(--ink);border:0;border-bottom:3px solid var(--ink);background:var(--soft);border-radius:6px 6px 0 0;padding:0 6px;width:118px;height:34px;text-align:center}
.cloze input.ok{border-color:var(--green);background:#e3f5ea;color:#0c5a3a}
.cloze input.no{border-color:var(--red);background:#fde9e6;color:#932219;text-decoration:line-through}
.cloze input.near{border-color:#c79a00;background:#fff6c9}
.cloze .fix{color:var(--green);font-weight:750;margin-left:4px}
.cloze .n{font-size:12px;color:var(--muted);vertical-align:super}
.tf{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tf .bt{display:flex;gap:6px}
.tf .bt button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700}
.tf .bt button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tf .bt button.right{background:var(--green);border-color:var(--green);color:#fff}
.tf .bt button.wrong{background:var(--red);border-color:var(--red);color:#fff}
.tf .corr{grid-column:1/-1;font-size:15px;color:var(--muted)}
.readtxt{font-size:18px;line-height:1.6;background:var(--soft);border-radius:12px;padding:12px 14px}
.score{font-size:44px;font-weight:800;color:var(--ink);line-height:1}
.skills{display:grid;gap:6px;margin-top:10px;text-align:left}
.skills .sk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--soft);border-radius:10px;padding:8px 12px}
.skills .sk b.bad{color:var(--red)}.skills .sk b.good{color:var(--green)}
textarea.write{width:100%;min-height:184px;font:inherit;font-size:18px;line-height:32px;padding:23px 12px 10px 58px;background-attachment:local;border:0;border-radius:12px;resize:vertical;color:var(--ink)}
.bingo{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bingo span{border:2px dashed var(--line);border-radius:999px;padding:4px 10px;font-size:14.5px;font-weight:650;color:var(--muted)}
.bingo span.hit{border:2px solid var(--green);background:#e3f5ea;color:#0c5a3a}
.flags{margin:8px 0;padding-left:20px}
.flags li{margin:6px 0}
.flags code{background:#fde9e6;color:#932219;border-radius:5px;padding:1px 5px;font-family:inherit;font-weight:700}
.check label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.menu{display:grid;gap:10px}
.menu button{border:0;background:var(--paper);border-radius:var(--r);padding:14px 16px;text-align:left;box-shadow:0 1px 0 #c3cae0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.menu button:hover{box-shadow:0 1px 0 #c3cae0,0 0 0 2px var(--ink)}
.menu button b{font-size:18px;color:var(--ink)}
.menu button span{font-size:14.5px;color:var(--muted);grid-column:1}
.menu button em{font-style:normal;font-weight:750;color:var(--muted);grid-row:1/3;grid-column:2;font-size:14px}
.name-in{font:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);width:100%;max-width:300px}

@media (max-width:620px){
  body{font-size:16.5px}
  .cover{padding-left:58px}
  .cover h1{font-size:30px}
  .cover h1,.cover .sub{padding-right:88px}
  .quick{grid-template-columns:1fr}
  .quick button{min-height:0;flex-direction:row;align-items:center;gap:10px}
  .stations{grid-template-columns:1fr}
  .studio{grid-template-columns:1fr}
  .studio .stage{display:grid;gap:10px;text-align:left;align-items:center;z-index:4;box-shadow:0 6px 12px -8px #26306b}
  .studio .stage svg{max-width:92px}
  .studio .stage{grid-template-columns:92px 1fr}
  .studio .stage .descr{font-size:14.5px}
  .gw{grid-template-columns:repeat(4,1fr);gap:6px}
  .item .q{font-size:20px}
  .opts.two{grid-template-columns:1fr}
  .die{min-width:104px;font-size:21px}
  .cloze input{width:104px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="app"><noscript>Diese Seite braucht JavaScript.</noscript></div>
<script>
/* ===== Content: Band 2, Unité 1. All French here is original practice material on the unit's language points. ===== */
const WHO = {
  maelle:{n:"Maëlle", c:"#d6382e"},

const STATIONS = [];

/* ---------- 1 · C'est la rentrée ---------- */
STATIONS.push({
  id:"rentree", no:1, t:"C'est la rentrée!", d:"Schule, Klassen, Stundenplan", min:5,
  chat:[
    {f:"maelle", fr:"Salut tout le monde! C'est la rentrée! 🎒", de:"Hallo zusammen! Die Schule geht wieder los!"},
    {f:"nino", fr:"Oh non… Finies les vacances! 😭", de:"Oh nein … Die Ferien sind vorbei!"},
    {f:"ines", fr:"Moi, je suis contente: je retrouve mes copains!", de:"Ich freue mich: Ich treffe meine Freunde wieder!"},
    {f:"sacha", fr:"Bonjour! Je suis nouveau au collège. Je m'appelle Sacha.", de:"Hallo! Ich bin neu an der Schule. Ich heiße Sacha."},
    {ask:"Sacha ist neu. Was antwortest du ihm?", o:[
      {t:"Salut Sacha! Bienvenue en cinquième B!", ok:1, de:"Hallo Sacha! Willkommen in der 5e B!"},
      {t:"Bonjour madame!", fb:"«Madame» sagst du zu einer erwachsenen Frau. Sacha ist ein Mitschüler."},
      {t:"Au revoir, Sacha!", fb:"«Au revoir» heißt «Auf Wiedersehen». Du willst ihn doch begrüßen!"}]},
    {f:"sacha", fr:"Merci{,n}! On est en quelle salle?", de:"Danke! In welchem Raum sind wir?"},
    {f:"maelle", fr:"Salle 12. Regarde l'emploi du temps: à 10 heures, on a E.P.S. au gymnase.", de:"Raum 12. Schau auf den Stundenplan: Um 10 Uhr haben wir Sport in der Turnhalle."},
    {f:"nino", fr:"Et à midi, on prend le repas à la cantine. 🍝 C'est ma matière préférée!", de:"Und mittags essen wir in der Kantine. Das ist mein Lieblingsfach!"},
    {ask:"Achtung, falscher Freund! Was ist «le gymnase»?", o:[
      {t:"die Turnhalle", ok:1, say:"le gymnase"},
      {t:"das Gymnasium", fb:"Falle! Deine Schule heißt auf Französisch «le collège» (bis Klasse 9), danach «le lycée»."},

  ],
  rules:[
    `<div class="kicker">Karte 1 · Klassen im Collège</div>
     <h3>In Frankreich zählt man rückwärts</h3>
     <p>Das Collège beginnt mit der <span class="fr">sixième</span> und endet mit der <span class="fr">troisième</span>. Wie ein Countdown bis zum Lycée.</p>
     <div class="count">
       <div><b>6<sup>e</sup></b><span class="fr">la sixième</span><span>11 Jahre · 6. Klasse</span></div>
       <div><b>5<sup>e</sup></b><span class="fr">la cinquième</span><span>12 Jahre · 7. Klasse</span></div>
       <div><b>4<sup>e</sup></b><span class="fr">la quatrième</span><span>13 Jahre · 8. Klasse</span></div>

     </div>
     <p>So sagst du es: <span class="fr">Je suis <mark>en</mark> cinquième.</span> (Ich bin in der 7. Klasse.)</p>
     <div class="ok">Rechentrick: deutsche Klasse + französische Klasse = <b>12</b>. Also 7. Klasse → 5<sup>e</sup>.</div>`,
    `<div class="kicker">Karte 2 · Vorbei!</div>
     <h3>Fini, finie, finis, finies</h3>
     <p><span class="fr">fini</span> heißt «vorbei, zu Ende». Es richtet sich nach dem Nomen dahinter. Man hört den Unterschied nicht, aber man schreibt ihn.</p>
     <table>
       <tr><td class="fr">Fin<mark>i</mark> le sport à la plage!</td><td>le sport: männlich</td></tr>
       <tr><td class="fr">Fin<mark>ie</mark> la récré!</td><td>la récré: weiblich → +e</td></tr>
       <tr><td class="fr">Fin<mark>is</mark> les repas dans la nature!</td><td>les repas: männlich, Mehrzahl → +s</td></tr>
       <tr><td class="fr">Fin<mark>ies</mark> les vacances!</td><td>les vacances: weiblich, Mehrzahl → +es</td></tr>
     </table>
     <div class="trap"><b>Falle:</b> <span class="fr">le gymnase</span> ist die Turnhalle, nicht das Gymnasium.</div>`
  ],
  items:[
    {t:"mc", k:"ecole", q:"Lina a 11 ans. Elle est en ___.", o:["sixième","cinquième","troisième"], a:0, w:"Mit 11 beginnt das Collège: la sixième (6. Klasse)."},

    {t:"mc", k:"ecole", q:"En Allemagne, tu es en «7. Klasse». En France, tu es en ___.", o:["septième","cinquième","troisième"], a:1, w:"7 + 5 = 12. Die 7. Klasse heißt la cinquième."},
    {t:"mc", k:"ecole", q:"Emma a 14 ans: elle est en ___.", o:["troisième","quatrième","sixième"], a:0, w:"Letztes Jahr im Collège: la troisième (9. Klasse)."},
    {t:"mc", k:"ecole", q:"___ les vacances!", o:["Fini","Finis","Finies"], a:2, w:"les vacances ist weiblich und Mehrzahl → Finies."},
    {t:"mc", k:"ecole", q:"___ le sport à la plage!", o:["Fini","Finie","Finies"], a:0, w:"le sport ist männlich, Einzahl → Fini."},
    {t:"mc", k:"ecole", q:"___ les repas dans la nature!", o:["Finie","Finis","Finies"], a:1, w:"le repas ist männlich; Mehrzahl → Finis."},
    {t:"mc", k:"ecole", q:"On a E.P.S. On va ___.", o:["au gymnase","à la cantine","au CDI"], a:0, w:"E.P.S. ist Sport. Sport macht man in der Turnhalle: au gymnase."},

    {t:"or", k:"ecole", de:"Die Schüler gehen in den Klassenraum.", s:"Les élèves entrent dans la salle de cours ."},

/* ---------- 2 · Beau et nouveau ---------- */
STATIONS.push({

    {f:"nino", fr:"Regardez! J'ai un nouveau t-shirt. 😎", de:"Schaut mal! Ich habe ein neues T-Shirt."},
    {f:"ines", fr:"Il est beau! Et moi, j'ai une nouvelle casquette.", de:"Es ist schön! Und ich habe eine neue Mütze."},

    {f:"nino", fr:"Un nouvel anorak? Pourquoi pas «nouveau»?", de:"Ein «nouvel» Anorak? Warum nicht «nouveau»?"},

    {ask:"Sacha ist neu in der Klasse. Wie sagst du das?", o:[
      {t:"C'est un nouvel élève.", ok:1, de:"Er ist ein neuer Schüler."},
      {t:"C'est un nouveau élève.", fb:"o und é stoßen zusammen. Vor einem Vokal wird nouveau zu nouvel."},
      {t:"C'est une nouvelle élève.", fb:"Das wäre eine neue Schülerin. Sacha ist ein Junge."}]},
    {f:"sacha", fr:"Merci! Et vous avez tous un beau look pour la rentrée. 👍", de:"Danke! Und ihr habt alle ein schönes Outfit zum Schulanfang."},
    {f:"ines", fr:"Regarde aussi mes nouvelles chaussures! Elles sont belles, non?", de:"Schau dir auch meine neuen Schuhe an! Sie sind schön, oder?"}
  ],
  rules:[
    `<div class="kicker">Karte 1 · Die Formen</div>
     <h3>beau und nouveau haben eine Extraform</h3>
     <table>
       <tr><th></th><th>schön</th><th>neu</th></tr>
       <tr><td>männlich</td><td class="fr">un beau pull</td><td class="fr">un nouveau pull</td></tr>
       <tr><td>männlich + Vokal / stummes h</td><td class="fr">un <mark>bel</mark> anorak</td><td class="fr">un <mark>nouvel</mark> ami</td></tr>
       <tr><td>weiblich</td><td class="fr">une belle veste</td><td class="fr">une nouvelle veste</td></tr>
       <tr><td>Mehrzahl männlich</td><td class="fr">des beau<mark>x</mark> pulls</td><td class="fr">des nouveau<mark>x</mark> amis</td></tr>
       <tr><td>Mehrzahl weiblich</td><td class="fr">des belles vestes</td><td class="fr">des nouvelles vestes</td></tr>
     </table>
     <div class="ok">Das kennst du aus dem Englischen: <b>a</b> pullover, aber <b>an</b> anorak. Französisch macht dasselbe mit beau → <span class="fr">bel</span> und nouveau → <span class="fr">nouvel</span>.</div>`,
    `<div class="kicker">Karte 2 · Drei Dinge, die Punkte bringen</div>
     <h3>Davor, mit x, nur in der Einzahl</h3>
     <p><span class="tip">1 · Davor.</span> beau und nouveau stehen <b>vor</b> dem Nomen. Farben stehen dahinter: <span class="fr">un beau pull rouge</span>.</p>
     <p><span class="tip">2 · Mit x.</span> Mehrzahl männlich: <span class="fr">beaux, nouveaux</span>. Nie mit s.</p>
     <p><span class="tip">3 · Nur Einzahl.</span> bel und nouvel gibt es nur in der Einzahl: <span class="fr">un nouvel ami</span>, aber <span class="fr">des nouveaux amis</span>.</p>
     <div class="trap"><b>Falle:</b> <span class="fr">une année, une amie, une histoire</span> sind weiblich. Dann immer <span class="fr">nouvelle / belle</span>, egal welcher Buchstabe folgt.</div>
     <p class="small muted">bel klingt genau wie belle, nouvel wie nouvelle.</p>`
  ],
  items:[
    {t:"mc", k:"g1", q:"<span class='cue'>(beau)</span> un ___ t-shirt", o:["beau","bel","belle"], a:0, w:"t-shirt beginnt mit einem Konsonanten → beau."},
    {t:"mc", k:"g1", q:"<span class='cue'>(beau)</span> un ___ anorak", o:["beau","bel","belle"], a:1, w:"männlich + Vokal → bel. Wie «an anorak»."},
    {t:"mc", k:"g1", q:"<span class='cue'>(beau)</span> une ___ robe", o:["beau","bel","belle"], a:2, w:"une robe ist weiblich → belle."},
    {t:"mc", k:"g1", q:"<span class='cue'>(beau)</span> des ___ chaussures", o:["beaux","bels","belles"], a:2, w:"les chaussures: weiblich, Mehrzahl → belles."},
    {t:"mc", k:"g1", q:"<span class='cue'>(beau)</span> des ___ pulls", o:["beaus","beaux","bels"], a:1, w:"Mehrzahl männlich → beaux, mit x."},

    {t:"mc", k:"g1", q:"<span class='cue'>(beau)</span> des ___ anoraks", o:["bels","beaux","belles"], a:1, w:"bel gibt es nur in der Einzahl. Mehrzahl: beaux."},
    {t:"mc", k:"g1", q:"<span class='cue'>(nouveau)</span> un ___ emploi du temps", o:["nouveau","nouvel","nouvelle"], a:1, w:"emploi beginnt mit Vokal → nouvel."},
    {t:"mc", k:"g1", q:"<span class='cue'>(nouveau)</span> une ___ copine", o:["nouveau","nouvel","nouvelle"], a:2, w:"une copine ist weiblich → nouvelle."},

    {t:"sp", k:"g1", s:"C'est un beau anorak .", bad:"beau", fix:"bel", w:"Vor Vokal: un bel anorak."},
    {t:"sp", k:"g1", s:"Elle a une nouveau veste .", bad:"nouveau", fix:"nouvelle", w:"une veste ist weiblich → nouvelle."}
  ],
  memo:["Vor Vokal oder stummem h: <span class='fr'>un bel anorak, un nouvel élève</span> (wie a / an).","Mehrzahl männlich mit x: <span class='fr'>beaux, nouveaux</span>. Kein bel / nouvel in der Mehrzahl.","Weiblich immer <span class='fr'>belle / nouvelle</span>: <span class='fr'>une nouvelle année</span>."],
  todo:"Such dir drei Dinge in deinem Zimmer und sag, ob sie neu oder schön sind: «J'ai un nouvel ordinateur. Il est beau!»"
});

/* ---------- 3 · Trop de devoirs ---------- */
STATIONS.push({
  id:"de", no:3, t:"Trop de devoirs!", d:"Mengen mit de · ne … plus", min:5,

    `<div class="kicker">Karte 1 · Der Mengen-Kleber</div>

const KEY = "carnet-fr-b2-v1";
function defState(){ return {name:"", asked:false, st:{}, box:{}, best:{}, snd:true, days:[], drafts:{}, tests:{}}; }
let S = defState();
try { S = Object.assign(defState(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ===== helpers ===== */
const app = document.getElementById("app");
const DBG = window.__dbg = {};
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function h(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function sample(a, n){ return shuffle(a).slice(0, n); }
function norm(s){ return String(s).trim().toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, " ").replace(/[.!?]+$/,"").trim(); }
function bare(s){ return norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/œ/g, "oe"); }
function today(){ const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function fillName(s){ return s.replace(/\{,n\}/g, S.name ? ", " + S.name : ""); }
function starsHtml(n){ return '<span class="stars" aria-label="' + n + ' von 3 Sternen">' + [1,2,3].map(i => i <= n ? "★" : '<span class="off">★</span>').join("") + "</span>"; }
function starsFor(right, total){ if(!total) return 3; const r = right / total; return r >= 0.9 ? 3 : r >= 0.7 ? 2 : 1; }
let toastT = null;
function toast(msg, ms){ $$(".toast").forEach(x => x.remove()); const t = h('<div class="toast" role="status">' + msg + "</div>"); document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), ms || 2600); }

/* ===== speech ===== */
const TTS = {ok: "speechSynthesis" in window, voice: null};
function pickVoice(){ if(!TTS.ok) return; try { const vs = speechSynthesis.getVoices(); TTS.voice = vs.find(v => /^fr[-_]FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null; } catch(e){} }
if(TTS.ok){ pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch(e){} }
function plain(s){ return String(s).replace(/<[^>]+>/g, " ").replace(/\([^)]*\)/g, " ").replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{FE0F}\u{200D}]/gu, " ").replace(/[«»…]/g, " ").replace(/\s+/g, " ").trim(); }
function speak(t){ if(!S.snd || !TTS.ok) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(t)); u.lang = "fr-FR"; if(TTS.voice) u.voice = TTS.voice; u.rate = 0.9; speechSynthesis.speak(u); } catch(e){} }
function hush(){ if(TTS.ok){ try { speechSynthesis.cancel(); } catch(e){} } }

STATIONS.forEach(st => (st.items || []).forEach((it, i) => { it.id = st.id + "-" + i; it.st = st.id; ITEMS[it.id] = it; }));
DIRE.forEach((it, i) => { it.id = "dire-" + i; ITEMS[it.id] = it; });
function markItem(it, ok){
  if(!it || !it.id) return;
  if(!ok) S.box[it.id] = 2;
  else if(S.box[it.id]){ S.box[it.id]--; if(S.box[it.id] <= 0) delete S.box[it.id]; }
  save();
}
function boxIds(){ return Object.keys(S.box).filter(id => ITEMS[id]); }

/* ===== routing ===== */
let cleanup = null;
function setView(node, hash){
  if(cleanup){ try { cleanup(); } catch(e){} cleanup = null; }
  hush(); $$(".toast").forEach(x => x.remove());
  app.innerHTML = ""; app.appendChild(node); window.scrollTo(0, 0);
}
let lastRouted = null;
function curHash(){ return (location.hash || "").replace("#", ""); }
function routeTo(k){
  lastRouted = k;
  if(k === "test") return viewTest();
  if(k === "regeln") return viewSheet();
  if(k.indexOf("station-") === 0){ const st = STATIONS.find(s => s.id === k.slice(8)); if(st) return viewStation(st); }
  lastRouted = ""; viewHome();
}
function nav(k){ try { if(curHash() !== k) location.hash = k; } catch(e){} routeTo(k); }
function route(){ routeTo(curHash()); }
window.addEventListener("hashchange", () => { if(curHash() !== lastRouted) routeTo(curHash()); });

function topBar(title, onBack){
  const b = h('<div class="bar"><button class="back" type="button">← Carnet</button><div class="ttl"></div><button class="snd" type="button" aria-label="Ton an oder aus"></button></div>');
  $(".ttl", b).innerHTML = title;
  $(".back", b).onclick = onBack || (() => nav(""));
  const s = $(".snd", b);
  const paint = () => { s.textContent = S.snd ? "🔊" : "🔇"; s.title = S.snd ? "Vorlesen ist an" : "Vorlesen ist aus"; };
  paint(); s.onclick = () => { S.snd = !S.snd; save(); paint(); if(!S.snd) hush(); };
  if(!TTS.ok) s.classList.add("hidden");
  return b;
}

/* ===== station flow ===== */
function viewStation(st){
  const steps = [];
  if(st.chat) steps.push(["Chat", chatStep]);
  if(st.rules) steps.push(["Regel", rulesStep]);
  if(st.sprint) steps.push(["Sprint", sprintStep]);
  if(st.dice) steps.push(["Würfel", diceStep]);
  if(st.studio) steps.push(["Studio", studioStep]);
  if(st.guess) steps.push(["Rätsel", guessStep]);
  if(st.items) steps.push(["Training", itemsStep]);
  let i = 0, right = 0, total = 0;
  const v = h('<div></div>');
  v.appendChild(topBar((st.bonus ? "Bonus" : "Station " + st.no) + " · " + st.t));
  const dots = h('<div class="steps" aria-hidden="true"></div>'); v.appendChild(dots);
  const host = h('<section class="sheet"></section>'); v.appendChild(host);
  function show(){
    hush(); $$(".toast").forEach(x => x.remove());
    dots.innerHTML = steps.map((s, k) => `<i class="${k < i ? "on" : k === i ? "now" : ""}"></i>`).join("");
    host.className = "sheet"; host.innerHTML = "";
    if(i >= steps.length) return finish();
    steps[i][1](host, st, res => { if(res){ right += res.right || 0; total += res.total || 0; } i++; show(); window.scrollTo(0, 0); });
  }
  function finish(){
    const stars = starsFor(right, total);
    const prev = S.st[st.id] || {};
    S.st[st.id] = {done:true, stars:Math.max(prev.stars || 0, stars), n:(prev.n || 0) + 1};
    if(S.days.indexOf(today()) < 0) S.days.push(today());
    save();
    host.className = "sheet finish";
    host.innerHTML = `<div class="bigstamp"><span>Station ${st.no}<b>validé</b>${today().split("-").reverse().join(".")}</span></div>
      ${starsHtml(stars)}
      <p class="mt">${total ? right + " von " + total + " Punkten. " : ""}${stars === 3 ? "Sauber gelöst!" : stars === 2 ? "Gut gemacht! Mit einer zweiten Runde holst du den dritten Stern." : "Geschafft! Schau dir den Merkzettel an und spiel die Station morgen noch einmal."}</p>
      <div class="memo"><h3>À retenir</h3><ul>${st.memo.map(m => "<li>" + m + "</li>").join("")}</ul></div>
      <div class="todo"><b>Mini-Mission für heute:</b> ${st.todo}</div>
      <div class="row mid mt2"><button class="btn" id="home">Zurück zum Carnet</button><button class="btn ghost" id="again">Nochmal spielen</button></div>`;
    $("#home", host).onclick = () => nav("");
    $("#again", host).onclick = () => viewStation(st);
  }
  setView(v, "station-" + st.id);
  show();
}

/* ----- chat ----- */
function chatStep(host, st, done){
  host.innerHTML = `<div class="chat" aria-live="polite"><div class="grp">Groupe · La 5<sup>e</sup> B</div></div>
    <p class="tap-tip">Tippe auf eine Nachricht: Du siehst die Übersetzung und hörst sie noch einmal.</p>
    <div class="row end mt"><button class="btn" id="nx" type="button">Weiter</button></div>`;
  const box = $(".chat", host), nx = $("#nx", host);
  let i = 0;
  function bubble(m, me){
    const w = WHO[m.f] || {};
    const fr = fillName(m.fr);
    const n = h(`<div class="msg ${me ? "me" : ""}">${me ? "" : `<div class="av" style="background:${w.c}">${w.n[0]}</div>`}<div class="bub" tabindex="0" role="button"><div class="who" style="color:${me ? "#cfd6ff" : w.c}">${me ? (S.name ? esc(S.name) : "Toi") : w.n}</div><div class="txt" lang="fr">${fr}</div>${m.de ? `<div class="de hidden">${m.de}</div>` : ""}</div></div>`);
    const tog = () => { const d = $(".de", n); if(d) d.classList.toggle("hidden"); speak(m.spk || fr); };
    $(".bub", n).onclick = tog;

function itemsStep(host, st, done){

function pickItems(pool, n){

/* ----- describing an avatar in French and German ----- */
function deAdj(c, dg){ const k = COL[c]; return k.inv ? k.de : k.de + ({m:"en", f:"e", n:"es", p:"e"})[dg]; }
function deArt(dg){ return ({m:"einen", f:"eine", n:"ein"})[dg]; }
function frGarm(t, c){ const g = GARM[t]; return (g.g === "m" ? "un " : "une ") + g.fr + (t === "jean" ? "" : " " + COL[c][g.g]); }
function deGarm(t, c){ const g = GARM[t]; return t === "jean" ? "eine Jeans" : deArt(g.dg) + " " + deAdj(c, g.dg) + " " + g.de; }
function describe(a, feats){
  const P = a.g === "f" ? "Elle" : "Il", D = a.g === "f" ? "Sie" : "Er", out = [];
  out.push({k:"g", fr: a.g === "f" ? "C'est une fille." : "C'est un garçon.", de: a.g === "f" ? "Das ist ein Mädchen." : "Das ist ein Junge."});
  if(feats.indexOf("hair") >= 0) out.push({k:"hair", fr:`${P} a les cheveux ${a.hairLen === "long" ? "longs" : "courts"} et ${HAIR[a.hairCol].fr}.`, de:`${D} hat ${a.hairLen === "long" ? "lange" : "kurze"} ${HAIR[a.hairCol].de} Haare.`});
  if(feats.indexOf("eyes") >= 0) out.push({k:"eyes", fr:`${P} a les yeux ${EYES[a.eyes].fr}.`, de:`${D} hat ${EYES[a.eyes].de} Augen.`});
  if(feats.indexOf("lunettes") >= 0) out.push(a.lunettes ? {k:"lunettes", fr:`${P} porte des lunettes ${COL[a.lunettes].fp}.`, de:`${D} trägt eine ${deAdj(a.lunettes, "f")} Brille.`} : {k:"lunettes", fr:`${P} ne porte pas de lunettes.`, de:`${D} trägt keine Brille.`});
  if(feats.indexOf("casquette") >= 0) out.push(a.casquette ? {k:"casquette", fr:`${P} porte une casquette ${COL[a.casquette].f}.`, de:`${D} trägt eine ${deAdj(a.casquette, "f")} Mütze.`} : {k:"casquette", fr:`${P} ne porte pas de casquette.`, de:`${D} trägt keine Mütze.`});
  if(feats.indexOf("top") >= 0){
    const sh = `des chaussures ${COL[a.shoes].fp}`, shd = `${deAdj(a.shoes, "p")} Schuhe`;
    if(a.top.t === "robe") out.push({k:"outfit", fr:`${P} porte ${frGarm("robe", a.top.c)} et ${sh}.`, de:`${D} trägt ${deGarm("robe", a.top.c)} und ${shd}.`});
    else out.push({k:"outfit", fr:`${P} porte ${frGarm(a.top.t, a.top.c)}, ${frGarm(a.bottom.t, a.bottom.c)} et ${sh}.`, de:`${D} trägt ${deGarm(a.top.t, a.top.c)}, ${deGarm(a.bottom.t, a.bottom.c)} und ${shd}.`});
  }
  return out;
}
function sameOn(a, b, k){
  if(k === "g") return true;
  if(k === "hair") return a.hairLen === b.hairLen && a.hairCol === b.hairCol;
  if(k === "eyes") return a.eyes === b.eyes;
  if(k === "lunettes") return (a.lunettes || null) === (b.lunettes || null);
  if(k === "casquette") return (a.casquette || null) === (b.casquette || null);
  if(k === "outfit"){
    if(a.top.t !== b.top.t || a.top.c !== b.top.c || a.shoes !== b.shoes) return false;
    if(b.top.t === "robe") return true;
    return a.bottom.t === b.bottom.t && (b.bottom.t === "jean" || a.bottom.c === b.bottom.c);
  }
  return true;
}

/* ----- Qui est-ce? ----- */
function randAvatar(g){
  const tt = g === "f" ? pick(["tshirt","pull","veste","robe","pull","veste"]) : pick(["tshirt","pull","veste"]);
  const bt = g === "f" ? pick(["jean","pantalon","jupe"]) : pick(["jean","pantalon"]);
  return {g, skin: Math.floor(Math.random() * 4), hairLen: g === "f" ? pick(["long","long","court"]) : pick(["court","court","long"]), hairCol: pick(Object.keys(HAIR)), eyes:"marron",
    lunettes: Math.random() < 0.4 ? "noir" : null, casquette: Math.random() < 0.3 ? pick(["rouge","bleu","vert","jaune"]) : null,
    top:{t: tt, c: pick(["rouge","bleu","vert","jaune","orange","rose","blanc"])}, bottom:{t: bt, c: pick(["noir","gris","vert","rouge"])}, shoes: pick(["noir","blanc","rouge","vert","orange"])};
}
function gwClues(T){
  const P = T.g === "f" ? "Elle" : "Il", D = T.g === "f" ? "Sie" : "Er", N = T.g === "f" ? "une fille" : "un garçon", c = [];
  c.push({fr:`${P} a les cheveux ${T.hairLen === "long" ? "longs" : "courts"}.`, de:`${D} hat ${T.hairLen === "long" ? "lange" : "kurze"} Haare.`, ok: a => a.hairLen === T.hairLen});
  const short = {brun:["brun","brune"], blond:["blond","blonde"], roux:["roux","rousse"]}[T.hairCol];
  c.push(short && Math.random() < 0.5 ? {fr:`${P} est ${short[T.g === "f" ? 1 : 0]}.`, de:`${D} hat ${HAIR[T.hairCol].de} Haare.`, ok: a => a.hairCol === T.hairCol} : {fr:`${P} a les cheveux ${HAIR[T.hairCol].fr}.`, de:`${D} hat ${HAIR[T.hairCol].de} Haare.`, ok: a => a.hairCol === T.hairCol});
  c.push(T.lunettes ? {fr:`${P} porte des lunettes.`, de:`${D} trägt eine Brille.`, ok: a => !!a.lunettes} : {fr:`${P} ne porte pas de lunettes.`, de:`${D} trägt keine Brille.`, ok: a => !a.lunettes});
  c.push(T.casquette ? {fr:`C'est ${N} qui porte une casquette ${COL[T.casquette].f}.`, de:`Das ist ${T.g === "f" ? "ein Mädchen, das" : "ein Junge, der"} eine ${deAdj(T.casquette, "f")} Mütze trägt.`, ok: a => a.casquette === T.casquette} : {fr:`${P} ne porte pas de casquette.`, de:`${D} trägt keine Mütze.`, ok: a => !a.casquette});
  const tg = GARM[T.top.t];
  c.push(Math.random() < 0.5 ? {fr:`${P} porte ${frGarm(T.top.t, T.top.c)}.`, de:`${D} trägt ${deGarm(T.top.t, T.top.c)}.`, ok: a => a.top.t === T.top.t && a.top.c === T.top.c}
    : {fr:`${tg.g === "m" ? "Le" : "La"} ${tg.fr} qu'${P.toLowerCase()} porte est ${COL[T.top.c][tg.g]}.`, de:`${({m:"Der",f:"Die",n:"Das"})[tg.dg]} ${tg.de}, ${({m:"den",f:"die",n:"das"})[tg.dg]} ${D.toLowerCase()} trägt, ist ${COL[T.top.c].de}.`, ok: a => a.top.t === T.top.t && a.top.c === T.top.c});
  if(T.top.t !== "robe") c.push({fr:`${P} porte ${frGarm(T.bottom.t, T.bottom.c)}.`, de:`${D} trägt ${deGarm(T.bottom.t, T.bottom.c)}.`, ok: a => a.top.t !== "robe" && a.bottom.t === T.bottom.t && (T.bottom.t === "jean" || a.bottom.c === T.bottom.c)});
  c.push({fr:`${P} a des chaussures ${COL[T.shoes].fp}.`, de:`${D} hat ${deAdj(T.shoes, "p")} Schuhe.`, ok: a => a.shoes === T.shoes});
  return shuffle(c);
}
function gwSet(g){
  for(let guard = 0; guard < 60; guard++){
    const T = randAvatar(g), clues = gwClues(T), all = [T];
    const mut = a => { const b = JSON.parse(JSON.stringify(a)); const r = randAvatar(g); const k = pick(["hairLen","hairCol","lunettes","casquette","top","bottom","shoes"]); b[k] = r[k]; b.skin = r.skin; return b; };
    let tries = 0;
    while(all.length < 12 && tries++ < 400){
      let c = all.length < 4 ? mut(T) : all.length < 7 ? mut(mut(mut(T))) : randAvatar(g);
      if(c.top.t === "robe") c.bottom = c.bottom || {t:"jupe", c:"noir"};
      if(clues.every(q => q.ok(c))) continue;
      if(all.some(x => JSON.stringify(x) === JSON.stringify(c))) continue;
      all.push(c);
    }
    if(all.length === 12) return {T, clues, all: shuffle(all)};
  }
  return null;
}
function guessStep(host, st, done){
  const rounds = st.guess.rounds; let r = 0, right = 0;
  function round(){
    let set = null; while(!set) set = gwSet(rounds[r]); let shown = 1, hearts = 3, over = false; DBG.gw = set;
    const out = new Set();
    host.innerHTML = `<div class="gw-top"><div class="row" style="justify-content:space-between"><b>Runde ${r + 1} von ${rounds.length} · ${rounds[r] === "f" ? "Qui est la fille?" : "Qui est le garçon?"}</b><span class="hearts" aria-label="Versuche"></span></div>
      <p class="small muted">Lies die Hinweise. Tippe alle weg, die nicht passen, bis nur eine Person übrig ist.</p>
      <ol class="clues" lang="fr"></ol><div class="row mt"><button class="btn ghost" id="more" type="button">Nächster Hinweis</button><button class="btn go hidden" id="nx" type="button">Weiter →</button></div></div><div class="gw"></div>`;
    const ol = $(".clues", host), grid = $(".gw", host), more = $("#more", host), nx = $("#nx", host);
    function hearts_(){ $(".hearts", host).textContent = "♥".repeat(hearts) + "♡".repeat(3 - hearts); }
    function clues(){
      ol.innerHTML = "";
      set.clues.slice(0, shown).forEach((c, i) => { const li = h(`<li class="${i === shown - 1 ? "new" : ""}">${c.fr}<span class="de hidden">${c.de}</span></li>`); li.onclick = () => { $(".de", li).classList.toggle("hidden"); speak(c.fr); }; ol.appendChild(li); });
      more.disabled = shown >= set.clues.length;
      if(shown >= set.clues.length) more.textContent = "Alle Hinweise sind da";
    }
    function end(win){
      over = true; more.classList.add("hidden"); nx.classList.remove("hidden");
      $$("button", grid).forEach((b, i) => { if(set.all[i] === set.T) b.classList.add("win"); else b.classList.add("out"); });
      right += win ? hearts : 0;
      toast(win ? "Gefunden! Lies die Hinweise noch einmal laut." : "Die gesuchte Person ist grün markiert. Vergleiche sie mit den Hinweisen.", 3800);
      shown = set.clues.length; clues(); nx.focus();
    }
    set.all.forEach((a, i) => {
      const b = h(`<button type="button" aria-label="Person ${i + 1}">${avatarSVG(a)}</button>`);
      b.onclick = () => {
        if(over || out.has(i)) return;
        const seen = set.clues.slice(0, shown);
        if(a === set.T){ hearts--; hearts_(); b.classList.add("nope"); setTimeout(() => b.classList.remove("nope"), 400); toast("Stopp! Diese Person passt zu allen Hinweisen. Lies noch einmal genau."); if(hearts <= 0) end(false); return; }
        if(seen.every(q => q.ok(a))){ b.classList.add("nope"); setTimeout(() => b.classList.remove("nope"), 400); toast("Noch nicht sicher: Zu den bisherigen Hinweisen passt diese Person noch. Hol dir den nächsten Hinweis."); return; }
        out.add(i); b.classList.add("out");
        if(out.size === set.all.length - 1) end(true);
      };
      grid.appendChild(b);
    });
    more.onclick = () => { if(shown < set.clues.length){ shown++; clues(); speak(set.clues[shown - 1].fr); } };
    nx.onclick = () => { r++; if(r < rounds.length){ round(); window.scrollTo(0, 0); } else done({right, total: rounds.length * 3}); };
    hearts_(); clues();
  }
  round();
}

/* ----- verb sprint ----- */
function verbQ(verbs){
  const v = pick(verbs), pi = Math.floor(Math.random() * 6), p = pick(PRON[pi]), form = VERBS[v][pi];
  const shown = p === "je" && /^[aeiouéèh]/.test(form) ? "j'" : p;
  return {v, pi, p: shown, form};
}
function sprintStep(host, st, done){
  const verbs = st.sprint.verbs, secs = st.sprint.secs;
  host.innerHTML = `<div class="rule"><div class="kicker">Sprint · ${secs} Sekunden</div><h3>Welche Form passt?</h3><p>Du siehst ein Pronomen und ein Verb. Tippe so schnell du kannst die richtige Form an. Jede richtige Antwort zählt, Serien bringen Extra-Punkte.</p>${S.best[st.id] ? `<p class="muted">Dein Rekord: <b>${S.best[st.id]}</b> Punkte</p>` : ""}</div><div class="row end mt"><button class="btn" id="go" type="button">Start</button></div>`;
  $("#go", host).onclick = run;
  function run(){
    let t = secs * 10, score = 0, streak = 0, okN = 0, lock = false, q = null; const miss = [];
    host.innerHTML = `<div class="timer"><i></i></div><div class="hud"><span>Punkte: <b id="sc">0</b></span><span id="stk"></span></div><div class="bigq"><div class="p" lang="fr"></div><div class="v"></div></div><div class="opts two" lang="fr"></div>`;
    const bar = $(".timer i", host);
    const iv = setInterval(() => { if(lock) return; t--; bar.style.width = (t / (secs * 10) * 100) + "%"; if(t <= 0) end(); }, 100);
    cleanup = () => clearInterval(iv);
    function ask(){
      let n; do { n = verbQ(verbs); } while(q && n.v === q.v && n.pi === q.pi); q = n; DBG.q = q;
      $(".bigq .p", host).textContent = q.p + (q.p === "j'" ? "" : " ") + "…";
      $(".bigq .v", host).textContent = q.v + " · " + VERB_DE[q.v];
      const forms = Array.from(new Set(VERBS[q.v])).filter(f => f !== q.form);
      const os = shuffle([q.form].concat(sample(forms, 3)));
      const box = $(".opts", host); box.innerHTML = "";
      os.forEach(f => {
        const b = h('<button class="opt" type="button" style="text-align:center;font-size:22px"></button>'); b.textContent = f;
        b.onclick = () => {
          if(lock) return;
          if(f === q.form){ streak++; okN++; score += streak >= 5 ? 2 : 1; b.classList.add("right"); lock = true; setTimeout(() => { lock = false; ask(); }, 180); }
          else { streak = 0; miss.push(q); b.classList.add("wrong"); $$(".opt", box).forEach(x => { if(x.textContent === q.form) x.classList.add("right"); }); lock = true; setTimeout(() => { lock = false; ask(); }, 1300); }
          $("#sc", host).textContent = score; $("#stk", host).textContent = streak >= 3 ? "Serie: " + streak + (streak >= 5 ? " · doppelte Punkte" : "") : "";
        };
        box.appendChild(b);
      });
    }
    function end(){
      clearInterval(iv); cleanup = null;
      const best = Math.max(S.best[st.id] || 0, score), rec = score > (S.best[st.id] || 0); S.best[st.id] = best; save();
      const uniq = []; miss.forEach(m => { if(!uniq.some(u => u.v === m.v && u.pi === m.pi)) uniq.push(m); });
      host.innerHTML = `<div class="finish" style="padding:8px 0"><div class="score">${score}</div><p class="muted">Punkte${rec ? " · neuer Rekord!" : " · Rekord: " + best}</p><p class="mt">${okN} richtig, ${miss.length} falsch.</p>
        ${uniq.length ? `<div class="memo"><h3>Noch mal anschauen</h3><ul lang="fr">${uniq.map(m => `<li>${m.p}${m.p === "j'" ? "" : " "}<b>${m.form}</b> <span class="muted">(${m.v})</span></li>`).join("")}</ul></div>` : ""}
        <div class="row mid mt2"><button class="btn ghost" id="re" type="button">Noch ein Sprint</button><button class="btn" id="nx" type="button">Weiter →</button></div></div>`;
      $("#re", host).onclick = run;
      $("#nx", host).onclick = () => done({right: okN, total: okN + miss.length});
    }
    ask();
  }
}

/* ----- verb dice (typed) ----- */
function diceStep(host, st, done){
  const n = st.dice.n; let i = 0, right = 0; const used = {};
  function roll(){
    if(i >= n) return done({right, total: n});
    let q, g = 0; do { q = verbQ(st.dice.verbs); } while(used[q.v + q.pi] && g++ < 30); used[q.v + q.pi] = 1; DBG.q = q;
    host.innerHTML = `<div class="prog"><i style="width:${i / n * 100}%"></i></div><div class="hint">Würfel-Runde ${i + 1} von ${n}: Schreib die passende Form.</div>
      <div class="dice" lang="fr"><div class="die roll"><small>Pronomen</small>${q.p}</div><div class="die roll"><small>Verb</small>${q.v}</div></div>
      <form class="tyrow"><input class="tyin" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="fr" aria-label="Verbform"><button class="btn" type="submit">Prüfen</button></form><div id="fb"></div>`;
    const inp = $("#ans", host); $("form", host).after(accBar(inp)); inp.focus();
    $("form", host).onsubmit = e => {
      e.preventDefault(); if(inp.disabled) return; const v = norm(inp.value); if(!v) return;
      const v2 = v.replace(/^(je|j'|tu|il|elle|on|nous|vous|ils|elles)\s*/, "");
      const ok = v2 === q.form, near = !ok && bare(v2) === bare(q.form);
      inp.disabled = true; $$(".acc button, .tyrow button", host).forEach(b => b.disabled = true);
      if(ok || near) right++;
      const full = q.p + (q.p === "j'" ? "" : " ") + q.form; speak(full);
      const row = VERBS[q.v];
      const f = h(`<div class="fbk ${ok ? "good" : near ? "near" : "bad"}"><div class="msg2"><b>${ok ? "Richtig!" : near ? "Fast perfekt! Achte auf den Akzent." : "Noch nicht."}</b><span class="sol" lang="fr">${full}</span>${ok ? "" : `<br><span class="small" lang="fr">${row[0]}, ${row[1]}, ${row[2]}, ${row[3]}, ${row[4]}, ${row[5]}</span>`}</div><button class="btn ${ok ? "go" : ""}" type="button">${i < n - 1 ? "Würfeln" : "Weiter"}</button></div>`);
      $("#fb", host).appendChild(f); $("button", f).onclick = () => { i++; roll(); }; $("button", f).focus();
    };
  }
  roll();
}

/* ===== summaries, Tagesmix, Fehler-Kiste, Spickzettel ===== */
function summaryView(title, r, againFn, extra){
  const stars = starsFor(r.right, r.total);
  const wrong = (r.res || []).filter(x => !x.ok).length;
  const v = h('<div></div>'); v.appendChild(topBar(title));
  v.appendChild(h(`<section class="sheet finish">${starsHtml(stars)}<div class="score mt">${r.right} / ${r.total}</div>
    <p class="mt">${wrong ? wrong + (wrong === 1 ? " Aufgabe liegt" : " Aufgaben liegen") + " jetzt in der Fehler-Kiste. Hol sie dir morgen zurück." : "Alles richtig. Die Fehler-Kiste bleibt leer."}</p>${extra || ""}
    <div class="row mid mt2"><button class="btn" id="home" type="button">Zurück zum Carnet</button><button class="btn ghost" id="again" type="button">Noch eine Runde</button></div></section>`));
  $("#home", v).onclick = () => nav("");
  $("#again", v).onclick = againFn;
  setView(v);
}
function viewMix(){
  const doneSt = STATIONS.filter(s => S.st[s.id] && S.st[s.id].done);
  const pool = (doneSt.length >= 2 ? doneSt : STATIONS).reduce((a, s) => a.concat(s.items || []), []).concat(DIRE);
  const fromBox = sample(boxIds().map(id => ITEMS[id]), 4);
  const rest = sample(pool.filter(it => fromBox.indexOf(it) < 0), 10 - fromBox.length);
  const v = h('<div></div>'); v.appendChild(topBar("Tagesmix"));
  const host = h('<section class="sheet"></section>'); v.appendChild(host);
  setView(v);
  if(S.days.indexOf(today()) < 0){ S.days.push(today()); save(); }
  runItems(host, shuffle(fromBox.concat(rest)), {}, r => summaryView("Tagesmix", r, viewMix));
}
function viewBox(){
  const ids = boxIds();
  const v = h('<div></div>'); v.appendChild(topBar("Fehler-Kiste"));
  const host = h('<section class="sheet"></section>'); v.appendChild(host);
  setView(v);
  if(!ids.length){ host.innerHTML = `<div class="finish"><h3>Die Kiste ist leer.</h3><p class="mt muted">Hier landen Aufgaben, die du falsch beantwortet hast. Wenn du sie zweimal richtig löst, verschwinden sie wieder.</p><div class="row mid mt2"><button class="btn" type="button">Zurück zum Carnet</button></div></div>`; $("button", host).onclick = () => nav(""); return; }
  runItems(host, sample(ids.map(id => ITEMS[id]), 10), {}, r => summaryView("Fehler-Kiste", r, viewBox, `<p class="muted small">Noch in der Kiste: ${boxIds().length}. Eine Aufgabe verschwindet, wenn du sie zweimal richtig löst.</p>`));
}
function viewSheet(){
  const v = h('<div></div>'); v.appendChild(topBar("Spickzettel"));
  v.appendChild(h('<section class="sheet seyes cover" style="padding-top:16px;padding-bottom:14px"><h1 style="font-size:28px">Spickzettel</h1><p class="sub">Alle Regelkarten von Unité 1. Gut für den Abend vor der Arbeit.</p></section>'));
  STATIONS.forEach((st, i) => {
    const d = h(`<details class="sheet" ${i === 0 ? "open" : ""}><summary style="cursor:pointer;font-weight:750;color:var(--ink);font-size:18px">${st.bonus ? "Bonus" : st.no} · ${st.t} <span class="muted small" style="font-weight:500">${st.d}</span></summary></details>`);
    st.rules.forEach(r => d.appendChild(h(`<div class="rule" style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)">${r}</div>`)));
    d.appendChild(h(`<div class="memo"><h3>À retenir</h3><ul>${st.memo.map(m => "<li>" + m + "</li>").join("")}</ul></div>`));
    v.appendChild(d);
  });
  setView(v, "regeln");
}

/* ===== Test-Arena ===== */
function viewTest(){
  const v = h('<div></div>'); v.appendChild(topBar("Test-Arena"));
  const last = S.tests.last;
  v.appendChild(h(`<section class="sheet seyes cover" style="padding-top:16px;padding-bottom:14px"><h1 style="font-size:28px">Test-Arena</h1><p class="sub">So ähnlich sehen Aufgaben in einer Klassenarbeit aus.</p>${last ? `<p class="hello">Letzte Generalprobe: ${last.pts} von ${last.max} Punkten (${last.day}).</p>` : ""}</section>`));
  const m = h('<div class="menu mt"></div>');
  const add = (title, sub, tag, fn, cls) => { const b = h(`<button type="button" ${cls ? `style="${cls}"` : ""}><b>${title}</b><em>${tag}</em><span>${sub}</span></button>`); b.onclick = fn; m.appendChild(b); };
  add("Generalprobe", "Lückentext, Lesetext und «Sagen können» am Stück, mit Auswertung nach Themen.", "10 Min", () => runGeneral(), "box-shadow:0 0 0 2.5px var(--red)");
  v.appendChild(m);
  v.appendChild(h('<h2 class="h2">Einzeln üben</h2>'));
  const m2 = h('<div class="menu"></div>');
  const add2 = (title, sub, tag, fn) => { const b = h(`<button type="button"><b>${title}</b><em>${tag}</em><span>${sub}</span></button>`); b.onclick = fn; m2.appendChild(b); };
  CLOZE.forEach(c => add2("Lückentext: " + c.t, "Grammatik gemischt, selbst schreiben.", "5 Min", () => soloPart("Lückentext", host => clozePart(host, c, r => soloDone("Lückentext", r, viewTest)))));
  READS.forEach(c => add2("Lesen: " + c.t, "Text lesen, dann vrai oder faux.", "3 Min", () => soloPart("Lesen", host => readPart(host, c, r => soloDone("Lesen", r, viewTest)))));
  add2("Sagen können", "Was sagst du in dieser Situation?", "3 Min", () => soloPart("Sagen können", host => runItems(host, sample(DIRE, 6), {}, r => soloDone("Sagen können", {pts: r.right, max: r.total, sk: skillTally(r.res)}, viewTest))));
  WRITE.forEach(w => add2("Schreiben: " + w.t, "Schreibwerkstatt mit Bingo, Fehler-Scanner und Beispieltext.", "10 Min", () => viewWrite(w)));
  v.appendChild(m2);
  setView(v, "test");
}
function soloPart(title, fn){
  const v = h('<div></div>'); v.appendChild(topBar(title, () => viewTest()));
  $(".back", v).textContent = "← Test-Arena";
  const host = h('<section class="sheet"></section>'); v.appendChild(host); setView(v); fn(host);
}
function skillTally(res){ const sk = {}; (res || []).forEach(x => { const k = x.it.k || "dire"; sk[k] = sk[k] || [0, 0]; sk[k][1]++; if(x.ok) sk[k][0]++; }); return sk; }
function mergeSk(a, b){ Object.keys(b).forEach(k => { a[k] = a[k] || [0, 0]; a[k][0] += b[k][0]; a[k][1] += b[k][1]; }); return a; }
function skillsHtml(sk){
  const keys = Object.keys(sk).sort((a, b) => sk[a][0] / sk[a][1] - sk[b][0] / sk[b][1]);
  return `<div class="skills">${keys.map(k => { const [r, t] = sk[k], good = r / t >= 0.8, s = SKILLS[k] || {n: k}; return `<div class="sk"><span>${s.n}${!good && s.st ? ` <a href="#station-${s.st}" class="small">Station üben</a>` : ""}</span><b class="${good ? "good" : "bad"}">${Math.round(r * 10) / 10} / ${t}</b></div>`; }).join("")}</div>`;
}
function verdict(p){ return p >= 0.85 ? "Du bist bereit für die Arbeit. Wiederhole am Vorabend nur noch den Spickzettel." : p >= 0.6 ? "Fast. Üb die rot markierten Themen noch einmal, dann sitzt es." : "Da geht noch was. Spiel die rot markierten Stationen und komm morgen wieder."; }
function soloDone(title, r, back){
  const v = h('<div></div>'); v.appendChild(topBar(title, back)); $(".back", v).textContent = "← Test-Arena";
  v.appendChild(h(`<section class="sheet finish"><div class="score">${Math.round(r.pts * 10) / 10} / ${r.max}</div><p class="mt">${verdict(r.pts / r.max)}</p>${skillsHtml(r.sk)}<div class="row mid mt2"><button class="btn" type="button">Zurück zur Test-Arena</button></div></section>`));
  $(".finish .btn", v).onclick = back; setView(v);
}

/* ----- parts ----- */
function clozePart(host, c, done){
  const gaps = [];
  const html = c.txt.replace(/\{([^|}]+)\|([^|}]+)\|([^|}]+)\|([^}]+)\}/g, (m, a, cue, k, w) => { gaps.push({a, cue, k, w}); const i = gaps.length - 1; return `<span class="cue">(${cue})</span> <input data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="fr" aria-label="Lücke ${i + 1}" id="gap-${i}"><sup class="n">${i + 1}</sup>`; });
  host.innerHTML = `<div class="rule"><div class="kicker">Lückentext</div><h3>${c.t}</h3><p class="muted small">Setz das Wort in Klammern in der richtigen Form ein. Bei mehreren Wörtern in der Klammer wählst du das passende aus.</p></div><div class="cloze mt" lang="fr">${html}</div><div id="accs"></div><div class="row end mt"><button class="btn" id="ck" type="button">Abgeben</button></div><div id="out"></div>`;
  let last = $("input", host);
  $$(".cloze input", host).forEach(inp => inp.onfocus = () => last = inp);
  $("#accs", host).appendChild(accBar(() => last));
  $("#ck", host).onclick = () => {
    const empty = $$(".cloze input", host).filter(i => !i.value.trim());
    if(empty.length && !$("#ck", host).dataset.warned){ $("#ck", host).dataset.warned = 1; toast(empty.length + " Lücken sind noch leer. Tippe noch einmal auf Abgeben, wenn du trotzdem fertig bist."); empty[0].focus(); return; }
    let pts = 0; const sk = {}, notes = [];
    $$(".cloze input", host).forEach(inp => {
      const g = gaps[+inp.dataset.i], v = norm(inp.value), ok = v === norm(g.a), near = !ok && v && bare(v) === bare(g.a);
      inp.disabled = true; inp.classList.add(ok ? "ok" : near ? "near" : "no");
      sk[g.k] = sk[g.k] || [0, 0]; sk[g.k][1]++; sk[g.k][0] += ok ? 1 : near ? 0.5 : 0; pts += ok ? 1 : near ? 0.5 : 0;
      if(!ok){ inp.insertAdjacentHTML("afterend", `<span class="fix">${g.a}</span>`); notes.push(`<li><b>${+inp.dataset.i + 1}.</b> <span class="fr">${g.a}</span>: ${near ? "Fast. Akzent oder Apostroph fehlt. " : ""}${g.w}</li>`); }
    });
    $("#ck", host).classList.add("hidden"); $("#accs", host).classList.add("hidden");
    $("#out", host).innerHTML = `<div class="fbk ${pts === gaps.length ? "good" : "near"} mt"><div class="msg2"><b>${Math.round(pts * 10) / 10} von ${gaps.length} Punkten</b>${notes.length ? "Schau dir die Korrekturen an:" : "Fehlerfrei!"}</div><button class="btn" type="button">Weiter</button></div>${notes.length ? `<ul class="flags">${notes.join("")}</ul>` : ""}`;
    $("#out button", host).onclick = () => done({pts, max: gaps.length, sk});
    $("#out", host).scrollIntoView({block:"nearest", behavior:"smooth"});
  };
}
function readPart(host, c, done){
  host.innerHTML = `<div class="rule"><div class="kicker">Leseverstehen</div><h3>${c.t}</h3><p class="muted small">Lies zuerst den ganzen Text. Du musst nicht jedes Wort kennen.</p></div><div class="readtxt mt" lang="fr">${c.txt}</div><h3 class="mt2" style="font-size:18px">Vrai ou faux?</h3><div id="qs" lang="fr"></div><div class="row end mt"><button class="btn" id="ck" type="button" disabled>Abgeben</button></div><div id="out"></div>`;
  const ans = {};
  c.q.forEach((q, i) => {
    const r = h(`<div class="tf"><span>${q.s}</span><span class="bt"><button type="button" data-v="1">vrai</button><button type="button" data-v="0">faux</button></span></div>`);
    $$("button", r).forEach(b => b.onclick = () => { if($("#ck", host).classList.contains("hidden")) return; ans[i] = +b.dataset.v; $$("button", r).forEach(x => x.classList.toggle("on", x === b)); $("#ck", host).disabled = Object.keys(ans).length < c.q.length; });
    $("#qs", host).appendChild(r);
  });
  $("#ck", host).onclick = () => {
    let pts = 0;
    $$(".tf", host).forEach((r, i) => { const q = c.q[i], ok = ans[i] === q.v; if(ok) pts++; $$("button", r).forEach(b => { b.disabled = true; if(+b.dataset.v === q.v) b.classList.add("right"); else if(b.classList.contains("on")) b.classList.add("wrong"); b.classList.remove("on"); }); if(!q.v) r.appendChild(h(`<span class="corr">Richtig ist: <span class="fr">${q.c}</span></span>`)); });
    $("#ck", host).classList.add("hidden");
    $("#out", host).innerHTML = `<div class="fbk ${pts === c.q.length ? "good" : "near"} mt"><div class="msg2"><b>${pts} von ${c.q.length} Punkten</b>${pts === c.q.length ? "Alles verstanden!" : "Such die Stelle im Text, an der die Antwort steht."}</div><button class="btn" type="button">Weiter</button></div>`;
    $("#out button", host).onclick = () => done({pts, max: c.q.length, sk: {lesen: [pts, c.q.length]}});
    $("#out", host).scrollIntoView({block:"nearest", behavior:"smooth"});
  };
}
function runGeneral(){
  const n = (S.tests.n || 0); const c = CLOZE[n % CLOZE.length], rd = READS[n % READS.length];
  const parts = ["Lückentext", "Lesen", "Sagen können"]; let i = 0, pts = 0, max = 0; const sk = {};
  const v = h('<div></div>'); v.appendChild(topBar("Generalprobe", () => viewTest())); $(".back", v).textContent = "← Test-Arena";
  const dots = h('<div class="steps" aria-hidden="true"></div>'); v.appendChild(dots);
  const host = h('<section class="sheet"></section>'); v.appendChild(host); setView(v);
  const got = r => { pts += r.pts; max += r.max; mergeSk(sk, r.sk); i++; step(); window.scrollTo(0, 0); };
  function step(){
    dots.innerHTML = parts.map((p, k) => `<i class="${k < i ? "on" : k === i ? "now" : ""}"></i>`).join("");
    if(i === 0) clozePart(host, c, got);
    else if(i === 1) readPart(host, rd, got);
    else if(i === 2) runItems(host, sample(DIRE, 4), {}, r => got({pts: r.right, max: r.total, sk: skillTally(r.res)}));
    else {
      S.tests.n = n + 1; S.tests.last = {pts: Math.round(pts * 10) / 10, max, day: today().split("-").reverse().join(".")}; save();
      host.className = "sheet finish";
      host.innerHTML = `<div class="bigstamp"><span>Generalprobe<b>${Math.round(pts / max * 100)}%</b>${S.tests.last.day}</span></div><div class="score">${S.tests.last.pts} / ${max}</div><p class="mt">${verdict(pts / max)}</p><div class="memo"><h3>Tes résultats</h3></div>${skillsHtml(sk)}
        <div class="row mid mt2"><button class="btn" id="b1" type="button">Zurück zur Test-Arena</button><button class="btn ghost" id="b2" type="button">Zum Carnet</button></div>`;
      $("#b1", host).onclick = () => viewTest(); $("#b2", host).onclick = () => nav("");
    }
  }
  step();
}

/* ----- Schreibwerkstatt ----- */
function viewWrite(w){
  const v = h('<div></div>'); v.appendChild(topBar("Schreibwerkstatt", () => viewTest())); $(".back", v).textContent = "← Test-Arena";
  const s = h(`<section class="sheet"><div class="rule"><div class="kicker">Schreiben</div><h3 lang="fr">${w.t}</h3><p>${w.task}</p>
      <p><span class="tip">Erst planen:</span></p><ol style="margin:4px 0 8px;padding-left:22px">${w.plan.map(p => "<li>" + p + "</li>").join("")}</ol>
      <details><summary style="cursor:pointer;font-weight:700;color:var(--ink)">Satzbaukasten öffnen</summary><ul lang="fr" class="fr" style="margin:6px 0;padding-left:22px">${w.box.map(p => "<li>" + p + "</li>").join("")}</ul></details></div>
      <p class="small muted mt">Schreib-Bingo: Jedes Feld leuchtet, sobald du die Struktur benutzt.</p><div class="bingo"></div>
      <textarea class="write seyes" id="txt" lang="fr" spellcheck="false" autocapitalize="sentences" aria-label="Dein Text" placeholder="Écris ici…"></textarea><div id="accs"></div>
      <div class="row end mt"><span class="muted small" id="wc"></span><button class="btn" id="ck" type="button">Fertig, prüfen</button></div><div id="out"></div></section>`);
  v.appendChild(s); setView(v);
  const ta = $("#txt", s), bingo = $(".bingo", s);
  ta.value = S.drafts[w.id] || "";
  $("#accs", s).appendChild(accBar(ta));
  w.bingo.forEach(([lab]) => bingo.appendChild(h(`<span>${lab}</span>`)));
  const low = () => ta.value.toLowerCase().replace(/[’`´]/g, "'");
  const hasQue = t => /\b(que\b|qu')/.test(t.replace(/parce qu(e|')|est-ce qu(e|')|qu'est-ce/g, " "));
  function paint(){
    const t = low(); let hits = 0;
    w.bingo.forEach(([lab, re], i) => { let hit; if(re === "__QUE__") hit = hasQue(t); else if(re.indexOf("__QUE__") >= 0) hit = new RegExp(re.replace("|__QUE__", ""), "i").test(t) || hasQue(t); else hit = new RegExp(re, "i").test(t); bingo.children[i].classList.toggle("hit", hit); if(hit) hits++; });
    const words = t.trim() ? t.trim().split(/\s+/).length : 0;
    $("#wc", s).textContent = words + " Wörter · Bingo " + hits + " / " + w.bingo.length;
    S.drafts[w.id] = ta.value; save();
    return {hits, words};
  }
  ta.oninput = paint; paint();
  $("#ck", s).onclick = () => {
    const {hits, words} = paint(), t = low();
    if(words < 12){ toast("Schreib erst ein paar Sätze, mindestens fünf. Der Satzbaukasten hilft dir."); ta.focus(); return; }
    const found = [];
    FLAGS.forEach(([re, hint]) => { const m = t.match(new RegExp(re, "i")); if(m) found.push(`<li><code>${esc(m[0])}</code> ${hint}</li>`); });
    $("#out", s).innerHTML = `<div class="fbk ${found.length ? "near" : "good"} mt"><div class="msg2"><b>Bingo: ${hits} von ${w.bingo.length}</b>${hits === w.bingo.length ? "Alle Strukturen benutzt. Das gibt in der Arbeit Sprachpunkte." : "Versuch, noch ein graues Feld einzubauen."}</div></div>
      <div class="rule mt"><div class="kicker">Fehler-Scanner</div>${found.length ? `<p>Diese Stellen solltest du prüfen. Verbessere sie oben im Text und tippe wieder auf «Fertig, prüfen».</p><ul class="flags">${found.join("")}</ul>` : `<p>Der Scanner findet keinen der typischen Fehler. Er sieht aber nicht alles: Geh jetzt die Checkliste durch.</p>`}
      <div class="kicker mt">Checkliste</div><div class="check">${SELFCHECK.map((c, i) => `<label><input type="checkbox" id="sc-${i}"><span>${c}</span></label>`).join("")}</div>
      <details class="mt"><summary style="cursor:pointer;font-weight:700;color:var(--ink)">Beispieltext zum Vergleichen</summary><p class="readtxt mt" lang="fr">${w.model}</p><p class="small muted mt">Dein Text muss nicht so aussehen. Achte darauf, welche Strukturen der Beispieltext benutzt.</p></details></div>`;
    $("#out", s).scrollIntoView({block:"start", behavior:"smooth"});
  };
}

/* ===== boot ===== */
route();
