<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三十四块拼中国</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  /* a train trip around the map: route strip of nine stations on top, map + ticket-like card in the middle, karaoke line and player below */
  --bg:#eef2f7; --surface:#ffffff; --sea:#dfe8f3; --ink:#131a24; --ink-2:#465264; --ink-3:#7b8696; --line:#d5dce6; --idle:#c9d1dc;
  --accent:#c8372d; --accent-ink:#ffffff; --good:#1a8f4c; --bad:#c8372d; --now:#fff0ec;
  --r0:#7b8696; --r1:#2a78d6; --r2:#eb6834; --r3:#1baf7a; --r4:#eda100; --r5:#e87ba4; --r6:#008300; --r7:#6250d6;
  --tint:36%;
  --font-body:"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-fun:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",sans-serif;
  --font-hanzi:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC","Songti SC",serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --surface:#1a212b; --sea:#141b25; --ink:#eef2f6; --ink-2:#b9c2ce; --ink-3:#8590a0; --line:#2c3644; --idle:#3a4554;
    --accent:#f0705f; --accent-ink:#1c0c09; --good:#3fc27a; --bad:#f0705f; --now:#35211d;
    --r0:#8590a0; --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#0ca30c; --r7:#9085e9;
    --tint:48%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#1a212b; --sea:#141b25; --ink:#eef2f6; --ink-2:#b9c2ce; --ink-3:#8590a0; --line:#2c3644; --idle:#3a4554;
  --accent:#f0705f; --accent-ink:#1c0c09; --good:#3fc27a; --bad:#f0705f; --now:#35211d;
  --r0:#8590a0; --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#0ca30c; --r7:#9085e9;
  --tint:48%; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
.app{max-width:1180px;margin:0 auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ink-3)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,.p:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--font-hanzi);font-size:30px;font-weight:700;letter-spacing:.06em;line-height:1.2}
.top h1 small{font-family:var(--font-fun);font-size:15px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-left:10px}
.tools{display:flex;gap:8px;align-items:center}
.tools label{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;padding:0 4px}
.tools input{accent-color:var(--accent);width:16px;height:16px}
#quizBtn{font-family:var(--font-fun);font-size:16px}
/* route strip */
.route{position:relative;display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px 10px;overflow:hidden}
.route button{flex:var(--g) 1 0;min-width:0;border:none;background:none;border-radius:8px;padding:2px 2px 10px;font-family:var(--font-fun);font-size:15px;color:var(--ink-2);position:relative;white-space:nowrap}
.route button::after{content:"";position:absolute;left:50%;bottom:0;width:11px;height:11px;border-radius:50%;transform:translateX(-50%);background:var(--surface);border:3px solid var(--rc)}
.route button.on{color:var(--ink)}
.route button.done::before{content:"✓";color:var(--good);margin-right:2px}
.route button.on::after{background:var(--rc);box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 25%,transparent)}
.route .rail{position:absolute;left:14px;right:14px;bottom:14px;height:3px;background:var(--line);border-radius:2px}
.route .rail i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:12px;align-items:stretch}
.mapwrap{background:var(--sea);border:1px solid var(--line);border-radius:16px;padding:6px;position:relative;min-width:0}
#map{display:block;width:100%;aspect-ratio:1000/846;max-height:54vh;--ls:16px;--sw:1.2px}
.p{stroke:var(--surface);stroke-width:var(--sw);stroke-linejoin:round;cursor:pointer;fill:var(--idle);transition:fill .35s}
.p.seen{fill:color-mix(in srgb,var(--rc) var(--tint),var(--surface))}
.p.reg{fill:color-mix(in srgb,var(--rc) 16%,var(--idle))}
.p.em{fill:var(--rc)}
.p.cur{fill:var(--rc);stroke:var(--ink);stroke-width:calc(var(--sw)*2.2)}
.p.cur.tiny{stroke-width:calc(var(--sw)*.9)}
.p.ok{fill:var(--good)!important}
.p.no{fill:var(--bad)!important}
.p:focus{outline:none}
.lab{font-family:var(--font-body);font-size:var(--ls);font-weight:500;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:calc(var(--ls)*.2);stroke-opacity:.8;opacity:0;transition:opacity .3s}
.lab.show{opacity:1}
.lab.cur{font-weight:700;stroke-opacity:1}
.leader{stroke:var(--ink-2);stroke-width:calc(var(--sw)*.8);pointer-events:none;opacity:0;transition:opacity .3s}
.leader.show{opacity:1}
.ring{fill:none;stroke:var(--ink);stroke-width:calc(var(--sw)*2);pointer-events:none;opacity:0}
.ring.on{opacity:1;animation:ping 1.15s ease-out infinite;transform-box:fill-box;transform-origin:center}
.capdot{fill:var(--surface);stroke:var(--ink);stroke-width:calc(var(--sw)*1.6);pointer-events:none;opacity:0}
.capdot.on{opacity:1}
.bubble{fill:var(--surface);stroke:var(--ink-2);stroke-width:var(--sw);cursor:pointer;display:none}
.bubbleT{font-size:14px;font-weight:700;fill:var(--ink-2);text-anchor:middle;dominant-baseline:central;pointer-events:none;display:none}
body.quiz .bubble,body.quiz .bubbleT{display:block}
body.quiz .leader{opacity:1}
@keyframes ping{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.9);opacity:0}}
/* card */
.card{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--rc,var(--r0));border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:300px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--rc,var(--r0));display:inline-block}
.py{color:var(--ink-2);letter-spacing:.02em}
body.nopy .py{visibility:hidden}
.name{display:flex;flex-direction:column;gap:0}
.name .py{font-size:22px}
.name .hz{font-family:var(--font-hanzi);font-weight:700;font-size:clamp(64px,8.6vw,118px);line-height:1.05;letter-spacing:.04em;animation:drop .45s cubic-bezier(.2,1.4,.4,1) both}
.name.long .hz{font-size:clamp(52px,6.6vw,88px)}
@keyframes drop{0%{transform:translateY(-18px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
.meta{display:flex;flex-direction:column;gap:2px;font-size:15px}
.meta b{font-weight:600}
.meta .ext{font-size:13px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto}
.tile{background:color-mix(in srgb,var(--rc,var(--r0)) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--rc,var(--r0)) 35%,var(--surface));border-radius:12px;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;opacity:.0;transform:translateY(8px) scale(.94);transition:opacity .3s,transform .3s}
.tiles.on .tile{opacity:1;transform:none}
.tiles.on .tile:nth-child(2){transition-delay:.28s}
.tiles.on .tile:nth-child(3){transition-delay:.56s}
.tile .e{font-family:var(--font-emoji);font-size:34px;line-height:1.15}
.tile .c{font-family:var(--font-fun);font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.big{font-family:var(--font-fun);font-size:22px;color:var(--ink-2)}
.huge{font-family:var(--font-hanzi);font-weight:700;font-size:clamp(60px,8vw,104px);line-height:1.05;letter-spacing:.05em;animation:drop .45s cubic-bezier(.2,1.4,.4,1) both}
.title{font-family:var(--font-hanzi);font-weight:700;font-size:clamp(34px,4.4vw,52px);line-height:1.15;letter-spacing:.05em}
.hint{color:var(--ink-2);max-width:34ch}
.count{display:flex;align-items:baseline;gap:10px;font-family:var(--font-fun)}
.count b{font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:26px}
.members{display:flex;flex-wrap:wrap;gap:6px}
.members span{font-family:var(--font-hanzi);font-size:22px;font-weight:600;padding:1px 9px;border-radius:9px;background:color-mix(in srgb,var(--rc) 16%,var(--surface))}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.cta button{font-family:var(--font-fun);font-size:18px;padding:9px 18px}
.linkbtn{border:none;background:none;padding:0;color:var(--ink-3);font-size:13px;text-decoration:underline;align-self:flex-start}
.cta .pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fb{min-height:1.6em;font-family:var(--font-fun);font-size:18px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.dots{display:flex;gap:8px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
/* lyrics */
.lyrics{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 14px 10px;display:flex;flex-direction:column;gap:0;min-height:128px;justify-content:center}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;border-radius:10px;padding:1px 6px;opacity:.5}
.ln.now{opacity:1;background:var(--now)}
.ln.done{opacity:.8}
.sy{display:inline-flex;flex-direction:column;align-items:center;min-width:2.05em;padding:0 1px}
.sy .py{font-size:13px;line-height:1.3;height:1.3em}
.sy .c{font-family:var(--font-hanzi);font-size:30px;line-height:1.2;font-weight:600}
.sy.nm .c{color:var(--accent)}
.sy.gap{min-width:1.1em} .sy.pu{min-width:.9em}
.sy.pu .c{color:var(--ink-3);font-weight:400}
.sy.sung .c{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--accent)}
/* player */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;bottom:0;z-index:3;background:var(--bg);padding:8px 0}
#play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--font-fun);font-size:20px;min-width:128px;padding:9px 18px;border-radius:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:none;border-radius:0;font-family:var(--font-fun);font-size:16px;padding:9px 16px;background:none;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#time{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:14px;margin-left:auto}
#again{font-family:var(--font-fun);font-size:16px}
.foot{color:var(--ink-3);font-size:12.5px;max-width:90ch}
@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .card{min-height:0}
  #map{max-height:46vh}
  .route button{font-size:13px}
  .top h1 small{display:block;margin:2px 0 0}
  .sy{min-width:1.8em}.sy .c{font-size:25px}.sy .py{font-size:11.5px}
  .tile .e{font-size:28px}
  #time{margin-left:0}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.ring.on{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>三十四块拼中国<small>跟着节奏，走遍 34 个省级行政区</small></h1>
    <div class="tools">
      <label for="pyToggle"><input type="checkbox" id="pyToggle" checked> 拼音</label>
      <button type="button" id="quizBtn" title="Quiz">考考你</button>
    </div>
  </div>
  <nav class="route" id="route" aria-label="Stops"><div class="rail"><i id="railFill"></i></div></nav>
  <div class="stage">
    <div class="mapwrap"><svg id="map" role="group" aria-label="中国地图"></svg></div>
    <aside class="card" id="card" aria-live="polite"></aside>
  </div>
  <div class="lyrics" id="lyrics" aria-hidden="true"></div>
  <div class="bar">
    <button type="button" id="play" disabled>加载中…</button>
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" id="mListen" aria-pressed="true" title="Voice and beat">跟着听</button>
      <button type="button" id="mTurn" aria-pressed="false" title="Beat only: you chant">我来说</button>
    </div>
    <div class="seg" role="group" aria-label="Scope">
      <button type="button" id="sPart" aria-pressed="true" title="Pause after each stop">一站一站学</button>
      <button type="button" id="sAll" aria-pressed="false" title="Play everything in one go">连着听完</button>
    </div>
    <button type="button" id="again" title="Replay">这一站再来</button>
    <span id="time">0:00 / 3:36</span>
  </div>
  <p class="foot">共 34 个省级行政区：23 个省、5 个自治区、4 个直辖市、2 个特别行政区，按中文学校课本的划分。图片只是帮助记忆的小提示。地图数据：Apache ECharts 4.9（Apache 2.0）。</p>
</div>

    else{html+=`<span class="sy${(ci>=hs&&ci<he)?' nm':''}" data-slot="${slot}"><span class="py">${syl[k]}</span><span class="c">${ch}</span></span>`;k++;slot++} ci++}
  return html}
function showPair(n){const a=n-(LINES[n].b%2); if(a===pairKey)return; pairKey=a; lyr.innerHTML=''; pairEls=[];
  [a,a+1].forEach(i=>{if(i>=NL)return;const d=document.createElement('div');d.className='ln';d.innerHTML=lineHTML(LINES[i]);lyr.append(d);pairEls.push({i,el:d,ch:[...d.querySelectorAll('.sy[data-slot]')].map(e=>({e,s:+e.dataset.slot}))})})}
function karaoke(n,slot){pairEls.forEach(P=>{P.el.classList.toggle('now',P.i===n);P.el.classList.toggle('done',P.i<n);P.ch.forEach(c=>c.e.classList.toggle('sung',P.i<n||(P.i===n&&c.s<=slot)))})}

/* ---------- card ---------- */
const card=$('card'); let cardKey='';
function setCard(key,r,html){if(key===cardKey)return false;cardKey=key;card.style.setProperty('--rc',`var(--r${r})`);card.innerHTML=(typeof html==='function')?html():html;return true}
function provHTML(p,stopChip){
  const long=p.name.length>2?' long':'';
  const cap=p.cap?`<div><b>${p.type==='自治区'?'首府':'省会'}</b>：${esc(p.cap)} <span class="py">${esc(p.cap_py)}</span></div>`:'';
  return `<div class="chips">${stopChip?`<span class="chip"><i></i>${stopChip}</span>`:`<span class="chip"><i></i>${p.region}</span>`}<span class="chip">${p.type} <span class="py">${TYPEPY[p.type]}</span></span></div>
  <div class="name${long}"><div class="py">${esc(p.py)}</div><div class="hz">${esc(p.name)}</div></div>
  <div class="meta">${cap}<div class="ext">全称：${esc(p.full)} · 简称：${esc(p.abbr)} <span class="py">${esc(p.abbr_py)}</span></div></div>
  <div class="tiles" id="tiles">${p.tiles.map(t=>`<div class="tile"><span class="e">${t[0]}</span><span class="c">${esc(t[1])}</span></div>`).join('')}</div>`}
function startLabel(){const nd=done.size;if(scope==='all'||nd===0)return '▶ 开始';if(nd>=7)return '▶ 再学一遍';const k=firstUndone();return `▶ 继续：第${NUM[k]}站 ${REGS[k]}`}
function introCard(){const nd=done.size;setCard('intro'+nd+scope,0,`<div class="big">节奏口诀</div><div class="title">三十四块<br>拼中国</div>
  <p class="hint">${scope==='part'?'一次学一站，每站不到一分钟，学完会停下来等你。':'从头到尾连着听，一共三分半钟。'}也可以点地图上的任何一块，看看它是谁。</p>
  ${nd?`<div class="chips"><span class="chip">已学 ${nd} / 7 站</span></div><button type="button" class="linkbtn" data-act="clear">清除学习记录</button>`:''}
  <div class="cta"><button type="button" class="pri" data-act="play">${startLabel()}</button><button type="button" data-act="quiz">考考你</button></div>`)}

/* ---------- scenes ---------- */
let mode='idle';   // idle | show | quiz
function scene(t){
  const n=Math.floor((t-T1)/BAR), slotF=((t-T1)%BAR+BAR)%BAR/STEP, slot=Math.floor(slotF);
  SECS.forEach(s=>s.btn.classList.toggle('on',n>=s.start&&n<s.start+s.len));
  if(n<0){ // count-in
    view(0); paintIf('ci',p=>({c:'idle'})); showPair(0); karaoke(-1,0);
    const beat=Math.floor(((t-TL.lead)/STEP)/2);
    setCard('countin',0,`<div class="big">预备</div><div class="title">听四拍，<br>然后开始！</div><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>`);
    const d=$('dots'); if(d)[...d.children].forEach((x,i)=>x.classList.toggle('on',i<=beat&&t>=TL.lead)); return}
  if(n>=NL){finale();return}
  const L=LINES[n], s=SECS[L.k]; showPair(n); karaoke(n,slot);
  if(L.k===0){ // opening
    view(0);
    if(L.b===0){paintIf('o0',p=>({c:'idle'}));setCard('o0',0,`<div class="big">开场</div><div class="tile" style="opacity:1;transform:none;align-self:flex-start;padding:10px 22px"><span class="e" style="font-size:64px">🐓</span><span class="c">像一只雄鸡</span></div><div class="title">中国地图</div>`)}
    else if(L.b===1){const m=Math.ceil(34*Math.min(1,(slotF+1)/7));paintIf('o1-'+m,p=>({c:p.ord<m?'seen':'idle'}));setCard('o1',0,`<div class="big">开场</div><div class="count"><b id="cnt">0</b><span>块</span></div><div class="title">拼一起</div>`);const c=$('cnt');if(c)c.textContent=m}
    else if(L.b===2||L.b===3){const first=slotF<4, ty=L.b===2?(first?'省':'自治区'):(first?'直辖市':'特别行政区'), cnt={'省':23,'自治区':5,'直辖市':4,'特别行政区':2}[ty];
      paintIf('ty'+ty,p=>({c:p.type===ty?'em':'seen',l:p.type===ty&&ty!=='省'}));
      setCard('ty'+ty,0,`<div class="big">开场</div><div class="count"><b>${cnt}</b><span>个</span></div><div class="title">${ty}</div><div class="py" style="font-size:20px">${TYPEPY[ty]}</div>`)}
    else{const r=1+Math.min(6,Math.floor(((L.b-4)*8+slotF)/16*7));paintIf('o4-'+r,p=>({c:p.r===r?'em':'seen'}));
      setCard('o4',0,`<div class="big">七站，出发！</div><div class="members" id="mem">${REGS.slice(1).map((x,i)=>`<span style="--rc:var(--r${i+1})">${x}</span>`).join('')}</div><div class="title">走一圈</div>`);
      const m=$('mem');if(m)[...m.children].forEach((x,i)=>x.style.outline=(i+1===r)?'3px solid var(--ink)':'none')}
    return}
  if(L.k===8){ // ending
    view(0); paintIf('end',p=>({c:'seen',l:1}));
    if(L.b<2)setCard('e0',0,`<div class="big">结尾</div><div class="count"><b>34</b><span>块</span></div><div class="title">都走完啦！</div>`);
    else setCard('e1',0,`<div class="big">结尾</div><div class="title">合上地图<br>考考你</div><p class="hint">口诀说完以后，点“考考你”，看看你记住了几个。</p>`);
    return}
  // stops 1-7
  view(s.r);
  const cur=provAt(n), curOrd=cur?cur.ord:byName[s.provs[0]].ord-0.5;
  paintIf('s'+L.k+'-'+(cur?cur.name:''),p=>p===cur?{c:'cur',l:1}:p.ord<curOrd?{c:'seen',l:1}:p.r===s.r?{c:'reg'}:{c:'idle'},cur);
  if(!cur){setCard('stop'+L.k,s.r,`<div class="big">第${NUM[L.k]}站</div><div class="py" style="font-size:22px">${REGPY[s.r]}</div><div class="huge">${REGS[s.r]}</div>
      <div class="members">${s.provs.map(x=>`<span>${x}</span>`).join('')}</div>`)}
  else{setCard('p'+cur.name,s.r,()=>provHTML(cur,`第${NUM[L.k]}站 · ${REGS[s.r]}`));const tl=$('tiles');if(tl)tl.classList.toggle('on',(L.b-2)%2===1)}
}
function finale(){mode='idle';resumable=false;partDoneK=null;stopAt=null;view(0);mark(null);paint(p=>({c:'seen',l:1}));karaoke(NL,0);
  setCard('fin',0,`<div class="big">说完啦！</div><div class="title">哪个省份<br>在哪里？</div><p class="hint">现在合上课本，来考考自己。也可以换成“我来说”，自己跟着节奏再说一遍。</p>
  <div class="cta"><button type="button" class="pri" data-act="quiz">考考你</button><button type="button" data-act="restart">从头再来</button></div>`)}
function idle(){mode='idle';resumable=false;view(0);mark(null);paint(p=>({c:'seen',l:1}));showPair(0);karaoke(-1,0);introCard()}

/* ---------- explore (click a province while nothing is playing) ---------- */
function pick(p){
  if(mode==='quiz'){answer(p);return}
  if(!A.paused)return;
  mode='idle';view(0);paint(q=>q===p?{c:'cur',l:1}:{c:'seen',l:1});mark(p);
  setCard('x'+p.name+Date.now(),p.r,provHTML(p,''));const tl=$('tiles');if(tl)requestAnimationFrame(()=>tl.classList.add('on'));
}

/* ---------- quiz ---------- */
let Q=null;
function startQuiz(r){r=r||0;pause();resumable=false;mode='quiz';document.body.classList.add('quiz');let pool=PROV.filter(p=>!r||p.r===r).sort(()=>Math.random()-.5);if(!r)pool=pool.slice(0,10);Q={list:pool,i:0,score:0,first:true,lock:false,r};view(r);mark(null);ask()}
function exitQuiz(){if(mode!=='quiz')return;document.body.classList.remove('quiz');Q=null;mode='idle'}
function ask(){const p=Q.list[Q.i];Q.first=true;Q.lock=false;paint(q=>({c:(!Q.r||q.r===Q.r)?'seen':'idle'}));
  setCard('q'+Q.i+'-'+Date.now(),Q.r,`<div class="chips">${Q.r?`<span class="chip"><i></i>第${NUM[Q.r]}站 · ${REGS[Q.r]}</span>`:''}<span class="chip">第 ${Q.i+1} / ${Q.list.length} 题</span><span class="chip">答对 ${Q.score}</span></div><div class="big">请在地图上点：</div>
   <div class="name${p.name.length>2?' long':''}"><div class="py">${esc(p.py)}</div><div class="hz">${esc(p.name)}</div></div><div class="fb" id="fb"></div>
   <div class="cta"><button type="button" data-act="quitquiz">不考了</button></div>`)}
function answer(p){if(!Q||Q.lock)return;const want=Q.list[Q.i],fb=$('fb');
  if(p===want){Q.lock=true;if(Q.first)Q.score++;p.el.classList.add('ok');p.lab.classList.add('show');if(p.lead)p.lead.classList.add('show');if(fb){fb.className='fb ok';fb.textContent=Q.first?'答对了！':'找到了！'}
    setTimeout(()=>{if(!Q)return;Q.i++;Q.i<Q.list.length?ask():endQuiz()},1100)}
  else{Q.first=false;p.el.classList.add('no');p.lab.classList.add('show');if(p.lead)p.lead.classList.add('show');if(fb){fb.className='fb no';fb.textContent=`这是${p.name}，再找找。`}
    setTimeout(()=>{p.el.classList.remove('no')},700)}}
function endQuiz(){const s=Q.score,n=Q.list.length,r=Q.r;document.body.classList.remove('quiz');mode='idle';Q=null;paint(p=>(!r||p.r===r)?{c:'seen',l:1}:{c:'idle'});
  const nxt=(r&&r<7)?`<button type="button" class="pri" data-act="next">下一站：${REGS[r+1]} ▶</button>`:'';
  if(r)partDoneK=r;
  setCard('qend'+Date.now(),r,`<div class="big">${r?`第${NUM[r]}站 · ${REGS[r]} `:''}考完啦！</div><div class="count"><b>${s}</b><span>/ ${n}</span></div><div class="title">${s===n?'全对，太棒了！':s>=n*.7?'很不错！':'再听一遍吧'}</div>
   <div class="cta">${nxt}<button type="button" ${nxt?'':'class="pri"'} data-act="${r?'quizreg':'quiz'}">再考一次</button><button type="button" data-act="${r?'replay':'restart'}">${r?'再听这一站':'听口诀'}</button></div>`)}

/* ---------- audio + transport ---------- */
const store={get(k,d){try{const v=localStorage.getItem('p34_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('p34_'+k,JSON.stringify(v))}catch(e){}}};
const done=new Set((store.get('done',[])||[]).filter(k=>k>=1&&k<=7)); let scope=store.get('scope','part')==='all'?'all':'part';
let stopAt=null, stopK=null, partDoneK=null, resumable=false, prevT=0;
const secEnd=k=>T1+(SECS[k].start+SECS[k].len)*BAR;
const secAt=t=>{const n=Math.floor((t-T1)/BAR);return n<0?0:n>=NL?8:LINES[n].k};
const firstUndone=()=>{for(let k=1;k<=7;k++)if(!done.has(k))return k;return 1};
function markDone(k){if(k<1||k>7||done.has(k))return;done.add(k);store.set('done',[...done]);SECS[k].btn.classList.add('done')}
function planStop(k){ // where a lesson that starts in section k should pause
  if(scope!=='part'){stopAt=null;stopK=null;return}
  const e=k===0?1:k; if(e>=7){stopAt=null;stopK=null}else{stopAt=secEnd(e);stopK=e}}
function startSection(k){exitQuiz();planStop(k);const t=k===0?0:Math.max(0,T1+SECS[k].start*BAR-.25);try{A.currentTime=t}catch(e){}play()}
function partDone(){const k=stopK;A.pause();stopLoop();try{A.volume=1}catch(e){}partDoneK=k;resumable=false;stopAt=null;mode='idle';playBtn.textContent='▶ 下一站';
  const s=SECS[k],last=byName[s.provs[s.provs.length-1]].ord;view(s.r);paint(p=>p.ord<=last?{c:'seen',l:1}:{c:'idle'});mark(null);
  setCard('pd'+k+Date.now(),s.r,`<div class="big">第${NUM[k]}站 学完啦！</div><div class="huge">${REGS[s.r]}</div><div class="members">${s.provs.map(x=>`<span>${x}</span>`).join('')}</div>
   <div class="cta"><button type="button" class="pri" data-act="next">下一站：${REGS[k+1]} ▶</button><button type="button" data-act="quizreg">考考这一站</button><button type="button" data-act="replay">再听一遍</button></div>`)}
function setScope(sc){scope=sc;store.set('scope',sc);$('sPart').setAttribute('aria-pressed',sc==='part');$('sAll').setAttribute('aria-pressed',sc==='all');$('again').textContent=sc==='part'?'这一站再来':'从头再来';
  if(!A.paused||resumable)planStop(secAt(A.currentTime)); else if(cardKey.startsWith('intro'))introCard()}
const aud={listen:$('aMix'),turn:$('aBeat')}; let A=aud.listen, raf=null, ready=0;
const playBtn=$('play'), timeEl=$('time'), rail=$('railFill');
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
async function load(a,src){let url=src;try{const r=await fetch(src);if(!r.ok)throw 0;url=URL.createObjectURL(await r.blob())}catch(e){}
  a.src=url;a.addEventListener('ended',()=>{stopLoop();markDone(7);playBtn.textContent='▶ 开始';finale()});
  ready++;if(ready===2){playBtn.disabled=false;playBtn.textContent=startLabel()}}
load(aud.listen,AUDIO.mix);load(aud.turn,AUDIO.beat);
function tick(){const t=A.currentTime;timeEl.textContent=`${fmt(t)} / ${fmt(TL.total)}`;rail.style.width=Math.max(0,Math.min(100,(t-T1)/(TEND-T1)*100))+'%';
  if(!A.paused){
    if(t-prevT<1)for(let k=1;k<=7;k++){const e=secEnd(k)-.06;if(prevT<e&&t>=e)markDone(k)}
    if(stopAt!=null){if(t>=stopAt-.03){prevT=t;partDone();return} if(stopAt-t<.2){try{A.volume=Math.max(0,(stopAt-t)/.2)}catch(e){}}}
  }
  prevT=t;if(mode==='show')scene(t);if(!A.paused)raf=requestAnimationFrame(tick)}
function stopLoop(){cancelAnimationFrame(raf)}
function play(){exitQuiz();mode='show';partDoneK=null;resumable=false;try{A.volume=1}catch(e){}if(A.ended||A.currentTime>=TL.total-.3){A.currentTime=0;planStop(0)}prevT=A.currentTime;const pr=A.play();if(pr&&pr.catch)pr.catch(()=>{playBtn.textContent='▶ 开始'});playBtn.textContent='❚❚ 暂停';stopLoop();raf=requestAnimationFrame(tick)}
function pause(){const was=!A.paused;A.pause();stopLoop();if(was){resumable=true;playBtn.textContent='▶ 继续'}}
function seek(t){A.currentTime=t;if(A.paused&&mode==='show')scene(t);tick()}
function setMode(m){if(A===aud[m])return;const t=A.currentTime,was=!A.paused;A.pause();A=aud[m];try{A.currentTime=t;A.volume=1}catch(e){}$('mListen').setAttribute('aria-pressed',m==='listen');$('mTurn').setAttribute('aria-pressed',m==='turn');if(was){const pr=A.play();if(pr&&pr.catch)pr.catch(()=>{})}}
function mainButton(){if(!A.paused){pause();return}
  if(partDoneK!=null&&partDoneK<7){startSection(partDoneK+1);return}
  if(resumable){play();return}
  startSection(scope==='all'?0:(done.size>=7||!done.size||firstUndone()===1?0:firstUndone()))}
playBtn.addEventListener('click',mainButton);
$('sPart').addEventListener('click',()=>setScope('part'));$('sAll').addEventListener('click',()=>setScope('all'));
$('mListen').addEventListener('click',()=>setMode('listen'));$('mTurn').addEventListener('click',()=>setMode('turn'));
$('again').addEventListener('click',()=>{if(scope==='all'){startSection(0);return}const k=partDoneK!=null?partDoneK:(mode==='quiz'&&Q&&Q.r?Q.r:secAt(A.currentTime));startSection(k>8?0:k)});
$('quizBtn').addEventListener('click',()=>startQuiz(0));
$('pyToggle').addEventListener('change',e=>document.body.classList.toggle('nopy',!e.target.checked));
card.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='play')mainButton();else if(act==='quiz')startQuiz(0);else if(act==='restart')startSection(0);else if(act==='quitquiz'){exitQuiz();partDoneK=null;playBtn.textContent=startLabel();idle()}
  else if(act==='next'){if(partDoneK!=null&&partDoneK<7)startSection(partDoneK+1)}
  else if(act==='replay'){if(partDoneK!=null)startSection(partDoneK)}
  else if(act==='quizreg'){if(partDoneK!=null){const r=partDoneK;startQuiz(r);partDoneK=r}}
  else if(act==='clear'){done.clear();store.set('done',[]);SECS.forEach(s=>s.btn.classList.remove('done'));playBtn.textContent=startLabel();introCard()}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/BUTTON|INPUT/.test(document.activeElement.tagName)){e.preventDefault();if(!playBtn.disabled)mainButton()}});
done.forEach(k=>SECS[k].btn.classList.add('done'));setScope(scope);idle();
window.__dbg={scene:t=>{mode='show';scene(t)},LINES,T1,BAR};
</script>
</body>
</html>
