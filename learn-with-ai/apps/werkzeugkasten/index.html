/* Layout idea: a workshop shadow board. Three tool outlines hang on a pegboard and fill in as missions are finished; each workbench below holds the missions for one tool. */
:root{
  --bg:#F0F3F5; --board:#DCE4E9; --hole:#B4C2CB; --surface:#FFFFFF;
  --ink:#16202B; --muted:#556470; --line:#C8D2D9;
  --tape:#FFC629; --tape-ink:#2A2000;
  --ki:#2457E6; --lern:#0B7F58; --rede:#C9411F;
  --good:#17804A; --bad:#B93424;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111920; --board:#1A252F; --hole:#0B1116; --surface:#1E2A35;
    --ink:#EEF3F6; --muted:#A3B3BF; --line:#33434F;
    --tape:#FFC629; --tape-ink:#2A2000;
    --ki:#86A8FF; --lern:#4FD1A1; --rede:#FF8E70;
    --good:#5AD08F; --bad:#FF8A7A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111920; --board:#1A252F; --hole:#0B1116; --surface:#1E2A35;
  --ink:#EEF3F6; --muted:#A3B3BF; --line:#33434F;
  --tape:#FFC629; --tape-ink:#2A2000;
  --ki:#86A8FF; --lern:#4FD1A1; --rede:#FF8E70;
  --good:#5AD08F; --bad:#FF8A7A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.5}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:20px}
.t-ki{--c:var(--ki)} .t-lern{--c:var(--lern)} .t-rede{--c:var(--rede)}

/* ---------- Start: the shadow board ---------- */
.board{background:radial-gradient(circle,var(--hole) 2px,transparent 2.6px) 11px 11px/22px 22px,var(--board);border-radius:20px;padding:26px 20px 22px;display:flex;flex-direction:column;gap:18px}
.tape{align-self:flex-start;background:var(--tape);color:var(--tape-ink);font-weight:700;font-size:.875rem;padding:3px 12px;transform:rotate(-2deg);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.board h1{font-weight:800;font-size:clamp(2.3rem,10.5vw,3.9rem)}
.board .sub{max-width:34ch;font-size:1.0625rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{background:var(--surface);border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative}
.slot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--hole);position:absolute;top:6px}
.slot svg{width:60px;height:60px;margin-top:8px}
.slot .nm{font-family:var(--display);font-weight:600;font-size:.98rem;line-height:1.15}
.slot .st{font-size:.8125rem;color:var(--muted)}
.tool-svg{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 6}
.tool-svg.have{stroke:var(--c);stroke-width:4;stroke-dasharray:none;fill:color-mix(in srgb,var(--c) 16%,transparent)}
.slot.have .st{color:var(--c);font-weight:700}

.bench{background:var(--surface);border-radius:18px;border-top:8px solid var(--c);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.bench .kick{font-size:.875rem;font-weight:700;color:var(--c)}
.bench h2{font-weight:800;font-size:1.55rem}
.bench .meta{color:var(--muted);font-size:.9375rem}
.go{align-self:flex-start;background:var(--c);color:var(--surface);border:0;border-radius:999px;padding:11px 22px;font-weight:700;font-size:1.0625rem}
.go:hover{filter:brightness(1.08)}
.later{border-top:1px dashed var(--line);padding-top:10px;font-size:.9375rem;color:var(--muted)}
.later ul{margin:4px 0 0;padding-left:1.1em}
.parents{background:var(--surface);border-radius:14px;padding:12px 16px;font-size:.9375rem}
.parents summary{font-weight:700;cursor:pointer}
.parents p{margin-top:10px;max-width:65ch}

/* ---------- Mission ---------- */
.mhead{display:flex;align-items:center;gap:12px}
.back{background:none;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9375rem;white-space:nowrap}
.mhead .mt{font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.15;color:var(--c)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--c)}
.card{background:var(--surface);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.card h2{font-weight:800;font-size:1.5rem}
.card .lead{color:var(--muted)}
.card p{max-width:60ch}
.quote{font-family:var(--display);font-weight:600;font-size:1.3rem;border-left:5px solid var(--tape);padding:4px 0 4px 12px}
.opts,.rows,.facts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.opt:hover{border-color:var(--c)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));font-weight:700}
.opt.no{border-color:var(--bad);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.locked .opt{pointer-events:none}
.fb{border-radius:12px;padding:12px 14px;border-left:6px solid var(--line);background:var(--bg)}
.fb:empty{display:none}
.fb.good{border-left-color:var(--good)} .fb.bad{border-left-color:var(--bad)}
.fb b{display:block}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:.9375rem}
.bars div{display:grid;grid-template-columns:5.5em 1fr 3em;align-items:center;gap:8px}
.bars span.bar{height:12px;border-radius:6px;background:var(--c);min-width:3px}
.bars span.n{font-variant-numeric:tabular-nums;text-align:right}
.bars small{color:var(--muted)}
.row{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row .two .opt{text-align:center;padding:9px 6px;font-size:.9375rem}
.row.placed{border-color:var(--good)}
.row .tag{font-weight:700;color:var(--good);font-size:.9375rem}
.row .note{font-size:.9375rem;color:var(--muted)}
.seq{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.seq:empty,.opts:empty{display:none}
.seq li{counter-increment:s;display:grid;grid-template-columns:2em 1fr;gap:8px;align-items:start;border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.seq li::before{content:counter(s);font-family:var(--display);font-weight:800;color:var(--c);font-size:1.2rem;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{min-height:44px;padding:8px 12px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fact{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--c) 12%,var(--surface));font-weight:700}
.parts{display:grid;grid-template-columns:1fr 3fr 1fr;gap:6px;text-align:center;font-size:.875rem}
.parts div{border-radius:10px;padding:14px 4px;background:color-mix(in srgb,var(--c) 16%,var(--surface));font-weight:700;overflow-wrap:anywhere}
.parts small{display:block;font-weight:400;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:132px}
.day b{font-family:var(--display)}
.day .stack{display:flex;flex-direction:column-reverse;gap:4px;flex:1;width:70%}
.day .stack i{height:16px;border-radius:5px;background:var(--c)}
.day.test{border-style:dashed;justify-content:center;color:var(--muted);font-size:.875rem;text-align:center}
.planbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.next{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 28px;font-weight:700;font-size:1.0625rem}
.next:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:2px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:700}

/* ---------- Tool earned ---------- */
.won{align-items:center;text-align:center;background:radial-gradient(circle,var(--hole) 2px,transparent 2.6px) 11px 11px/22px 22px,var(--board)}
.won svg{width:120px;height:120px;transform-origin:50% 0;animation:hang 1.1s cubic-bezier(.3,1.4,.5,1) both}
@keyframes hang{0%{transform:translateY(-70px) rotate(-18deg);opacity:0}45%{transform:translateY(0) rotate(9deg);opacity:1}70%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
.won h2{font-size:2rem}
.memo{background:var(--surface);border-radius:14px;padding:16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.memo h3{font-size:1.05rem;font-weight:600;color:var(--c)}
.memo ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-weight:700}
@media (prefers-reduced-motion:reduce){.won svg,.shake{animation:none}}
</style>
</head>

const MISSIONS = [
{

    {type:'info', h:'So tickt ein Chatbot', ps:[

/* ================= Helpers ================= */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function icon(track, have){
  return h('span', {html:'<svg viewBox="0 0 64 64" class="tool-svg'+(have?' have':'')+'" aria-hidden="true">'+ICON[track]+'</svg>'}).firstChild;
}
function setFb(el, good, title, text){
  el.className = 'fb ' + (good ? 'good' : 'bad');
  el.replaceChildren(h('b', null, title), text || '');
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function head(s){
  const out = [];
  if (s.h) out.push(h('h2', null, s.h));
  if (s.lead) out.push(h('p', {class:'lead'}, s.lead));
  return out;
}

const KEY = 'werkzeugkasten-v1';
let save = {done:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.done) save = s; } catch(e){}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} }

const app = document.getElementById('app');
let run = null;          // {m, i, clean, scored}
let view = 'start';

/* ================= Mission view ================= */
function startMission(m, i){
  run = {m, i: i||0, clean:0, scored:0}; view = m.id;
  showStep();
}
function showStep(){
  const m = run.m, s = m.steps[run.i], last = run.i === m.steps.length-1;
  const next = h('button', {class:'next', type:'button', disabled:true, onclick(){ run.i++; showStep(); }}, 'Weiter');
  const ctx = { done:false, solved(clean){
    if (ctx.done) return; ctx.done = true;
    if (clean !== undefined){ run.scored++; if (clean) run.clean++; }
    next.disabled = false;
  }};
  const card = h('section', {class:'card' + (last ? ' won' : '')}, RENDER[s.type](s, ctx));
  const nav = last
    ? h('div', {class:'nav'}, h('button',{class:'ghost',type:'button',onclick(){ startMission(m,0); window.scrollTo(0,0); }},'Noch mal spielen'), h('button',{class:'next',type:'button',onclick(){ go(''); }},'Zum Werkzeugkasten'))
    : h('div', {class:'nav'}, next);
  app.className = 'wrap t-' + m.track;
  app.replaceChildren(
    h('div', {class:'mhead'}, h('button',{class:'back',type:'button',onclick(){ go(''); }},'← Zurück'), h('span',{class:'mt'}, m.title)),
    h('div', {class:'prog', role:'img', 'aria-label':'Schritt '+(run.i+1)+' von '+m.steps.length}, m.steps.map((_,k)=>h('i',{class:k<=run.i?'on':''}))),
    card, nav);
  window.scrollTo(0,0);
}

const RENDER = {
  info(s, ctx){
    ctx.solved();
    return [...head(s), ...s.ps.map(p => h('p', null, p)), s.fig ? h('div', {html:s.fig}) : null];
  },
  memo(s, ctx){
    ctx.solved();
    return [...head(s), h('div', {class:'facts'}, s.facts.map(f => h('div', {class:'fact'}, f)))];
  },
  choice(s, ctx){
    const fb = h('div', {class:'fb', role:'status'});
    const list = h('div', {class:'opts'});
    let miss = false;
    s.opts.forEach(o => {
      const b = h('button', {class:'opt', type:'button', onclick(){
        if (ctx.done || b.classList.contains('no')) return;
        if (o.ok){
          b.classList.add('ok'); list.classList.add('locked');
          setFb(fb, true, miss ? 'Jetzt stimmt es.' : 'Richtig!', s.fb);
          if (s.bars) fb.append(h('div', {class:'bars'}, s.bars.map(([w,n]) => h('div', null, h('span',null,w), h('span',{class:'bar',style:'width:'+n+'%'}), h('span',{class:'n'},n+' %'))), h('small', null, 'Ausgedachte Beispielzahlen: So ungefähr schätzt ein Sprachmodell, welches Wort passt.')));
          ctx.solved(!miss);
        } else {
          miss = true; b.classList.add('no'); shake(b);
          setFb(fb, false, 'Noch nicht.', (o.fb || '') + ' Probier es noch mal.');
        }
      }}, o.t);
      list.append(b);
    });
    return [...head(s), h('h2', null, s.q), s.quote ? h('p', {class:'quote'}, s.quote) : null, list, fb];
  },
  sort(s, ctx){
    const fb = h('div', {class:'fb', role:'status'});
    let left = s.items.length, miss = false;
    const rows = s.items.map(it => {
      const two = h('div', {class:'two'});
      const row = h('div', {class:'row'}, h('p', null, it.t), two);
      s.cats.forEach((c, k) => {
        const b = h('button', {class:'opt', type:'button', onclick(){
          if (k === it.c){
            row.classList.add('placed');
            two.replaceWith(h('span', {class:'tag'}, '✓ ' + c), it.note ? h('span', {class:'note'}, it.note) : '');
            if (--left === 0){ setFb(fb, true, miss ? 'Alles einsortiert.' : 'Alles richtig einsortiert!', s.fb); ctx.solved(!miss); }
          } else { miss = true; b.classList.add('no'); shake(row); }
        }}, c);
        two.append(b);
      });
      return row;
    });
    return [...head(s), h('div', {class:'rows'}, rows), fb];
  },
  order(s, ctx){
    const fb = h('div', {class:'fb', role:'status'});
    const seq = h('ol', {class:'seq', 'aria-label':'Deine Reihenfolge'});
    const pool = h('div', {class:'opts'});
    let nextIdx = 0, miss = false;
    const idx = s.items.map((_, k) => k);
    do { for (let k = idx.length-1; k > 0; k--){ const j = Math.floor(Math.random()*(k+1)); [idx[k], idx[j]] = [idx[j], idx[k]]; } } while (idx.every((v,k) => v===k) || idx[0] === 0);
    idx.forEach(k => {
      const b = h('button', {class:'opt', type:'button', onclick(){
        if (k === nextIdx){
          nextIdx++; b.remove(); seq.append(h('li', null, h('span', null, s.items[k])));
          fb.className = 'fb'; fb.replaceChildren();
          if (nextIdx === s.items.length){ setFb(fb, true, miss ? 'Geschafft.' : 'Perfekt sortiert!', s.fb); ctx.solved(!miss); }
        } else { miss = true; shake(b); setFb(fb, false, 'Noch nicht.', nextIdx === 0 ? 'Womit begrüßt du deine Klasse?' : 'Überleg: Was muss vorher kommen?'); }
      }}, s.items[k]);
      pool.append(b);
    });
    return [...head(s), seq, pool, fb];
  },
  pick(s, ctx){
    const fb = h('div', {class:'fb', role:'status'});
    const list = h('div', {class: s.block ? 'opts' : 'chips'});
    let miss = false;
    const btns = s.tokens.map(t => {
      const b = h('button', {class:'opt', type:'button', 'aria-pressed': s.multi ? 'false' : null, onclick(){
        if (ctx.done) return;
        if (s.multi){
          const on = b.classList.contains('sel');
          if (!on && list.querySelectorAll('.sel').length >= s.multi) return;
          b.classList.toggle('sel'); b.setAttribute('aria-pressed', String(!on));
          check.disabled = list.querySelectorAll('.sel').length !== s.multi;
        } else if (t.ok){
          b.classList.add('ok'); list.classList.add('locked'); setFb(fb, true, miss ? 'Jetzt hast du ihn.' : 'Gefunden!', s.fb); ctx.solved(!miss);
        } else if (!b.classList.contains('no')){
          miss = true; b.classList.add('no'); shake(b); setFb(fb, false, 'Noch nicht.', s.miss);
        }
      }}, t.t);
      b._ok = !!t.ok; return b;
    });
    list.append(...btns);
    const check = h('button', {class:'ghost', type:'button', disabled:true, onclick(){
      const sel = btns.filter(b => b.classList.contains('sel'));
      const right = sel.filter(b => b._ok).length;
      if (right === s.multi){
        sel.forEach(b => { b.classList.remove('sel'); b.classList.add('ok'); });
        list.classList.add('locked'); check.remove(); setFb(fb, true, miss ? 'Jetzt passt es.' : 'Treffer!', s.fb); ctx.solved(!miss);
      } else { miss = true; setFb(fb, false, right + ' von ' + s.multi + ' stimmen.', 'Tausche aus und prüfe noch mal. Tipp: Welche Wörter brauchst du, um den Satz nachzuerzählen?'); }
    }}, 'Prüfen');
    return [...head(s), list, s.multi ? check : null, fb];
  },
  plan(s, ctx){
    const fb = h('div', {class:'fb', role:'status'});
    const names = ['Montag','Dienstag','Mittwoch','Donnerstag'], n = [0,0,0,0];
    let miss = false;
    const leftTxt = h('span', null);
    const check = h('button', {class:'ghost', type:'button', disabled:true, onclick(){
      const used = n.filter(x => x > 0).length;
      if (used >= 3){
        setFb(fb, true, miss ? 'So ist es stark verteilt.' : 'Stark verteilt!', 'Zwischen den Lerntagen schläfst du. Im Schlaf festigt dein Gehirn, was du geübt hast. Beim nächsten Block holst du es wieder hervor, und es sitzt jedes Mal fester.');
        cols.forEach(c => c.disabled = true); reset.remove(); check.remove(); ctx.solved(!miss);
      } else if (used === 2){
        miss = true; setFb(fb, false, 'Schon besser als alles auf einmal.', 'Noch stärker wird es mit drei oder vier Tagen. Setz zurück und verteile neu.');
      } else {
        miss = true; setFb(fb, false, 'Alles an einem Tag?', 'Dann bleibt für Freitag einiges hängen, aber dein Gehirn bekommt keine Gelegenheit zu wiederholen. Setz zurück und verteile neu.');
      }
    }}, 'Plan prüfen');
    const reset = h('button', {class:'ghost', type:'button', onclick(){ n.fill(0); draw(); fb.className='fb'; fb.replaceChildren(); }}, 'Zurücksetzen');
    const cols = names.map((nm, k) => h('button', {class:'day', type:'button', onclick(){ if (n.reduce((a,b)=>a+b,0) < 4){ n[k]++; draw(); } }}, h('b', null, nm.slice(0,2)), h('span', {class:'stack'})));
    function draw(){
      const sum = n.reduce((a,b)=>a+b,0);
      cols.forEach((c, k) => { c.querySelector('.stack').replaceChildren(...Array.from({length:n[k]}, () => h('i'))); c.setAttribute('aria-label', names[k] + ': ' + n[k] + (n[k]===1 ? ' Block' : ' Blöcke')); });
      leftTxt.textContent = sum === 4 ? 'Alle 4 Blöcke verteilt.' : 'Noch ' + (4-sum) + (4-sum===1 ? ' Block' : ' Blöcke') + ' übrig.';
      check.disabled = sum !== 4;
    }
    draw();
    return [...head(s), h('div', {class:'days'}, cols, h('div', {class:'day test'}, h('b', null, 'Fr'), 'Test')), h('div', {class:'planbar'}, leftTxt, h('span', {class:'nav'}, reset, check)), fb];
  },
  tool(s, ctx){
    const m = run.m, tr = TRACKS[m.track];
    save.done[m.id] = true; persist();
    return [
      icon(m.track, true),
      h('p', {class:'lead'}, 'Werkzeug verdient'),
      h('h2', null, tr.tool),
      h('p', null, run.clean + ' von ' + run.scored + ' Aufgaben hast du ohne Fehlversuch gelöst.'),
      h('div', {class:'memo'}, h('h3', null, 'Dein Merkzettel'), h('ol', null, s.memo.map(x => h('li', null, x)))),
      h('div', {class:'memo'}, h('h3', null, 'Probier es aus'), h('p', null, s.todo))
    ];
  }
};

/* ================= Routing ================= */
function route(){
  const id = (location.hash || '').slice(1);
  const m = MISSIONS.find(x => x.id === id);
  if (m){ if (view !== m.id) startMission(m, 0); }
  else if (view !== 'start' || !app.firstChild) renderHome();
}
function go(id){
  try { location.hash = id; } catch(e){}
  const m = MISSIONS.find(x => x.id === id);
  if (m) { if (view !== m.id) startMission(m, 0); } else { renderHome(); window.scrollTo(0,0); }
}
window.addEventListener('hashchange', route);
function boot(data){
  const m = data && MISSIONS.find(x => x.id === data.view);
  if (m) startMission(m, Math.min(data.i || 0, m.steps.length-2)); else route();
}
if (window.claude && window.claude.hot){
  window.claude.hot.snapshot(() => ({view, i: run ? run.i : 0}));
  if (window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude.hot.data || {});
} else boot({});
</script>
