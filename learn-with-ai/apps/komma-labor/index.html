<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komma-Labor Mathe 6</title>
<style>
/* Schriften liegen im Ordner fonts/ und werden vom eigenen Server geladen. */
@font-face { font-family: 'Andika'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/andika-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Andika'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/andika-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Azeret Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/azeret-mono-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Azeret Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/azeret-mono-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Azeret Mono'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/azeret-mono-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 200 800; font-display: swap; src: url('fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2'); }
/* Komma-Labor: helles Thema = Karoheft mit königsblauer Tinte und Textmarker, dunkles Thema = Schultafel mit Kreide.
   Layout: eine Spalte bis 1040px, Modelle links und Fragen rechts, auf dem Handy untereinander. */
:root {
  --paper: #f3f5f0; --sheet: #ffffff; --grid: #d3deee; --ink: #1d2f8f; --on-ink: #ffffff; --ink-soft: #e6eafb;
  --text: #1f232b; --muted: #5a6270; --line: #d5dae2;
  --marker: #ffe45a; --marker-ink: #1f232b; --marker-soft: #fff4b0;
  --good: #1a7a44; --good-bg: #e2f4e8; --bad: #c0322b; --bad-bg: #fbe6e4; --warn: #a66f00; --warn-bg: #fff2cc;
  --f-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Andika', 'Segoe UI', system-ui, -apple-system, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --f-mono: 'Azeret Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17231e; --sheet: #1f2f29; --grid: #2d4239; --ink: #b7cbff; --on-ink: #12203f; --ink-soft: #263a4a;
    --text: #ecf0e9; --muted: #a2b0a7; --line: #354a40;
    --marker: #ecd24a; --marker-ink: #1a1a1a; --marker-soft: #4b4520;
    --good: #72d69c; --good-bg: #1d3b2c; --bad: #ff9088; --bad-bg: #492421; --warn: #f1c450; --warn-bg: #3d3413;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17231e; --sheet: #1f2f29; --grid: #2d4239; --ink: #b7cbff; --on-ink: #12203f; --ink-soft: #263a4a;
  --text: #ecf0e9; --muted: #a2b0a7; --line: #354a40;
  --marker: #ecd24a; --marker-ink: #1a1a1a; --marker-soft: #4b4520;
  --good: #72d69c; --good-bg: #1d3b2c; --bad: #ff9088; --bad-bg: #492421; --warn: #f1c450; --warn-bg: #3d3413;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--text); font-family: var(--f-body); line-height: 1.5; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--ink); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
main:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.eyebrow { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: 1.08rem; max-width: 62ch; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.num { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--ink); color: var(--on-ink); font-family: var(--f-mono); font-size: .8em; font-weight: 700; margin-right: .35em; }
.tag { font-family: var(--f-mono); font-size: .7rem; padding: 3px 8px; border-radius: 99px; background: var(--ink-soft); color: var(--ink); white-space: nowrap; font-weight: 500; letter-spacing: 0; }

/* Mathe-Schreibweisen */
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .84em; line-height: 1.12; margin: 0 .14em; font-variant-numeric: tabular-nums; }
.fr > span { padding: 0 .22em; }
.fr > span:first-child { border-bottom: .09em solid currentColor; }
.mix, .nb { white-space: nowrap; }
.per { display: inline-block; line-height: .92; border-top: .085em solid currentColor; padding-top: .04em; }

/* Kopf */
.top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding: 10px max(16px, calc((100% - 1040px) / 2)); background: var(--paper); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; text-decoration: none; color: var(--text); display: inline-flex; align-items: baseline; gap: 8px; }
.brand span { font-family: var(--f-mono); font-size: .9rem; font-weight: 500; background: var(--marker); color: var(--marker-ink); padding: 0 6px; border-radius: 4px; }
.nav { display: flex; gap: 2px; overflow-x: auto; margin-left: auto; max-width: 100%; }
.nav a { padding: 7px 11px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: .92rem; white-space: nowrap; }
.nav a:hover { color: var(--text); background: var(--ink-soft); }
.nav a.on { color: var(--on-ink); background: var(--ink); }
main { display: block; max-width: 1040px; margin: 0 auto; padding: 0 16px 64px; }
.foot { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; color: var(--muted); font-size: .82rem; border-top: 1px solid var(--line); }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 18px; border-radius: 10px; border: 2px solid var(--ink); background: var(--ink); color: var(--on-ink); font-weight: 700; text-decoration: none; cursor: pointer; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink-soft); filter: none; }
.btn.big { min-height: 52px; padding: 12px 24px; font-size: 1.05rem; }
.btn.small { min-height: 40px; padding: 6px 13px; font-size: .92rem; }
.btn:disabled { opacity: .4; cursor: default; filter: none; }

/* Start */
.hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 32px; align-items: center; padding: 44px 0 36px; }
.hero > * { min-width: 0; }
.hero-text { display: flex; flex-direction: column; gap: 16px; }
.hero h1 { font-size: clamp(2.3rem, 6.4vw, 4rem); letter-spacing: -0.025em; }
.calc { background: #2a3352; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 340px; margin: 0 auto; box-shadow: 0 2px 0 #171d33, 0 14px 30px rgba(20, 28, 60, .22); }
.lcd { background: #c5d2ba; color: #1b2a20; border-radius: 8px; padding: 8px 12px 6px; display: flex; flex-direction: column; font-family: var(--f-mono); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .25); }
.lcd-expr { font-size: .85rem; opacity: .7; }
.lcd-out { font-size: 2rem; font-weight: 700; text-align: right; letter-spacing: .02em; line-height: 1.2; }
.calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.calc-keys span { background: #3c4670; color: #dfe5fb; border-radius: 7px; text-align: center; padding: 5px 0; font-family: var(--f-mono); font-size: .9rem; }
.heroc { max-width: 400px; width: 100%; }
.tape { background: #fff; color: #1f232b; border-radius: 4px; overflow: hidden; font-family: var(--f-mono); font-size: 1.25rem; font-weight: 500; padding: 8px 0; white-space: nowrap; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .06); }
.tape-run { display: inline-block; animation: taperun 9s linear infinite; padding-left: 8px; }
.tape-run span { display: inline-block; width: 6ch; }
.tape-run .alt { background: var(--marker); color: var(--marker-ink); }
@keyframes taperun { to { transform: translateX(-12ch); } }
.tape-cap { color: #c9d1ee; font-size: .82rem; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.way { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--text); position: relative; }
.way:hover { border-color: var(--ink); }
.way-n { font-family: var(--f-mono); font-weight: 700; color: var(--ink); font-size: .85rem; }
.way-n::before { content: 'Teil '; }
.way-stat { margin-top: auto; padding-top: 8px; font-size: .86rem; color: var(--muted); border-top: 1px dashed var(--line); }
.block { margin-top: 44px; display: flex; flex-direction: column; gap: 14px; }
.plan { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.plan li { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--ink); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.plan strong { font-family: var(--f-display); font-size: 1.05rem; }
.parents { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px; }
.parents summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
.par-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 6px 0 16px; }
.par-grid h3 { font-size: 1rem; margin: 14px 0 4px; }
.par-grid p { font-size: .95rem; margin-bottom: 6px; }
.parents > p { padding-bottom: 14px; }

/* Checkliste */
.tablewrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th { font-family: var(--f-mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 500; }
th small { display: block; text-transform: none; letter-spacing: 0; font-size: .7rem; }
.check td:first-child { width: 1%; } .check td:nth-child(n+3), .check th:nth-child(n+3) { text-align: center; white-space: nowrap; }
.check td:nth-child(2) { min-width: 220px; }
.lights { display: inline-flex; gap: 5px; vertical-align: middle; }
.l { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; }
.l.g.on { background: var(--good); border-color: var(--good); }
.l.y.on { background: var(--marker); border-color: var(--warn); }
.l.r.on { background: var(--bad); border-color: var(--bad); }
.selfbtn { background: none; border: 1.5px dashed var(--line); border-radius: 99px; padding: 6px 9px; cursor: pointer; line-height: 0; }
.selfbtn:hover { border-color: var(--ink); }

/* Seiten */
.page { padding-top: 28px; display: flex; flex-direction: column; gap: 22px; }
.page.narrow { max-width: 760px; margin: 0 auto; }
.page-head { display: flex; flex-direction: column; gap: 10px; }
.page-head.tight h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
.page-head.tight { gap: 6px; }
.crumb a { text-decoration: none; font-weight: 700; font-size: .92rem; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.h-sm { font-size: 1.1rem; margin-top: 18px; }

/* Stationen */
.st-list { display: grid; gap: 12px; }
.st-card { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 16px 20px; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--text); }
.st-card:hover { border-color: var(--ink); }
.st-card div { display: flex; flex-direction: column; gap: 3px; }
.st-n { font-family: var(--f-display); font-weight: 800; font-size: 2.4rem; color: var(--ink); width: 1.2em; text-align: center; line-height: 1; }
.okmark { color: var(--good); font-weight: 700; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dots .dot { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--sheet); font-family: var(--f-mono); font-size: .82rem; cursor: pointer; }
.dots .dot.done { border-color: var(--ink); color: var(--ink); }
.dots .dot.cur { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.dots .dot:disabled { opacity: .45; cursor: default; }
.st-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .9fr); gap: 20px; align-items: start; }
.st-grid.noviz { grid-template-columns: minmax(0, 720px); }
.st-grid.noviz .st-viz { display: none; }
.st-viz, .st-side { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.st-side { display: flex; flex-direction: column; gap: 16px; }
.st-text { display: flex; flex-direction: column; gap: 6px; }
.step-no { font-family: var(--f-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.st-nav:empty { display: none; }
.summary { display: grid; gap: 16px; max-width: 760px; }
.merk, .say { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.merk { border-left: 6px solid var(--marker); }
.merk ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.say { border-left: 6px solid var(--ink); }
.say p { font-size: 1.05rem; }

/* Aufgaben */
.item { display: flex; flex-direction: column; gap: 12px; }
.it-q { font-weight: 700; font-size: 1.08rem; }
.it-body { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.opts { display: grid; gap: 8px; width: 100%; grid-template-columns: 1fr 1fr; }
.opts.cols1 { grid-template-columns: 1fr; } .opts.cols3 { grid-template-columns: repeat(3, 1fr); } .opts.cols4 { grid-template-columns: repeat(4, 1fr); }
.opts.multi, .opts.ord { display: flex; flex-wrap: wrap; }
.opt { position: relative; min-height: 50px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 1.05rem; text-align: center; line-height: 1.3; }
.opts.cols1 .opt { text-align: left; font-size: 1rem; }
.opts.multi .opt, .opts.ord .opt { min-width: 76px; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.tog[aria-pressed="true"] { border-color: var(--ink); background: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--ink); }
.opt.right, .numin.right, select.right { border-color: var(--good) !important; background: var(--good-bg) !important; }
.opt.wrongo, .numin.wrongo, select.wrongo { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.opt:disabled { cursor: default; opacity: .75; } .opt.right:disabled { opacity: 1; }
.opt kbd { position: absolute; top: 3px; left: 5px; font-family: var(--f-mono); font-size: .62rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
@media (hover: none) { .opt kbd { display: none; } }
.numform, .perform { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.numin { width: 9.5em; min-height: 48px; padding: 6px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--sheet); font-family: var(--f-mono); font-size: 1.15rem; }
.unit { font-weight: 700; }
.perform { flex-direction: column; align-items: flex-start; }
.per-fields { display: flex; flex-wrap: wrap; gap: 12px; }
.per-fields div { display: flex; flex-direction: column; gap: 4px; }
.per-fields label, .dset label, .m-set label { font-size: .8rem; color: var(--muted); }
.perin { border-top: 4px solid var(--ink); }
.per-prev { font-size: 1.05rem; } .pv { font-family: var(--f-mono); font-size: 1.4rem; font-weight: 700; margin-left: 6px; }
.barset { display: flex; align-items: flex-end; gap: 3px; font-family: var(--f-mono); font-size: 1.8rem; font-weight: 700; padding-top: 8px; }
.bs-d { width: 1.5em; height: 1.75em; border: 2px dashed var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer; font: inherit; border-top: 5px solid transparent; }
.bs-d[aria-pressed="true"] { border-top: 5px solid var(--ink); border-style: solid; border-color: var(--ink); background: var(--marker-soft); }
.bs-tail, .bs-int { color: var(--muted); padding-bottom: .12em; } .bs-int { color: var(--text); }
.ord-out { min-height: 46px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border: 2px dashed var(--line); border-radius: 10px; width: 100%; }
.ord-chip { background: var(--ink-soft); border-radius: 8px; padding: 4px 10px; font-weight: 700; } .lt { color: var(--muted); font-family: var(--f-mono); }
.cloze { line-height: 2.5; font-size: 1.05rem; }
.cloze select { min-height: 40px; padding: 4px 8px; border-radius: 8px; border: 2px solid var(--ink); background: var(--sheet); font-weight: 700; max-width: 100%; }
.it-fb { display: none; border-radius: 10px; padding: 12px 14px; flex-direction: column; gap: 6px; }
.it-fb.show { display: flex; }
.it-fb.ok { background: var(--good-bg); } .it-fb.no { background: var(--bad-bg); } .it-fb.hint { background: var(--warn-bg); }
.fb-head { font-weight: 700; } .it-fb.ok .fb-head { color: var(--good); } .it-fb.no .fb-head, .it-fb.hint .fb-head { color: var(--bad); }
.ic { font-family: var(--f-mono); }
.it-fig svg { width: 100%; max-width: 460px; height: auto; }

/* Karoheft */
.karo { position: relative; margin: 0 auto; font-family: var(--f-mono); font-weight: 500; color: var(--ink);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: var(--c) var(--c); box-shadow: inset -1px -1px 0 var(--grid); }
.kc { position: absolute; width: var(--c); height: var(--c); display: grid; place-items: center; line-height: 1; z-index: 1; }
.kc.comma::after { content: ','; position: absolute; right: -.16em; bottom: .05em; }
.kc.op { color: var(--muted); } .kc.q { font-weight: 700; color: var(--text); }
.kc.over { box-shadow: inset 0 3px 0 var(--ink); }
.kc.sub { color: var(--muted); }
.kc.rem.hit { background: var(--marker); color: var(--marker-ink); font-weight: 700; }
.kc.rem.zero-end { background: var(--good-bg); color: var(--good); font-weight: 700; }
.kline { position: absolute; height: 2px; background: var(--ink); z-index: 1; }
.kcur { position: absolute; background: var(--marker-soft); z-index: 0; }

/* Reste-Maschine */
.machine, .scanner, .zoom, .tapes { display: flex; flex-direction: column; gap: 12px; }
.m-set { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.m-set input { width: 4.6em; min-height: 40px; padding: 4px 8px; border-radius: 8px; border: 2px solid var(--line); background: var(--sheet); font-family: var(--f-mono); font-size: 1.05rem; }
.m-colon { font-family: var(--f-mono); font-weight: 700; }
.m-body { display: grid; grid-template-columns: minmax(0, 176px) minmax(0, 1fr); gap: 12px; align-items: start; }
.m-wheel svg { width: 100%; height: auto; display: block; }
.m-heft { min-width: 0; overflow-x: auto; }
.w-ring { fill: none; stroke: var(--line); stroke-dasharray: 3 5; }
.w-edge { stroke: var(--ink); stroke-width: 1.6; opacity: .4; fill: none; } .w-edge.latest { opacity: 1; stroke-width: 2.6; }
.w-arrow { fill: var(--ink); }
.w-node circle { fill: var(--sheet); stroke: var(--muted); stroke-width: 1.5; } .w-node text { fill: var(--text); font-family: var(--f-mono); font-weight: 500; }
.w-node.stop circle { stroke-dasharray: 4 3; }
.w-node.seen circle { fill: var(--ink-soft); stroke: var(--ink); }
.w-node.cur circle { fill: var(--ink); stroke: var(--ink); } .w-node.cur text { fill: var(--on-ink); font-weight: 700; }
.w-node.hit circle { fill: var(--marker); stroke: var(--ink); stroke-width: 3; } .w-node.hit text { fill: var(--marker-ink); }
.w-node.stop.cur circle { fill: var(--good); stroke: var(--good); }
.w-cap { font-family: var(--f-mono); font-size: 9px; fill: var(--muted); }
.m-tape { font-family: var(--f-mono); font-size: 1.3rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1px; min-height: 2.2em; }

<script>
/* ===== lib.js: Mathe-Helfer und Markup (ohne DOM) ===== */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function bgcd(a, b) { if (a < 0n) a = -a; if (b < 0n) b = -b; while (b) { const t = a % b; a = b; b = t; } return a; }
/* exakte Brüche mit BigInt */
function FR(n, d) { n = BigInt(n); d = BigInt(d === undefined ? 1 : d); if (d < 0n) { n = -n; d = -d; } const g = bgcd(n, d) || 1n; return { n: n / g, d: d / g }; }
function frAdd(x, y) { return FR(x.n * y.d + y.n * x.d, x.d * y.d); }
function frMul(x, y) { return FR(x.n * y.n, x.d * y.d); }
function frCmp(x, y) { const l = x.n * y.d, r = y.n * x.d; return l < r ? -1 : l > r ? 1 : 0; }
function frEq(x, y) { return frCmp(x, y) === 0; }
function pow10(k) { let r = 1n; for (let i = 0; i < k; i++) r *= 10n; return r; }

/* "12,05{34}" -> Bruch ; erlaubt auch "12" und "0,5" */
function decToFr(s) {
  const m = /^(\d+)(?:,(\d*)(?:\{(\d+)\})?)?$/.exec(s);
  if (!m) return null;
  const pre = m[2] || '', per = m[3] || '';
  let f = FR(BigInt(m[1]));
  if (pre) f = frAdd(f, FR(BigInt(pre), pow10(pre.length)));
  if (per) f = frAdd(f, FR(BigInt(per), pow10(pre.length) * (pow10(per.length) - 1n)));
  return f;
}
/* allgemeiner Wert: "3/8", "1_3/4", "0,5{6}", "20 %", "33,{3} %" */
function val(s) {
  s = String(s).trim().replace(/ /g, ' ');
  let pct = false;
  if (/%$/.test(s)) { pct = true; s = s.replace(/\s*%$/, ''); }
  let f = null, m;
  if ((m = /^(\d+)_(\d+)\/(\d+)$/.exec(s))) f = frAdd(FR(m[1]), FR(m[2], m[3]));
  else if ((m = /^(\d+)\/(\d+)$/.exec(s))) f = FR(m[1], m[2]);
  else f = decToFr(s);
  if (f && pct) f = frMul(f, FR(1, 100));
  return f;
}

/* schriftliche Division a : b -> Ziffern, Reste, Periode */
function expand(a, b, maxDigits) {
  maxDigits = maxDigits || 600;
  const int = Math.floor(a / b);
  let r = a % b;
  const seen = new Map(), digits = [], rems = [r];

    seen.set(r, digits.length);
    r *= 10; digits.push(Math.floor(r / b)); r %= b; rems.push(r);
  }
  if (r === 0) return { int, digits, rems, pre: digits.join(''), per: '', start: -1 };
  const start = seen.has(r) ? seen.get(r) : -1;
  if (start < 0) return { int, digits, rems, pre: digits.join(''), per: '', start: -1, cut: true };
  return { int, digits, rems, pre: digits.slice(0, start).join(''), per: digits.slice(start).join(''), start };
}
/* Markup-String für a/b als Dezimalzahl: "0,1{6}" */
function rep(a, b) {
  const e = expand(a, b);
  if (!e.pre && !e.per) return String(e.int);
  return e.int + ',' + e.pre + (e.per ? '{' + e.per + '}' : '');

function primeFactors(n) { const f = []; let p = 2; while (n > 1 && p * p <= n) { while (n % p === 0) { f.push(p); n /= p; } p++; } if (n > 1) f.push(n); return f; }

/* m * 10^e exakt als deutsche Dezimalzahl (m ganzzahlig >= 0) */
function fmtPow(m, e) {
  let s = String(m);
  if (e >= 0) { s = s + '0'.repeat(e); return s; }
  const k = -e;
  if (s.length <= k) s = '0'.repeat(k - s.length + 1) + s;

/* Bruch (BigInt) auf k Nachkommastellen runden, 5 rundet auf */
function roundFr(f, k) {

/* Eingabe des Kindes: "0,75" / "0.75" / " 3,50 " -> Bruch oder null */
function parseInput(s) {
  s = String(s).trim().replace(/\s+/g, '').replace(/\./g, ',').replace(/%$/, '');
  if (!/^\d+(,\d*)?$/.test(s)) return null;
  if (/,$/.test(s)) s = s.slice(0, -1);
  return decToFr(s);
}

/* ---------- Markup -> HTML ---------- */
function T(s) {
  return String(s)
    .replace(/(\d+)_(\d+)\/(\d+)/g, '<span class="mix">$1<span class="fr"><span>$2</span><span>$3</span></span></span>')
    .replace(/(^|[^\d,\/])(\d+)\/(\d+)(?![\d\/])/g, '$1<span class="fr"><span>$2</span><span>$3</span></span>')
    .replace(/(\d+,\d*)\{(\d+)\}/g, '<span class="nb">$1<span class="per">$2</span></span>')
    .replace(/\{(\d+)\}/g, '<span class="per">$1</span>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---------- Schriftliche Division im Karoheft ---------- */
function divisionModel(a, b) {
  const e = expand(a, b, 60), steps = [];
  let r = a % b;
  steps.push({ partial: a, digit: Math.floor(a / b), sub: Math.floor(a / b) * b, rem: r });
  for (let i = 0; i < e.digits.length; i++) {
    const partial = r * 10, d = e.digits[i];
    r = partial - d * b;
    steps.push({ partial, digit: d, sub: d * b, rem: r });
  }
  /* repStep: Schritt, dessen Rest sich am Ende wiederholt (oder -1) */
  return { a, b, e, steps, periodic: e.start >= 0, repStep: e.start >= 0 ? e.start : -1 };
}
function renderDivision(el, model, shown, opts) {
  opts = opts || {};
  const { a, b, steps } = model, total = steps.length, done = shown >= total;
  const A = String(a), B = String(b), Q0 = String(steps[0].digit), L = A.length;
  const Zmax = Math.max(total - 1, opts.minZeros || 0);
  const Zs = Zmax === 0 ? 0 : Math.min(Math.max(shown, 1), Zmax);
  const C = 1 + L + Zmax;
  const qs = C + 2 + B.length;
  const cols = qs + Q0.length + Zmax + 1;
  const rows = 1 + 2 * Math.max(total, 1) + (opts.extraRows || 0);
  const w = el.clientWidth || 320;
  const c = Math.max(13, Math.min(opts.maxCell || 28, Math.floor(w / cols)));
  const cells = [];
  const put = (col, row, ch, cls) => cells.push('<span class="kc ' + (cls || '') + '" style="left:' + (col * c) + 'px;top:' + (row * c) + 'px">' + ch + '</span>');
  /* Zeile 0: Aufgabe */
  for (let i = 0; i < L; i++) put(1 + i, 0, A[i], (i === L - 1 && Zs > 0) ? 'comma' : '');
  for (let i = 0; i < Zs; i++) put(1 + L + i, 0, '0', 'zero');
  put(C, 0, ':', 'op');
  for (let i = 0; i < B.length; i++) put(C + 1 + i, 0, B[i]);
  put(C + 1 + B.length, 0, '=', 'op');
  const perStart = model.periodic ? model.repStep : -1;
  if (shown > 0) {
    for (let i = 0; i < Q0.length; i++) put(qs + i, 0, Q0[i], 'q' + ((i === Q0.length - 1 && (shown > 1 || (opts.pendingComma && Zmax > 0))) ? ' comma' : ''));
    for (let k = 1; k < shown; k++) {
      let cls = 'q';
      if (opts.fresh === k) cls += ' fresh';
      if (done && perStart >= 0 && k - 1 >= perStart && !opts.noBar) cls += ' over';
      put(qs + Q0.length + k - 1, 0, steps[k].digit, cls);
    }
    if (done && model.periodic && opts.dots) put(qs + Q0.length + total - 1, 0, '…', 'op');
  } else if (opts.qmark) put(qs, 0, '?', 'op');
  /* Treppe */
  for (let k = 0; k < shown; k++) {
    const st = steps[k], end = L + k, rowS = 1 + 2 * k, rowR = rowS + 1;
    const S = String(st.sub);
    for (let i = 0; i < S.length; i++) put(end - S.length + 1 + i, rowS, S[i], 'sub');
    put(end - S.length, rowS, '−', 'op sub');
    const ulw = Math.max(S.length, String(st.partial).length) + 0;
    cells.push('<span class="kline" style="left:' + ((end - ulw + 1) * c) + 'px;top:' + ((rowS + 1) * c - 1) + 'px;width:' + (ulw * c) + 'px"></span>');
    const R = String(st.rem), last = k === total - 1;
    let rc = 'rem';
    if (done && model.periodic && !opts.noHit && (k === total - 1 || k === model.repStep)) rc += ' hit';
    if (last && st.rem === 0) rc += ' zero-end';
    for (let i = 0; i < R.length; i++) put(end - R.length + 1 + i, rowR, R[i], rc);
    if (!last) put(end + 1, rowR, '0', 'zero' + (k === shown - 1 ? ' cur' : ''));
    if (!last && k === shown - 1) { /* aktueller Teil-Dividend markieren */
      cells.push('<span class="kcur" style="left:' + ((end - R.length + 1) * c) + 'px;top:' + (rowR * c) + 'px;width:' + ((R.length + 1) * c) + 'px;height:' + c + 'px"></span>');
    }
  }
  if (shown === 0) cells.push('<span class="kcur" style="left:' + c + 'px;top:0;width:' + (L * c) + 'px;height:' + c + 'px"></span>');
  el.innerHTML = '<div class="karo" style="--c:' + c + 'px;width:' + (cols * c) + 'px;height:' + (rows * c) + 'px;font-size:' + Math.round(c * 0.76) + 'px">' + cells.join('') + '</div>';
}

/* ---------- 2-5-Scanner ---------- */
function chips(n) {
  if (n === 1) return '<span class="chip one">1</span>';

}
function scanReport(a, b) {

  const bad = Array.from(new Set(pf.filter(p => p !== 2 && p !== 5)));

  h += '<div class="s-row"><span class="s-lab">Nenner</span><span>' + rb + ' = ' + chips(rb) + '</span></div>';
  if (!bad.length) {
    const twos = pf.filter(p => p === 2).length, fives = pf.filter(p => p === 5).length, k = Math.max(twos, fives);

    if (rb === 1) h += '<div class="s-row"><span class="s-lab">Wert</span><span>' + T(a + '/' + b) + ' = ' + ra + ' (eine natürliche Zahl)</span></div>';
    else h += '<div class="s-row"><span class="s-lab">Erweitern</span><span>' + (m > 1 ? 'mit ' + m + ': ' : '') + T(ra + '/' + rb) + (m > 1 ? ' = ' + '<span class="fr"><span>' + (ra * m) + '</span><span>' + tsd(ten) + '</span></span>' : '') + ' = <strong>' + T(rep(a, b)) + '</strong> <span class="muted">(' + k + (k === 1 ? ' Nachkommastelle' : ' Nachkommastellen') + ')</span></span></div>';
  } else {
    const e = expand(a, b, 400), long = e.per.length > 24;
    h += '<div class="s-row"><span class="s-lab">Ergebnis</span><span><span class="pill bad">periodisch</span> Störfaktor ' + bad.join(' und ') + '.</span></div>';
    h += '<div class="s-row"><span class="s-lab">Wert</span><span>' + T(a + '/' + b) + ' = <strong>' + (long ? e.int + ',' + e.pre + e.per.slice(0, 24) + '…' : T(rep(a, b))) + '</strong> <span class="muted">(Periode mit ' + e.per.length + (e.per.length === 1 ? ' Ziffer' : ' Ziffern') + ')</span></span></div>';
  }

}

/* ---------- Zoom auf 1/3 ---------- */
function vizZoom(el) {
  let L = 0;
  const three = n => '3'.repeat(n);
  function lab(i) { /* Strich i (0..10) auf Stufe L */
    if (L === 0) return i === 0 ? '0' : i === 10 ? '1' : '0,' + i;
    if (i === 0) return '0,' + three(L);
    if (i === 10) return '0,' + three(L - 1) + '4';
    return '0,' + three(L) + i;
  }
  function draw(anim) {
    const W = Math.max(290, Math.min(520, $('.z-stage', el).clientWidth || 520)), x0 = 30, x1 = W - 30, y = 70, step = (x1 - x0) / 10, mx = x0 + (x1 - x0) / 3;
    const small = L >= 4 || (W < 400 && L >= 2);
    let s = '<svg viewBox="0 0 ' + W + ' 150" class="zoomsvg' + (anim ? ' zin' : '') + '" style="transform-origin:' + (mx / W * 100) + '% 50%" role="img" aria-label="Zahlenstrahl von ' + lab(0) + ' bis ' + lab(10) + '">';
    s += '<rect x="' + (x0 + 3 * step) + '" y="' + (y - 14) + '" width="' + step + '" height="28" class="z-hot"/>';
    s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" class="z-axis"/>';
    for (let i = 0; i <= 10; i++) {
      const x = x0 + i * step, big = i === 0 || i === 10;
      s += '<line x1="' + x + '" y1="' + (y - (big ? 14 : 8)) + '" x2="' + x + '" y2="' + (y + (big ? 14 : 8)) + '" class="z-tick"/>';
      if (big) s += '<text x="' + x + '" y="' + (y + 34) + '" text-anchor="' + (i === 0 ? 'start' : 'end') + '" class="z-lab" dx="' + (i === 0 ? -8 : 8) + '">' + lab(i) + '</text>';
    }
    s += '<text x="' + (x0 + 3 * step - 2) + '" y="' + (y - 22) + '" text-anchor="end" class="z-lab hot' + (small ? ' sm' : '') + '">' + lab(3) + '</text>';
    s += '<text x="' + (x0 + 4 * step + 2) + '" y="' + (y - 22) + '" text-anchor="start" class="z-lab hot' + (small ? ' sm' : '') + '">' + lab(4) + '</text>';
    s += '<line x1="' + mx + '" y1="' + (y - 16) + '" x2="' + mx + '" y2="' + (y + 40) + '" class="z-mark"/>';
    s += '<circle cx="' + mx + '" cy="' + y + '" r="5" class="z-dot"/>';
    s += '<g class="z-frac" transform="translate(' + mx + ',' + (y + 58) + ')"><text text-anchor="middle" y="0">1</text><line x1="-8" y1="5" x2="8" y2="5"/><text text-anchor="middle" y="22">3</text></g>';
    s += '</svg>';
    $('.z-stage', el).innerHTML = s;
    $('.z-info', el).innerHTML = '<strong>Zoom-Stufe ' + L + '.</strong> ' + T('1/3') + ' liegt zwischen ' + lab(3) + ' und ' + lab(4) + '. ' + (L === 0 ? 'Der gelbe Abschnitt ist das, was du beim nächsten Zoom siehst.' : L < 3 ? 'Das Bild sieht genauso aus wie vorher.' : 'Immer dasselbe Bild. ' + T('1/3') + ' landet nie genau auf einem Strich, egal wie tief du zoomst.');
    $('[data-a=zin]', el).disabled = L >= 7;
    $('[data-a=zout]', el).disabled = L === 0;
  }
  el.innerHTML = '<div class="zoom"><div class="z-stage"></div><p class="z-info" aria-live="polite"></p><div class="m-btns"><button class="btn" type="button" data-a="zin">10-mal hineinzoomen</button><button class="btn ghost" type="button" data-a="zout">Zurück zum Anfang</button></div></div>';
  el.addEventListener('click', ev => {
    const bt = ev.target.closest('[data-a]'); if (!bt) return;
    if (bt.dataset.a === 'zin' && L < 7) { L++; draw(true); }
    if (bt.dataset.a === 'zout') { L = 0; draw(false); }
  });
  draw(false);
  return {};
}

/* ---------- Ziffern ausrollen ---------- */
function digitsOf(str, n) {
  const m = /^(\d+),(\d*)(?:\{(\d+)\})?$/.exec(str), pre = m[2] || '', per = m[3] || '', out = [];
  for (let i = 0; i < n; i++) out.push(i < pre.length ? pre[i] : per ? per[(i - pre.length) % per.length] : '0');
  return { int: m[1], d: out };
}
function vizTapes(el, spec) {
  const rows = [spec.x].concat(spec.y ? [spec.y] : []), MAX = 10;
  let n = 2;
  function draw() {
    const data = rows.map(r => digitsOf(r, MAX));
    let diff = -1;
    if (rows.length === 2) for (let i = 0; i < MAX; i++) if (data[0].d[i] !== data[1].d[i]) { diff = i; break; }
    $('.tp-rows', el).innerHTML = rows.map((r, ri) => '<div class="tp-row"><span class="tp-lab">' + T(r) + ' =</span><span class="tp-digs"><span class="tp-d int">' + data[ri].int + ',</span>' +
      data[ri].d.slice(0, n).map((d, i) => '<span class="tp-d' + (i === diff ? ' mark' : '') + (i === n - 1 ? ' new' : '') + '">' + d + '</span>').join('') + '<span class="tp-d muted">…</span></span></div>').join('');
    $('[data-a=roll]', el).disabled = n >= MAX;
    $('.tp-note', el).textContent = diff >= 0 && n > diff ? 'Erste verschiedene Stelle: die ' + (diff + 1) + '. Nachkommastelle.' : rows.length === 2 ? 'Rolle weiter aus, bis sich die beiden Zahlen unterscheiden.' : 'Rolle die Periode so weit aus, wie du sie brauchst.';
  }
  el.innerHTML = '<div class="tapes"><div class="tp-rows"></div><p class="tp-note muted" aria-live="polite"></p><div class="m-btns"><button class="btn" type="button" data-a="roll">Eine Ziffer ausrollen</button></div></div>';
  el.addEventListener('click', ev => { if (ev.target.closest('[data-a=roll]') && n < MAX) { n++; draw(); } });
  draw();
  return {};
}

/* ---------- Zahlenstrahl für Testaufgaben ---------- */
function figLine(spec) {
  const W = 400, x0 = 30, x1 = 366, y = 44, step = (x1 - x0) / spec.n;
  let s = '<svg viewBox="0 0 ' + W + ' 96" class="figline" role="img" aria-label="Zahlenstrahl von ' + spec.lo + ' bis ' + spec.hi + ' mit einer Markierung">';
  s += '<line x1="' + (x0 - 14) + '" y1="' + y + '" x2="' + (x1 + 18) + '" y2="' + y + '" class="z-axis"/><path d="M' + (x1 + 18) + ' ' + y + 'l-9 -5v10z" class="z-head"/>';
  for (let i = 0; i <= spec.n; i++) {
    const x = x0 + i * step, big = i === 0 || i === spec.n;
    s += '<line x1="' + x + '" y1="' + (y - (big ? 12 : 7)) + '" x2="' + x + '" y2="' + (y + (big ? 12 : 7)) + '" class="z-tick"/>';
    if (big) s += '<text x="' + x + '" y="' + (y + 34) + '" text-anchor="middle" class="z-lab">' + (i === 0 ? spec.lo : spec.hi) + '</text>';

  return s + '</svg>';
}

/* ===== items.js: Aufgabentypen (mc, multi, num, per, bar, order, cloze) ===== */
/* opts: { mode: 'learn' | 'test', onDone(firstTryCorrect) } */
function correctText(item) {
  if (item.t === 'mc') return T(item.opts[item.c]);
  if (item.t === 'multi') return item.c.map(i => T(item.opts[i])).join(', ');
  if (item.t === 'num') return T(item.a) + (item.unit ? ' ' + item.unit : '');
  if (item.t === 'per') return T(rep(item.fr[0], item.fr[1]));
  if (item.t === 'bar') return T(item.int + ',' + item.digits.split('').map((d, i) => item.c.indexOf(i) >= 0 ? '{' + d + '}' : d).join('').replace(/\}\{/g, ''));
  if (item.t === 'order') return sortedOpts(item).map(T).join(' &lt; ');
  if (item.t === 'cloze') return item.parts.map(p => typeof p === 'string' ? T(p) : '<strong>' + T(p.opts[p.c]) + '</strong>').join('');
  return '';
}
function sortedOpts(item) { return item.opts.slice().sort((x, y) => frCmp(val(x), val(y))); }

function mountItem(el, item, opts) {
  const id = ++UID, learn = opts.mode === 'learn';
  let tries = 0, finished = false;
  const fig = item.fig ? '<div class="it-fig">' + (item.fig.v === 'line' ? figLine(item.fig) : '') + '</div>' : '';
  el.innerHTML = '<div class="item" data-type="' + item.t + '">' + fig + '<p class="it-q">' + T(item.q) + '</p><div class="it-body"></div><div class="it-fb" aria-live="polite"></div></div>';
  const body = $('.it-body', el), fb = $('.it-fb', el);

  function finish(ok, showAnswer) {
    finished = true;
    const first = ok && tries === 0;
    fb.className = 'it-fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = '<p class="fb-head">' + (ok ? '<span class="ic" aria-hidden="true">✓</span> Richtig.' : '<span class="ic" aria-hidden="true">✗</span> ' + (showAnswer ? 'Richtig wäre: ' + correctText(item) : 'Noch nicht.')) + '</p>' + (item.ex ? '<p>' + T(item.ex) + '</p>' : '');
    $$('button, input, select', body).forEach(x => { x.disabled = true; });
    opts.onDone && opts.onDone(first, ok);
  }
  function wrong(extra) {
    tries++;
    if (!learn) { finish(false, true); return true; }
    if (tries >= 3) { finish(false, true); return true; }
    fb.className = 'it-fb show hint';
    fb.innerHTML = '<p class="fb-head"><span class="ic" aria-hidden="true">✗</span> Noch nicht.</p><p>' + T(extra || item.hint || 'Probier es noch einmal.') + '</p>';
    return false;

  /* ---- Multiple Choice ---- */
  if (item.t === 'mc') {
    const short = item.opts.every(o => o.length <= 2);
    const order = (item.fixed || short) ? item.opts.map((_, i) => i) : shuffle(item.opts.map((_, i) => i));
    body.innerHTML = '<div class="opts cols' + (item.cols || 2) + '">' + order.map(i => '<button type="button" class="opt" data-i="' + i + '">' + T(item.opts[i]) + '</button>').join('') + '</div>';

      const bt = ev.target.closest('.opt'); if (!bt || finished || bt.disabled) return;

  }

    body.innerHTML = '<div class="opts multi">' + item.opts.map((o, i) => '<button type="button" class="opt tog" data-i="' + i + '" aria-pressed="false">' + T(o) + '</button>').join('') + '</div><button type="button" class="btn check">Prüfen</button>';
    body.addEventListener('click', ev => {
      if (finished) return;
      const bt = ev.target.closest('.tog');
      if (bt) { const on = bt.getAttribute('aria-pressed') !== 'true'; bt.setAttribute('aria-pressed', on); bt.classList.remove('wrongo'); return; }
      if (!ev.target.closest('.check')) return;
      const sel = $$('.tog[aria-pressed=true]', body).map(b => +b.dataset.i);
      const ok = sel.length === item.c.length && sel.every(i => item.c.indexOf(i) >= 0);
      if (ok) { $$('.tog[aria-pressed=true]', body).forEach(b => b.classList.add('right')); finish(true); }
      else {
        const miss = item.c.filter(i => sel.indexOf(i) < 0).length, extra = sel.filter(i => item.c.indexOf(i) < 0).length;
        const msg = (extra ? extra + (extra === 1 ? ' Karte gehört nicht dazu. ' : ' Karten gehören nicht dazu. ') : '') + (miss ? miss + (miss === 1 ? ' Karte fehlt noch. ' : ' Karten fehlen noch. ') : '') + (item.hint || '');
        if (wrong(msg)) $$('.tog', body).forEach(b => { const i = +b.dataset.i; b.classList.toggle('right', item.c.indexOf(i) >= 0); b.classList.toggle('wrongo', item.c.indexOf(i) < 0 && b.getAttribute('aria-pressed') === 'true'); });
      }
    });
  }
  /* ---- Zahl eintippen ---- */
  else if (item.t === 'num') {
    body.innerHTML = '<form class="numform"><label class="sr" for="num' + id + '">Deine Antwort</label><input id="num' + id + '" class="numin" type="text" inputmode="decimal" autocomplete="off" placeholder="Antwort">' + (item.unit ? '<span class="unit">' + item.unit + '</span>' : '') + '<button class="btn check" type="submit">Prüfen</button></form>';
    $('form', body).addEventListener('submit', ev => {
      ev.preventDefault(); if (finished) return;
      const inp = $('.numin', body), f = parseInput(inp.value);
      if (!f) { fb.className = 'it-fb show hint'; fb.innerHTML = '<p>Bitte eine Zahl eingeben, zum Beispiel 0,75.</p>'; return; }
      let ok;
      if (item.between) ok = frCmp(f, val(item.between[0])) > 0 && frCmp(f, val(item.between[1])) < 0;
      else ok = frEq(f, val(item.a));
      if (ok) { inp.classList.add('right'); finish(true); } else { inp.classList.add('wrongo'); if (!wrong()) { inp.select(); setTimeout(() => inp.classList.remove('wrongo'), 600); } }
    });
  }
  /* ---- Dezimalzahl mit Periode eintippen ---- */
  else if (item.t === 'per') {

      '<div><label for="pb' + id + '">Periode (leer lassen, wenn es keine gibt)</label><input id="pb' + id + '" class="numin perin" type="text" inputmode="numeric" autocomplete="off" placeholder="z. B. 6"></div></div>' +
      '<p class="per-prev">Deine Zahl: <span class="pv">?</span></p><button class="btn check" type="submit">Prüfen</button></form>';
    const ia = $('#pa' + id, body), ib = $('#pb' + id, body), pv = $('.pv', body);

      return a + (b ? '{' + b + '}' : '');
    };

      ev.preventDefault(); if (finished) return;
      const s = read();
      if (!s) { fb.className = 'it-fb show hint'; fb.innerHTML = '<p>Trag links die Zahl bis zur Periode ein (zum Beispiel 0,4) und rechts die Ziffern, die sich wiederholen.</p>'; return; }
      const ok = frEq(decToFr(s), FR(item.fr[0], item.fr[1]));
      if (ok) { finish(true); if (s !== rep(item.fr[0], item.fr[1])) fb.innerHTML += '<p>Dein Wert stimmt. Üblich ist die kürzeste Schreibweise: ' + T(rep(item.fr[0], item.fr[1])) + '.</p>'; }
      else wrong();

  }
  /* ---- Periodenstrich setzen ---- */
  else if (item.t === 'bar') {
    body.innerHTML = '<div class="barset"><span class="bs-int">' + item.int + ',</span>' + item.digits.split('').map((d, i) => '<button type="button" class="bs-d" data-i="' + i + '" aria-pressed="false" aria-label="Ziffer ' + d + '">' + d + '</button>').join('') + (item.tail ? '<span class="bs-tail">' + item.tail + '</span>' : '') + '</div><button type="button" class="btn check">Prüfen</button>';
    body.addEventListener('click', ev => {
      if (finished) return;
      const d = ev.target.closest('.bs-d');
      if (d) { d.setAttribute('aria-pressed', d.getAttribute('aria-pressed') !== 'true'); return; }
      if (!ev.target.closest('.check')) return;
      const sel = $$('.bs-d[aria-pressed=true]', body).map(b => +b.dataset.i);
      const ok = sel.length === item.c.length && sel.every(i => item.c.indexOf(i) >= 0);

    });
  }
  /* ---- Ordnen ---- */
  else if (item.t === 'order') {
    const want = sortedOpts(item);
    let picked = [];
    const draw = () => {
      body.innerHTML = '<div class="ord-out">' + (picked.length ? picked.map((o, i) => (i ? '<span class="lt">&lt;</span>' : '') + '<span class="ord-chip">' + T(o) + '</span>').join('') : '<span class="muted">Tippe zuerst die kleinste Zahl an.</span>') + '</div>' +
        '<div class="opts ord">' + item.opts.map((o, i) => '<button type="button" class="opt" data-i="' + i + '"' + (picked.indexOf(o) >= 0 ? ' disabled' : '') + '>' + T(o) + '</button>').join('') + '</div>' +
        '<div class="row"><button type="button" class="btn ghost small reset">Zurücksetzen</button><button type="button" class="btn check"' + (picked.length < item.opts.length ? ' disabled' : '') + '>Prüfen</button></div>';

    });
  }

function runSprint(disc) {
  const game = $('#game'), TOTAL = 60;
  let left = TOTAL, score = 0, combo = 0, right = 0, wrongs = [], q = null, locked = false, timer = null, lastTick = performance.now(), paused = false, over = false;
  game.innerHTML = '<div class="g-hud"><div class="g-time"><div class="g-bar"><i></i></div><span class="g-sec">60</span></div><div class="g-score"><span class="lab">Punkte</span><strong id="gsc">0</strong></div><div class="g-combo" id="gco"></div></div><div class="g-q" id="gq"></div><div class="opts" id="gopts"></div><p class="g-ex" id="gex" aria-live="polite"></p>';

    gq.className = 'g-q' + (q.big ? ' big' : ''); gq.innerHTML = qHTML(q);

  }

  }
  function answer(i) {
    if (locked || over || !q) return; locked = true;

    if (i === q.c) {
      combo++; right++; score += combo >= 6 ? 20 : combo >= 3 ? 15 : 10;
      bt[i].classList.add('right'); hud(); setTimeout(() => { if (!over) ask(); }, 220);
    } else {
      combo = 0; left -= 3; wrongs.push(q);

      gex.className = 'g-ex show'; gex.innerHTML = T(q.ex);
      paused = true; hud();

    }
  }
  function end() {
    over = true; clearInterval(timer); document.removeEventListener('keydown', key);
    const prev = (S.best || {})[disc.id] || 0, rec = score > prev;
    if (rec) { S.best = S.best || {}; S.best[disc.id] = score; save(); }
    const m = medalFor(disc, score);
    game.innerHTML = '<div class="g-end"><p class="eyebrow">' + disc.name + '</p><h1>' + score + ' Punkte</h1>' +
      '<p class="lead">' + right + ' richtig, ' + wrongs.length + ' falsch.' + (rec ? ' <strong>Neuer Rekord!</strong>' : prev ? ' Dein Rekord: ' + prev + '.' : '') + (m >= 0 ? ' <span class="medal m' + m + '">' + MEDALS[m] + '</span>' : '') + '</p>' +
      (m < 3 ? '<p class="muted">Bis ' + MEDALS[m + 1] + ' fehlen ' + (disc.medals[m + 1] - score) + ' Punkte.</p>' : '') +
      '<div class="row"><button class="btn" type="button" id="again">Nochmal</button><a class="btn ghost" href="#arena">Andere Disziplin</a></div>' +
      (wrongs.length ? '<h2 class="h-sm">Das schaust du dir noch einmal an</h2><ul class="wrong-list">' + wrongs.map(w => '<li><span class="wq">' + qHTML(w) + '</span><span class="wa">' + T(w.ex) + '</span></li>').join('') + '</ul>' : '<p>Kein einziger Fehler. Stark.</p>') + '</div>';
    $('#again').addEventListener('click', () => { game.innerHTML = ''; runSprint(disc); });
  }
  function key(ev) { const n = parseInt(ev.key, 10); if (n >= 1 && n <= 4 && q && n <= q.opts.length) { ev.preventDefault(); answer(n - 1); } }
  go.addEventListener('click', ev => { const bt = ev.target.closest('.opt'); if (bt) answer(+bt.dataset.i); });
  document.addEventListener('keydown', key);
  timer = setInterval(() => { const now = performance.now(); if (!paused) left -= (now - lastTick) / 1000; lastTick = now; hud(); if (left <= 0 && !paused && !over) end(); }, 100);
  onLeave(() => { over = true; clearInterval(timer); document.removeEventListener('keydown', key); });
  ask(); hud();
}

  }

    }
  }
  function end(w) {
    over = true; document.removeEventListener('keydown', key);
    game.innerHTML = '<div class="g-end"><p class="eyebrow">Duell · ' + disc.name + '</p><h1>' + esc(names[w]) + ' gewinnt</h1><p class="lead">' + esc(names[0]) + ' ' + sc[0] + ' : ' + sc[1] + ' ' + esc(names[1]) + '</p><div class="row"><button class="btn" type="button" id="again">Revanche</button><a class="btn ghost" href="#arena">Andere Disziplin</a></div></div>';
    $('#again').addEventListener('click', () => runDuel(disc, cfg));

  game.addEventListener('click', ev => { const bt = ev.target.closest('.opt'); if (!bt) return; answer(+bt.closest('.d-panel').dataset.p, +bt.dataset.i); });

/* ---------- Reste-Rallye ---------- */
function viewRallye() {
  show('<section class="page narrow"><p class="crumb"><a href="#arena">← Arena</a></p><div class="game" id="game"><div class="g-ready"><p class="eyebrow">Reste-Rallye</p><h1>Vier Divisionen auf Zeit</h1><p class="lead">Du rechnest wie im Heft, nur schneller. Tippe in jedem Schritt die nächste Ziffer des Ergebnisses.</p>' +
    '<ul class="rules"><li>Kommt der Rest 0, ist die Aufgabe fertig.</li><li>Sobald ein Rest zum zweiten Mal auftaucht, drückst du den Summer »Rest doppelt!«. Danach setzt du den Periodenstrich.</li><li>Jeder Fehler kostet 5 Strafsekunden.</li><li>Mit Tastatur: Ziffern 0 bis 9, Leertaste für den Summer.</li></ul>' +
    '<p class="disc-best">' + (S.rallye ? 'Deine Bestzeit: <strong>' + fmtTime(S.rallye) + '</strong>' : 'Noch keine Bestzeit') + '</p><button class="btn big" type="button" id="go">Los</button></div></div></section>');
  $('#go').addEventListener('click', runRallye);
}
function runRallye() {
  const game = $('#game');
  const tasks = [pick(RALLYE.warm)].concat(shuffle(RALLYE.loop).slice(0, 2)).concat([pick(RALLYE.hard)]);
  let ti = 0, model, shown, phase, pen = 0, t0 = performance.now(), timer = null, over = false, results = [], barSel = [];
  game.innerHTML = '<div class="g-hud r-hud"><div class="g-score"><span class="lab">Aufgabe</span><strong id="rno">1 / 4</strong></div><div class="g-score"><span class="lab">Zeit</span><strong id="rtime">0,0 s</strong></div><div class="g-score"><span class="lab">Strafe</span><strong id="rpen">0 s</strong></div></div>' +
    '<p class="r-prompt" id="rprompt" aria-live="polite"></p><div class="r-heft" id="rheft"></div><div class="r-rems" id="rrems"></div><div id="rbar"></div>' +
    '<div class="r-pad" id="rpad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => '<button type="button" class="key" data-d="' + n + '">' + n + '</button>').join('') + '<button type="button" class="key buzz" id="rbuzz">Rest doppelt!</button></div><p class="r-msg" id="rmsg" aria-live="polite"></p>';
  const heft = $('#rheft'), prompt = $('#rprompt'), msg = $('#rmsg'), remsEl = $('#rrems'), barEl = $('#rbar'), pad = $('#rpad');
  const elapsed = () => (performance.now() - t0) / 1000 + pen;
  function penal(text) { pen += 5; $('#rpen').textContent = pen + ' s'; msg.className = 'r-msg bad'; msg.textContent = text + ' (+5 s)'; game.classList.remove('shake'); void game.offsetWidth; game.classList.add('shake'); }
  function draw() {
    renderDivision(heft, model, shown, { maxCell: 30, noBar: phase !== 'done', noHit: phase === 'digits' || phase === 'buzz', qmark: true });
    const rems = model.e.rems.slice(0, shown);
    remsEl.innerHTML = '<span class="lab">Reste bisher</span>' + (rems.length ? rems.map((r, i) => '<span class="rchip' + ((phase === 'bar' || phase === 'done') && model.periodic && (i === model.repStep || i === model.steps.length - 1) ? ' hit' : '') + '">' + r + '</span>').join('') : '<span class="muted">noch keine</span>');
    if (phase === 'digits') {
      const partial = shown === 0 ? model.a : model.steps[shown - 1].rem * 10;
      prompt.innerHTML = 'Wie oft passt <strong>' + model.b + '</strong> in <strong>' + partial + '</strong>?';
    } else if (phase === 'buzz') prompt.innerHTML = 'Schau dir die Reste an. Was fällt dir auf?';
    else if (phase === 'bar') prompt.innerHTML = 'Setze den Periodenstrich: Tippe die Ziffern an, die sich wiederholen.';
    else prompt.innerHTML = T(model.a + '/' + model.b) + ' = <strong>' + T(rep(model.a, model.b)) + '</strong>' + (model.periodic ? ' (periodisch)' : ' (abbrechend)');
    pad.style.display = (phase === 'digits' || phase === 'buzz') ? '' : 'none';
    if (phase === 'bar') {
      const e = model.e;
      barEl.innerHTML = '<div class="barset"><span class="bs-int">' + e.int + ',</span>' + e.digits.map((d, i) => '<button type="button" class="bs-d" data-i="' + i + '" aria-pressed="' + (barSel.indexOf(i) >= 0) + '" aria-label="Ziffer ' + d + '">' + d + '</button>').join('') + '<span class="bs-tail">…</span></div><button type="button" class="btn check" id="rcheck">Fertig</button>';
    } else barEl.innerHTML = '';
  }
  function start() {
    const t = tasks[ti]; model = divisionModel(t[0], t[1]); shown = 0; phase = 'digits'; barSel = [];
    $('#rno').textContent = (ti + 1) + ' / ' + tasks.length; msg.textContent = ''; msg.className = 'r-msg'; draw();
  }
  function finishTask() {
    phase = 'done'; draw(); results.push([model.a, model.b]);
    msg.className = 'r-msg good'; msg.textContent = 'Geschafft.';
    setTimeout(() => { if (over) return; ti++; if (ti >= tasks.length) end(); else start(); }, 1500);
  }
  function digit(d) {
    if (over) return;
    if (phase === 'buzz') { msg.className = 'r-msg bad'; msg.textContent = 'Stopp! Schau dir die Reste an und drück den Summer.'; return; }
    if (phase !== 'digits') return;
    if (d === model.steps[shown].digit) {
      shown++; msg.textContent = ''; msg.className = 'r-msg';
      if (shown === model.steps.length) { if (model.periodic) { phase = 'buzz'; draw(); } else finishTask(); }
      else draw();
    } else {
      const partial = shown === 0 ? model.a : model.steps[shown - 1].rem * 10;
      penal(d * model.b > partial ? d + ' · ' + model.b + ' = ' + (d * model.b) + ' ist zu groß.' : 'Die ' + model.b + ' passt öfter in die ' + partial + '.');
    }
  }
  function buzz() {
    if (over) return;
    if (phase === 'buzz') { phase = 'bar'; msg.className = 'r-msg good'; msg.textContent = 'Richtig gesehen: Der Rest ' + model.steps[shown - 1].rem + ' ist doppelt.'; draw(); }
    else if (phase === 'digits') penal('Noch ist kein Rest doppelt.');
  }
  function checkBar() {
    const want = []; for (let i = model.repStep; i < model.e.digits.length; i++) want.push(i);
    const ok = barSel.length === want.length && want.every(i => barSel.indexOf(i) >= 0);
    if (ok) finishTask();
    else penal('Der Strich stimmt noch nicht. Die Periode beginnt mit der Ziffer, die nach dem ersten doppelten Rest entstanden ist.');
  }
  function end() {
    over = true; clearInterval(timer); document.removeEventListener('keydown', key);
    const total = elapsed(), prev = S.rallye || 0, rec = !prev || total < prev;
    if (rec) { S.rallye = Math.round(total * 10) / 10; save(); }
    game.innerHTML = '<div class="g-end"><p class="eyebrow">Reste-Rallye</p><h1>' + fmtTime(total) + '</h1><p class="lead">' + (pen ? 'Darin stecken ' + pen + ' Strafsekunden. ' : 'Ohne einen einzigen Fehler. ') + (rec ? '<strong>Neue Bestzeit!</strong>' : 'Deine Bestzeit: ' + fmtTime(prev) + '.') + '</p>' +
      '<ul class="wrong-list">' + results.map(r => '<li><span class="wq">' + T(r[0] + '/' + r[1]) + ' = ' + T(rep(r[0], r[1])) + '</span><span class="wa">' + (terminates(r[0], r[1]) ? 'abbrechend' : 'periodisch') + '</span></li>').join('') + '</ul>' +
      '<div class="row"><button class="btn" type="button" id="again">Nochmal</button><a class="btn ghost" href="#arena">Zur Arena</a></div></div>';
    $('#again').addEventListener('click', runRallye);
  }
  function key(ev) {
    if (ev.target && /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
    if (/^\d$/.test(ev.key)) { ev.preventDefault(); digit(+ev.key); }
    else if (ev.key === ' ' || ev.key === 'Enter') { if (phase === 'bar' && ev.key === 'Enter') { ev.preventDefault(); checkBar(); } else if (ev.key === ' ') { ev.preventDefault(); buzz(); } }
  }
  game.addEventListener('click', ev => {
    if (over) return;
    const k = ev.target.closest('.key[data-d]'); if (k) { digit(+k.dataset.d); return; }
    if (ev.target.closest('#rbuzz')) { buzz(); return; }
    const b = ev.target.closest('.bs-d'); if (b && phase === 'bar') { const i = +b.dataset.i, at = barSel.indexOf(i); if (at >= 0) barSel.splice(at, 1); else barSel.push(i); draw(); return; }
    if (ev.target.closest('#rcheck')) checkBar();
  });
  document.addEventListener('keydown', key);
  timer = setInterval(() => { $('#rtime').textContent = String(elapsed().toFixed(1)).replace('.', ',') + ' s'; }, 100);
  onLeave(() => { over = true; clearInterval(timer); document.removeEventListener('keydown', key); });
  start();
}

  const nextSt = STATIONS.filter(s => !(S.st[s.id] && S.st[s.id].done))[0] || STATIONS[0];
  const block = '<span>142857</span><span class="alt">142857</span>';
  show('<section class="hero"><div class="hero-text"><p class="eyebrow">Mathe Klasse 6 · Kapitel II · Brüche in Dezimalschreibweise</p><h1>Was passiert hinter dem Komma?</h1>' +
    '<p class="lead">Manche Divisionen hören auf, andere laufen für immer weiter. Hier findest du heraus, warum das so ist, wirst schnell im Umrechnen und prüfst, ob du für den Test bereit bist.</p>' +
    '<div class="row"><a class="btn big" href="#station-' + nextSt.id + '">' + (dc ? 'Weiter mit Station ' + nextSt.n : 'Mit Station 1 starten') + '</a><a class="btn ghost big" href="#test">Zum Test-Check</a></div></div>' +
    '<div class="hero-art" aria-hidden="true"><div class="calc heroc"><div class="lcd"><span class="lcd-expr">1 : 7 =</span><span class="lcd-out">0,1428571</span></div><div class="tape"><div class="tape-run">' + block + block + block + block + block + '</div></div><p class="tape-cap">Der Rechner zeigt acht Ziffern. Die Division hört nie auf.</p></div></div></section>' +

    '<section class="trio"><a class="way" href="#entdecken"><span class="way-n">1</span><h2>Entdecken</h2><p>Fünf kurze Stationen mit einer Idee: Schriftliches Dividieren ist eine Maschine, und der Rest ist ihr Gedächtnis.</p><p class="way-stat">' + dc + ' von ' + STATIONS.length + ' Stationen geschafft</p></a>' +
    '<a class="way" href="#arena"><span class="way-n">2</span><h2>Arena</h2><p>60-Sekunden-Sprints gegen deinen Rekord, Duelle zu zweit an einem Gerät und die Reste-Rallye.</p><p class="way-stat">' + (recs ? recs + (recs === 1 ? ' Rekord' : ' Rekorde') + ' aufgestellt' : 'Noch kein Rekord') + '</p></a>' +
    '<a class="way" href="#test"><span class="way-n">3</span><h2>Test-Check</h2><p>Die neun Punkte von deiner Checkliste, mit Ampel wie auf dem Arbeitsblatt. Jede Lösung wird erklärt.</p><p class="way-stat">' + (S.end ? 'Generalprobe gemacht' : S.mid ? 'Schnell-Check gemacht' : 'Noch nicht geprüft') + '</p></a></section>' +

    '<section class="block"><h2>Dein Plan bis zum Test</h2><p class="lead">Vier Tage, jeden Tag 10 bis 15 Minuten. Wenn du weniger Zeit hast: Tag 3 und Tag 4 sind die wichtigsten.</p><ol class="plan">' +
    '<li><strong>Tag 1</strong><span><a href="#station-maschine">Station 1</a> und <a href="#station-zweifuenf">Station 2</a>, danach ein Sprint im <a href="#arena-scanner">2-5-Scanner</a>.</span></li>' +
    '<li><strong>Tag 2</strong><span><a href="#station-zoom">Station 3</a> und <a href="#station-strich">Station 4</a>, danach eine <a href="#arena-rallye">Reste-Rallye</a>.</span></li>' +
    '<li><strong>Tag 3</strong><span><a href="#test-schnell">Schnell-Check</a>. Für jede gelbe oder rote Ampel einen Sprint in der passenden Disziplin.</span></li>' +
    '<li><strong>Tag 4</strong><span><a href="#test-general">Generalprobe</a> mit Stift und Papier, danach den <a href="#spickzettel">Spickzettel</a> einmal laut vorlesen.</span></li></ol></section>' +

    '<section class="block" id="homecheck"><h2>Deine Checkliste</h2>' + checkTable() + '</section>' +

    '<section class="block"><details class="parents"><summary>For parents · 给家长</summary><div class="par-grid"><div lang="en"><h3>What this is</h3><p>A review and test-preparation app for chapter II (decimals) of the Grade 6 maths book, built around the teacher\'s nine-point checklist. It is written in German because the test asks for the German technical terms.</p>' +
    '<h3>How to use it</h3><p>10 to 15 minutes a day. <strong>Entdecken</strong> explains the why in five short stations. <strong>Arena</strong> builds speed with 60-second sprints and a two-player duel on one device. You can play against your child: the questions are almost all numbers. <strong>Test-Check</strong> mirrors the teacher\'s sheet. The Start column is the self-rating from the worksheet, Mitte is filled in by the quick check and Ende by the dress rehearsal (Generalprobe).</p>' +
    '<h3>Two differences from Chinese textbooks</h3><p>Germany writes a decimal comma (3,5) and marks repeating digits with a bar over all of them, where Chinese books put a dot over the first and last repeating digit. German long division is written on one line (26 : 8 = 3,25) with the working underneath. The test expects this layout.</p><p>Progress is stored only in this browser on this device.</p></div>' +
    '<div lang="zh"><h3>这是什么</h3><p>针对六年级数学课本第二章（小数）的复习和备考小程序，按照老师发的九项清单（Checkliste）设计。界面用德语，因为考试要求使用德语的数学术语。</p>' +
    '<h3>怎么用</h3><p>每天 10 到 15 分钟。<strong>Entdecken（探索）</strong>用五个小站讲清楚“为什么”。<strong>Arena（竞技场）</strong>练速度：60 秒冲刺，还有两个人在同一台设备上的对战。您可以和孩子比一比，题目几乎都是数字。<strong>Test-Check（考前检查）</strong>对应老师的清单：Start 一栏是孩子在练习纸上的自评，Mitte 由快速检查（Schnell-Check）填写，Ende 由总彩排（Generalprobe）填写。</p>' +
    '<h3>和中国课本的两点不同</h3><p>德国用小数逗号（3,5）；循环节用一条横线盖住所有循环的数字，而中国课本是在循环节的首末数字上加点。德国的竖式除法写成一行（26 : 8 = 3,25），演算过程写在下面，考试要求这种写法。</p><p>学习进度只保存在这台设备的浏览器里。</p></div></div>' +
    '<p class="muted small">Die Wortliste auf Deutsch, Chinesisch und Englisch steht im <a href="#spickzettel">Spickzettel</a>.</p></details></section>');
  bindCheckTable($('#homecheck'));
}

/* ---------- Entdecken ---------- */
function viewDiscover() {
  show('<section class="page"><header class="page-head"><p class="eyebrow">Entdecken</p><h1>Fünf Stationen, eine Idee</h1><p class="lead">Jede Station dauert etwa fünf Minuten. Du beantwortest Fragen, probierst an einem Modell aus und nimmst am Ende einen Merkzettel und einen fertigen Erklärsatz für den Test mit.</p></header><div class="st-list">' +
    STATIONS.map(s => {
      const st = S.st[s.id] || {};
      return '<a class="st-card" href="#station-' + s.id + '"><span class="st-n">' + s.n + '</span><div><h3>' + s.title + (s.bonus ? ' <span class="tag">Bonus</span>' : '') + '</h3><p>' + s.ask + '</p><p class="muted small">' + s.steps.length + ' Schritte · etwa ' + s.min + ' Minuten' + (st.done ? ' · <span class="okmark">✓ geschafft</span>' : st.step ? ' · angefangen' : '') + '</p></div></a>';
    }).join('') + '</div></section>');
}
function viewStation(id) {
  const st = stById(id); if (!st) { location.hash = '#entdecken'; return; }
  const prog = S.st[id] = S.st[id] || { step: 0 };
  let i = Math.min(prog.done ? 0 : prog.step || 0, st.steps.length - 1), maxSeen = prog.done ? st.steps.length : (prog.step || 0);
  show('<section class="page"><p class="crumb"><a href="#entdecken">← Alle Stationen</a></p><header class="page-head tight"><p class="eyebrow">Station ' + st.n + ' von ' + STATIONS.length + (st.bonus ? ' · Bonus' : '') + '</p><h1>' + st.title + '</h1><p class="lead">' + st.ask + '</p></header>' +
    '<nav class="dots" id="dots" aria-label="Schritte"></nav><div class="st-grid" id="stgrid"><div class="st-viz" id="stviz"></div><div class="st-side"><div class="st-text" id="sttext"></div><div id="stitem"></div><div class="st-nav" id="stnav"></div></div></div><div id="stsum"></div></section>');
  const dots = $('#dots'), grid = $('#stgrid'), sum = $('#stsum');
  function drawDots() {
    dots.innerHTML = st.steps.map((_, k) => '<button type="button" class="dot' + (k === i ? ' cur' : '') + (k < maxSeen ? ' done' : '') + '" data-k="' + k + '"' + (k > maxSeen ? ' disabled' : '') + ' aria-label="Schritt ' + (k + 1) + '">' + (k + 1) + '</button>').join('') +
      '<button type="button" class="dot fin' + (i === st.steps.length ? ' cur' : '') + '" data-k="' + st.steps.length + '"' + (maxSeen < st.steps.length ? ' disabled' : '') + ' aria-label="Merkzettel">Merkzettel</button>';
  }
  function step() {
    runLeave(); sum.innerHTML = ''; grid.style.display = '';
    const sp = st.steps[i];
    grid.classList.toggle('noviz', !sp.viz);
    const viz = mountViz($('#stviz'), sp.viz);
    $('#sttext').innerHTML = '<p class="step-no">Schritt ' + (i + 1) + ' von ' + st.steps.length + '</p><p>' + T(sp.text) + '</p>';
    const nav = $('#stnav'); nav.innerHTML = '';
    mountItem($('#stitem'), sp.item, {
      mode: 'learn', onDone: () => {
        if (viz.reveal) viz.reveal();
        maxSeen = Math.max(maxSeen, i + 1); prog.step = Math.max(prog.step || 0, i + 1); save(); drawDots();
        nav.innerHTML = '<button type="button" class="btn big" id="stnext">' + (i + 1 < st.steps.length ? 'Weiter' : 'Zum Merkzettel') + '</button>';
        $('#stnext').addEventListener('click', () => { i++; if (i < st.steps.length) step(); else summary(); });
        $('#stnext').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
    drawDots();
  }
  function summary() {
    runLeave(); i = st.steps.length; prog.done = true; prog.step = st.steps.length; save();
    grid.style.display = 'none'; drawDots();
    const nx = STATIONS[st.n] /* nächste Station */;
    sum.innerHTML = '<div class="summary"><div class="merk"><h2>Merkzettel</h2><ul>' + st.merk.map(m => '<li>' + T(m) + '</li>').join('') + '</ul></div>' +
      '<div class="say"><h2>So erklärst du es im Test</h2><p>' + T(st.say) + '</p></div>' +
      '<div class="row"><a class="btn big" href="#' + st.next[0] + '">' + st.next[1] + '</a>' + (nx ? '<a class="btn ghost big" href="#station-' + nx.id + '">Weiter zu Station ' + nx.n + '</a>' : '<a class="btn ghost big" href="#test">Zum Test-Check</a>') + '</div></div>';
    window.scrollTo(0, 0);
  }
  dots.addEventListener('click', ev => {
    const b = ev.target.closest('.dot'); if (!b || b.disabled) return;
    i = +b.dataset.k; if (i >= st.steps.length) summary(); else step();
  });
  step();
}

/* ---------- Test-Check ---------- */
function viewTest() {
  show('<section class="page"><header class="page-head"><p class="eyebrow">Test-Check</p><h1>Bin ich bereit?</h1><p class="lead">Die Aufgaben folgen den neun Punkten deiner Checkliste. Nach jeder Antwort siehst du die Lösung mit Erklärung. Leg Stift und Papier bereit, für die Divisionen brauchst du sie.</p></header>' +
    '<div class="two"><article class="disc"><div class="disc-top"><h3>Schnell-Check</h3><span class="tag">11 Aufgaben · etwa 8 Minuten</span></div><p>Eine Aufgabe zu jedem Punkt der Checkliste, drei zu abbrechenden und periodischen Dezimalzahlen. Füllt die Spalte Mitte.</p><a class="btn" href="#test-schnell">Schnell-Check starten</a></article>' +
    '<article class="disc"><div class="disc-top"><h3>Generalprobe</h3><span class="tag">28 Aufgaben · etwa 20 Minuten</span></div><p>Drei Aufgaben zu jedem Punkt, vier zum Schwerpunkt des Tests. Jedes Mal neu gemischt. Füllt die Spalte Ende.</p><a class="btn" href="#test-general">Generalprobe starten</a></article></div>' +
    '<section class="block" id="testcheck"><h2>Deine Checkliste</h2>' + checkTable() + '</section></section>');
  bindCheckTable($('#testcheck'));
}
function buildTest(kind) {
  const out = [];
  SKILLS.forEach(k => {
    const all = CHECK.filter(c => c.k === k.id), quick = all.filter(c => c.quick), rest = shuffle(all.filter(c => !c.quick));
    if (kind === 'schnell') quick.forEach(c => out.push(c));
    else {
      const n = k.id === 8 ? 4 : 3, take = shuffle(all).slice(0, n);
      if (k.id === 8 && !take.some(c => c.t === 'per')) take[n - 1] = pick(all.filter(c => c.t === 'per'));
      if (k.id === 8 && !take.some(c => c.t === 'multi' || c.t === 'cloze')) take[0] = pick(all.filter(c => c.t === 'multi' || c.t === 'cloze'));
      take.forEach(c => out.push(c));
    }
  });
  return out;
}
function viewTestRun(kind) {
  const items = buildTest(kind), res = [], name = kind === 'schnell' ? 'Schnell-Check' : 'Generalprobe';
  let i = 0;
  show('<section class="page narrow"><p class="crumb"><a href="#test">← Test-Check</a></p><div id="trun"></div></section>');
  const run = $('#trun');
  function ask() {
    const it = items[i], sk = SKILLS[it.k - 1];
    run.innerHTML = '<div class="t-head"><p class="eyebrow">' + name + ' · Aufgabe ' + (i + 1) + ' von ' + items.length + '</p><div class="g-bar"><i style="width:' + (i / items.length * 100) + '%"></i></div><p class="t-skill"><span class="num">' + sk.id + '</span> Ich kann ' + ((sk.id === 5 || sk.id === 8) ? sk.s.charAt(0).toLowerCase() + sk.s.slice(1) : sk.s) + '.</p></div><div class="t-item" id="titem"></div><div class="st-nav" id="tnav"></div>';
    mountItem($('#titem'), it, {
      mode: 'test', onDone: (first, ok) => {
        res.push({ it, ok });
        $('#tnav').innerHTML = '<button type="button" class="btn big" id="tnext">' + (i + 1 < items.length ? 'Weiter' : 'Zur Auswertung') + '</button>';
        $('#tnext').addEventListener('click', () => { i++; if (i < items.length) { ask(); window.scrollTo(0, 0); } else finish(); });
        $('#tnext').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }
  function finish() {
    const col = {}, right = res.filter(r => r.ok).length;
    SKILLS.forEach(k => {
      const mine = res.filter(r => r.it.k === k.id), ok = mine.filter(r => r.ok).length;
      col[k.id] = ok === mine.length ? 'g' : ok === 0 ? 'r' : (mine.length >= 3 && ok / mine.length < 0.5) ? 'r' : 'y';
    });
    if (kind === 'schnell') S.mid = col; else S.end = col;
    save();
    const weak = SKILLS.filter(k => col[k.id] !== 'g'), wrongs = res.filter(r => !r.ok);
    run.innerHTML = '<div class="g-end left"><p class="eyebrow">' + name + ' · Auswertung</p><h1>' + right + ' von ' + items.length + ' richtig</h1>' +
      '<p class="lead">' + (weak.length === 0 ? 'Alle neun Ampeln stehen auf Grün. Du bist bereit.' : weak.length <= 2 ? 'Fast alles sitzt. Diese Punkte übst du noch gezielt:' : 'Du weißt jetzt genau, woran du noch arbeiten kannst:') + '</p>' +
      '<ul class="res-list">' + SKILLS.map(k => '<li class="' + col[k.id] + '">' + lights(col[k.id]) + '<div><p><span class="num">' + k.id + '</span> ' + k.s + '</p>' + (col[k.id] !== 'g' ? '<p class="res-go">' + k.go.map(g => '<a href="#' + g[0] + '">' + g[1] + '</a>').join(' · ') + '</p>' : '') + '</div></li>').join('') + '</ul>' +
      (wrongs.length ? '<h2 class="h-sm">Deine Fehler noch einmal</h2><ul class="wrong-list">' + wrongs.map(w => '<li><span class="wq">' + T(w.it.q) + '</span><span class="wa"><strong>Richtig:</strong> ' + correctText(w.it) + '</span><span class="wa">' + T(w.it.ex) + '</span></li>').join('') + '</ul>' : '') +
      '<div class="row"><a class="btn" href="#test">Zur Checkliste</a><a class="btn ghost" href="#spickzettel">Spickzettel ansehen</a></div></div>';
    window.scrollTo(0, 0);
  }
  ask();
}

/* ---------- Spickzettel ---------- */
function viewSpick() {
  show('<section class="page"><header class="page-head"><p class="eyebrow">Spickzettel</p><h1>Alles auf einen Blick</h1><p class="lead">Lies ihn am Abend vor dem Test einmal laut durch. Mitnehmen darfst du ihn nur im Kopf.</p></header>' +
    '<div class="spick">' + SPICK.map(s => '<article class="sp"><h3><span class="num">' + s.k + '</span>' + s.h + '</h3><ul>' + s.p.map(p => '<li>' + T(p) + '</li>').join('') + '</ul></article>').join('') + '</div>' +
    '<section class="block"><h2>Brüche, die du auswendig kennen solltest</h2><div class="famous">' + FAMOUS_TABLE.map(f => '<div class="fam' + (terminates(f[0], f[1]) ? '' : ' p') + '"><span>' + T(f[0] + '/' + f[1]) + '</span><span>' + T(rep(f[0], f[1])) + '</span></div>').join('') + '</div><p class="muted small">Gelb markiert: periodische Dezimalzahlen.</p></section>' +
    '<section class="block"><h2>Wortliste</h2><div class="tablewrap"><table class="words"><thead><tr><th>Deutsch</th><th>中文</th><th>English</th></tr></thead><tbody>' + WORDS.map(w => '<tr><td>' + w[0] + '</td><td lang="zh">' + w[1] + '</td><td lang="en">' + w[2] + '</td></tr>').join('') + '</tbody></table></div></section></section>');
}

/* ---------- Navigation ---------- */
function route() {
  const h = (location.hash || '#start').slice(1);
  let tab = 'start';
  if (h === 'entdecken') { tab = 'entdecken'; viewDiscover(); }
  else if (h.indexOf('station-') === 0) { tab = 'entdecken'; viewStation(h.slice(8)); }
  else if (h === 'arena') { tab = 'arena'; viewArena(); }
  else if (h === 'arena-rallye') { tab = 'arena'; viewRallye(); }
  else if (h.indexOf('arena-') === 0) { tab = 'arena'; viewSprint(h.slice(6)); }
  else if (h.indexOf('duell-') === 0) { tab = 'arena'; viewDuel(h.slice(6)); }
  else if (h === 'test') { tab = 'test'; viewTest(); }
  else if (h === 'test-schnell') { tab = 'test'; viewTestRun('schnell'); }
  else if (h === 'test-general') { tab = 'test'; viewTestRun('general'); }
  else if (h === 'spickzettel') { tab = 'spickzettel'; viewSpick(); }
  else viewHome();
  $$('.nav a').forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
function boot() {
  main = document.getElementById('main');
  load();
  window.addEventListener('hashchange', route);
  route();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
