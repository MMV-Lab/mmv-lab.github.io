# ---------- More fun: Learning Math ----------

- title: Komma-Labor
  subtitle: "Math, grade 6 · fractions as decimals"
  group: fun-math
  link: learn-with-ai/apps/komma-labor/
  image: images/learn_komma_labor.png
  icon: fa-solid fa-calculator
  description: What happens behind the decimal point? Find out why some divisions stop and others go on forever, race 60-second sprints against your own record, and check whether you are ready for the test. In German.

