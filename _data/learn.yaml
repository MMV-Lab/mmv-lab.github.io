# Web apps shown on the Learn-with-AI pages.
#
# One entry per card:
#   title:        card title (required)
#   subtitle:     small line under the title (optional)
#   group:        which section the card appears in (required), one of
#                   ai | microscopy | multi-omics | bio-med          -> /learn-with-ai/
#                   fun-chinese | fun-french | fun-german-adults |
#                   fun-german-students | fun-math | fun-tech         -> /learn-with-ai/more-fun/
#   link:         where the card goes. A path inside this repo
#                 (e.g. learn-with-ai/apps/my-app/) or a full https:// URL.
#                 Leave it out and the card is shown as a "Coming soon" placeholder.
#   description:  one or two sentences (optional)
#   image:        thumbnail, e.g. images/my-app.png (optional)
#   icon:         Font Awesome icon used when there is no image (optional)
#
# To publish a new app: put its folder under learn-with-ai/apps/, then replace
# one of the placeholder entries below (or add a new entry) and give it a link.

