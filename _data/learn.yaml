# ---------- More fun: Learning tech skills ----------

- title: Vom Zettel zur Bühne
  subtitle: PowerPoint in seven stations
  group: fun-tech
  link: learn-with-ai/apps/powerpoint-trainer/
  image: images/learn_powerpoint_trainer.png
  icon: fa-solid fa-person-chalkboard
  description: Build a school talk about the octopus, from the first note on paper to the stage, on a simplified model of the PowerPoint window. It teaches the thinking behind good slides rather than a catalogue of buttons. In German.

- title: Dein Werkzeugkasten
  subtitle: Tools for school and the web
  group: fun-tech
  link: learn-with-ai/apps/werkzeugkasten/
  image: images/learn_werkzeugkasten.png
  icon: fa-solid fa-toolbox
  description: Three short missions for grades 6 and 7. How a chatbot arrives at its answers and why it can be wrong, the study methods that do best in research, and how to structure a talk. In German.
