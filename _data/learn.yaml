- title: 三十四块拼中国
  subtitle: 34 pieces make China
  group: fun-chinese
  link: learn-with-ai/apps/province-chant/
  image: images/learn_province_chant.png
  icon: fa-solid fa-map-location-dot
  description: A rhythmic chant that takes you around the map of China, one stop at a time, until you know all 34 province-level regions. With pinyin, karaoke-style lyrics, and a quiz. In Chinese.

